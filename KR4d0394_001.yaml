front:
  text: 有宋福建莆陽黃仲元四如先生文藁卷之一
  hash: sha256:cc8d114adad94ee34c02768ae95b1c7c5a97ab816ed211a225092fd88963cfbf
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0394_SBCK_001-1a}
body:
  text: 夢筆記丙戌歲夏五八日午漏三刻後學黃天叟淵課兒講易罷坐而假寐夢一神人坐于龕龕音堪諦視之吾夫子燕居像也亟再拜稽首子曰女來前吾授女筆二淵敬受又拜子曰勿拜退懷其一窺其一圍徑三寸許漬墨濃甚䄂而請業於夫子偶角丱來覓句丱音貫遂覺驚喜相半乃自占曰筆者述也述事而書之者也其斯文之祥乎吾夫子筆絶於獲麟今一千八百年矣當時闕里弟子賢哲七十七人此筆奚不授孟子車軻字而後五季而上豈無大儒此筆奚不夢夫子嘗謂文王既沒文不在兹乎必如吾夫子而後以斯文為已任夢者夫人所有而聖人之夢與夫人不同吾夫子舊嘗夢見周公於斯文聞而知之乎哉必如吾夫子而後精神心術與周公胥契於寤寐之間淵於斯文未聞萬分一世古人今思執筆從二孺子後不可得安敢步趨吾夫子雖然吾夫子所以授筆於淵者何春秋感麟而作作起於獲麟則筆止於所起春秋經也續之僣或書帝正月或書陽正月皆叛經者然獲麟以後之史猶可得修乎漢司馬子長史記始黃帝終麟止而十二國世表起成周共和庚申以上傳疑矣班孟堅專志西漢史而秦伯莽盜世經微寓書法乃以更始帝著紀宜削遷固而下無譏焉唐陳伯玉自漢武迄唐為後史記未及竟亦不傳宋邵堯夫皇極經世書上稽唐堯受命甲辰為編年譜黜吕娥姁進孺子嬰以土后魏附梁以字文周附陳夫豈無見而書少帝恆山王書曹魏接獻帝或者疑焉張敬夫經世紀年夏少康出處復國甚悉所假立惠帝子不得紀元關涉世運稍大而最可議者山陽公尚存即絶漢而豫蜀司馬君實先約戰國至秦二世如左氏體名為通志後作通鑑劉道原之力居多而是非豫奪一出光手秦以前或即通志也舉要曆稽古録歷年圖俱助此書之不及其曽孫伋經緯離析圖又惟與兩漢西晉隋唐以一統然一統與正統異一統而正者若唐虞夏啇周其次漢唐與宋若西晉若隋雖一而未正朱元晦綱目於始皇二十六年大書而不分注意謂前亡後繫朝覲皆歸即為正統當送一難左氏傳終魯悼之四年實周貞定王之五年也繇貞定王戊寅距威烈王丁丑六十載間於史闕如此大缺事吕伯恭以魯史左氏國䇿史記說苑諸書修之曰大事記上接西狩下止征和漢武繫楚義帝繫高后一失一得識者自識然於周魯七國事跡疏略此史之所以不可不修繼周者百世可知或者吾夫子授筆之意其在兹乎雖然史未易修也乾坤未毀老身長在無憂衣食亂其心此夢决不貧負獨念家無屋壁之藏世多遺軼之書軼與逸同畜眼未見下筆恐未精妙惟吾夫子隂隲之俾昌斯文又昌我後之人淵遂次前語為夢筆記淵舊讀一書記夫子作孝經時簮筆拜北辰老忘所出何休序公羊傳曰孔子有云吾志在春秋行在孝經此二經者夫子二筆與孝經當時授之子輿而春秋筆削子夏不能贊一辭朱元晦謂孝經曾氏門人所記若以為夫子自著可笑之尤吾鄉鄭漁仲又疑夫子所取魯史之筆適至獲麟時欲修之而未及修然非與後乎此復夢夫子記問此事記成之明日淵敬跋族祠思敬堂記堂以祠名即古家廟或曰影堂東里族黃氏春秋享祀歲節序拜之所也堂以思敬名何祭之所思主乎敬也所以有斯堂者何堂即族伯通守府君諱時之舊㕔事某與弟仲固日新直公即仲稼公姪現祖與權朱公得之不欲分而有之願移為堂而祠吾族祖所自出御史公諱滔以下若而人評事公諱陟以下大宗小宗繼别繼襧若而人古者諸侯適子之弟為别子别子長子繼别為大宗百世不遷别子之次子以其長子繼巳謂之繼禰為小宗五世則遷大宗一小宗四繼高祖繼曽祖繼祖繼禰上治旁治下治序以昭穆凡十三代上治祖禰尊尊也下治子孫親親也旁治昆弟合族以食序以昭穆别之以禮義人道竭矣亦曰天之生物一本也子孫孫子親親故尊祖尊祖故敬宗敬宗故收族不則何以奠世系聯族屬接文獻而相與維持禮法於永年哉雖然不敬惡惡可敬所以致愛也所以致慤也致愛極其愛親之心致慤極其敬親之心而所以致愛致慤者又存乎心惟有怵惕悽愴怵惕驚動貌悽慘悲傷貌之心春有怵惕之心秋有悽愴之心故祭之前期思其居處笑語思其所樂所嗜居處笑語樂嗜往而不反非有實也豈形體所能交思之所至足以通之矣以已之精明而與慌惚交然後祭之質明比而始行事記其立敬以詘其進敬以愈其薦敬以欲身詘而為之變色愈而致其親心欲而兾其享巳徹而退色不絶於面則慎終如始矣徹退敬齊之色陶陶遂遂陶陶思親心存乎內遂遂思親心逹乎外夫如是則所思者敬而各敬爾思也若悠悠而來不蠲不享祭畢餕餘泛泛而去此豈足以稱斯堂之名之義仲元竊念花樹韋家宗法畜眼所未及見族人逺來封畛演迤扶將勿替有引學稼軒記癸未六月哉生魄天叟記學稼軒何以記記為傳君德陽作也德陽者何心田翁景周之子也不名而字之何前進士也以學稼名軒何稼農事士學之志常業也昔之民無不農之士後之民皆不士之農故九井廢四民分農之子常為農士之子常為士農農而已兾缺携儷兾邑名缺人名郤其姓也沮溺結耦雖農不農問稼於士哆然而對哆音咤大口貌吾食舊德非服先疇士士而巳此格物之學所以不明也農夫以百畝不易為憂君子以一物不知為羞不必種粟而後食也神農二十篇宰氏十七篇亦不必談與不必耒耜吾家操也丈夫二犂童五尺一犂亦不必問與稼者稼也有生之義稼之地某宜一易某宜再易某宜三種某宜五種中地一易休一歲乃復種下地再易休二歲乃復種不易美地稼之名某種當早某種當晚某種最先某熟最後稼之器曷為錢鎛曷為苃曷為槍刈曷為椎銍錢鎛田器詩庤乃錢鎛鎛音博苃音撥椎木棒銍穫禾短鎌稼之政曷用人耦曷用牛耦此二句言耕曷用貆麋曷用羊豕貆音桓貉子此二句言糞止水以何寫水以何周禮稻人掌稼下地以防止水以澮寫水坊堤也先雨何待時雨何挾先雨耘耨以待時雨時雨既至挾其槍刈耨鎛以從事田野出𬋩子周禮云聽師田以簡稽注云簡閲也稽計也又當稼事所當簡稽也有為國鄉者於苗曰少也㫬眴乎眗音絢目動何其孺子壯也莊莊乎何其士成也由由乎何其君子有為王子者於田曰深耕概種概音槩立苗欲疏非其種者鉏而去之此漢朱虛侯酒令之詞士何事曷不尚論古之人于耜納禾三之日千耜十月納禾稼其始播百榖皆豳風詩始播百榖與豳父老為周旋人卒焉起焉作勞無一日之休斾斾穟穟幪幪唪唪音捧模寫稷躬稼時物物景狀後老師耆儒塗易一字不得二詩者非周公決不能作此等趣味千載下何人獨解平疇交逺風良苗亦懷新領此惟一元亮冬菁飯之半牛力晚來新識此惟一子美東臯下潠官張杜曲此四地稼所也或視穫或𥙷畦﨑嶇往來奚空自苦亦曰士而未仕則耕仕巳又耕常也今章逢者以首苧蒲身襏襫為恥苧蒲草笠橃襫簔衣𬋩子云首載苧蒲身服襏襫此之謂農山林者以載嬪息服疆畝為名嬪婦也出嬪于虞息子也有賤息弱息不倡書中有粟之高談書中自有千鍾粟真宗勸學歌則出豆落為箕之怨語種一頃豆落而為箕漢楊惲失位怨望詩回視陶杜孰真孰僞德陽仕而巳者也俯不恥細民之賤前不慕退士之名有溪可搒進船也音謗有田可饘既耕且種還讀我書如讀山海經時在家早起憂國願豐又如詠吾宗孫子時信居寵之虛榮不如為農之可樂雖然井飲田食出作入息農曰稼士曰學百畝五畝以事父兄農曰稼士曰學耕野皆堯舜之道農桑即王道之始百姓日用由之而不知仁者見之謂之仁智者見之謂之智陶杜可謂知稼穡之興語學未到周公地位古今無兩周公德陽願學者何年年粳熟約叟重客往來阡陌尋浣花子美溪酌彭澤陶令酒相與歌風雅於碑山之南使田更夫也野叟擊壤群和曰吾儕小人亦學稼者而有此樂乎不也豈不為山中清話叟叟何黃姓淵名自號韻鄉老居士半山精舍記癸酉歲莆邑昉起學宫博士張君肖季實來丙子冬學宫成時樞相宣閫如心陳公以博士名聞于朝巳改合入宫矣居無何莆更兵燬余館外弟宇下距環泉環泉地名尺有咫後三年庚辰春博士寓環泉之南過存相勞苦夜䦨語軟時或酬倡余貧到骨博士父子不相聊少日蹙頞相告吾違父母國有年昔昔舄吟昔夜也越人莊舄仕楚而病思吟則越聲列子云精神荒散昔昔夢為國君秋半戒途無以實槖小人有闔廬曰半山精舍願徵子文輝潤捲樞余囅音侈曰子謂吾文其與可竹文同字與可善畫竹四方求者足相廷圭墨李廷圭墨能削木墜水經月不壞與遷何甚後五月又相促迫子乃更端而問曷名乎半山博士曰昔王文公築第白下門外為道之中後捨報寧人以半山名寺文公子雱死公坐鍾山恍惚見雱荷枷杻如重囚遂施所居半山園宅為寺以荐福黃太史遂稱公為半山老人吾精舍在莒溪山半因用其名名之非慕此老也然則孰名之曰杜公康侯名之且大書然則靣勢何鄉曰一水護田將緑繞兩山排闥送青來然則經營何始斷手何年斷手字晉魏以來之語凡營造了當言斷手者矣杜工部題江外草堂詩云經營上元始斷手寶應年曰先君子庀具也徒於甲午落祭於乙未歲丙午漂於水唯棟扁坌汙泥淤中濯溉如新殆若隂相遺我後人又四年己酉六月誅茅編竹苟完一區吾精舍雖不加闢成先志也然則精舍之名昉于何時曰漢仲承劉仲承也明五經隱居立精舍講教數百人辟並不就文有檀敷也家貧而志清舉孝廉不就立精舍教授逺方至者常數百人子良包咸也習魯詩論語住東海立精舍教授諸儒以之講授句絶蜀元直徐庶也庶少好俠後感激折節學問詣精舍聽習經業義理精熟以之聽習句絶魏譙東魏曹操也讀書精舍宋石璧謝靈運也石壁靈運精舍有詩云出谷日尚早入舟暘巳微武帝立精舍於內殿引沙門居之以之讀書句絶逮晉武帝奉佛引沙門內殿名義胥失之句吾精舍書室也非緇廬也緇廬僧寺也出唐李庾西都賦有田可耕有池可魚莆雖信美然非吾土携書歸隱不失故吾則走也幸余蹴然曰莒山之半甲午以前樵夫野老之所同有甲午以後巖處竒士之所獨擅端平距淳祐甲午幾何時而此舍巳荒田野草丙午距已酉又幾何時而荒田野草又為幽人之廬已酉距庚辰又幾何時間關濡滯在天一握一握小貌孤雲兩角折在天一握安知伊威不在室蠨蛸不在戶也伊威鼠婦也蠨蛸小蜘蛛也戶無人亦有之博士於癸卯壬子兩隨計吏俱試奉常屈戊辰叨恩僅授縣師家食六載方告戌期何分寸之難躋攀宦莆終更終更今考滿也假會宗終更而還遄脫選調寵晉兩階又何朝適而昔夜也至突未黔事乃大謬不然盎無儲米囊慳一錢栖栖萬狀又何頭方命薄舉翮觸四隅使瞽者揣聽又未知博士相法當何如隂陽儲與千變萬紾曷為從類曷為居方索之不得求之招搖之下然昔人觀園囿之興廢知洛陽之盛衰李文叔書洛陽名園記博士行歸故都視城郭而猶如故蒼生而各環堵豈惟為平泉李德𥙿平泉莊周回十里一樹一石喜過比鄰訪故舊或各隔異方或無家可問晨煙夕露莽蒼滅沒使人意象惘然甫也草堂杜子美草堂在咸都城外亦無顔色直有感也夫然豫聞管仲父曰定心在中耳目聰明四支堅固可以為精舍博士春秋高精力完無一點老人衰憊氣夀猶方將未已不知返子之舍種瓜采蕨穿花藉草尚憶吾天叟否秦東陵侯邵平秦破種瓜長安城東張翰曰吾采南山蕨飲三江水足矣天叟名淵姓黃自號韻鄉博士樵之拿川人名靖夫李出也為處士夢庚叔建後句可謂能為之子矣因記而授之歸且與莒山結緣庶他日不作生客子由作栖賢堂記云僕為書之且欲與廬山結緣他日入山不作生客藥房記房書室也命以藥何藥白芷也淮南子秋藥披風喻芳潔也正則屈原名見離騷九歌謂芷為藥芷楚草也一名白茞一名澤芬蜀與楚接壤而蜀産尤多然草之芳潔者何限而獨取於藥者又喻檢束約敕之義此公所以藥命房也公意若曰天地間陽為君子隂為小人君子者禮義束其心廉耻敕其躬故明光俊偉正大洞逹烺烺炳炳如青天白日磊磊落落如高山大川師師儀儀如瑞麟祥鳯嚴光李泌輩抱道懷德無營當世使人油油翼翼歆慕不已千載下芬猶未沫與小人肆而無忌憚頑而無羞惡溺深壞速然後泄泄沓沓甚虺蝪蜩螳之幽隂虺蝎毒惡蜩螳聲惡幡幡音畨輕也捷捷貪槿花石灰之榮利子雲允南伯玉諸人谷永亦字子雲譙周字允南說後主降魏陳子昻字伯王上周受命頌以媚悅武后糞壤同腐識者為之喙唾胸嘔矣猶喙之吐唾胸之嘔逆也人之為人而不别芳臭不辨清濁可與不音否也以公之識趣如此則公之律身可知巳公孝友如密李密信義如忳王忳誠直如輔孔道輔非但以政事文學表表自見於世者襟懷光霽無一點宿生葷酒而又沃以經傳芳潤故處樂如處約人不得以是顛倒之乾坤回互岷峨愴悽浮家江南澼絖之封莊子曰宋人洴澼絖善為不龜手之藥者客買其方百金以說吳王大敗越兵吳裂地而封之支離之粟莊子曰支離之卒受三鍾之粟猶得全其天年茍活其孥而公嚼蒚音刀麻餐苻蘺不改度也蒚麻苻蘺芷之别名應藥字天外飛鴻偶留方壺方壺莆為八壺之方也回首白雲浩然謝事昔人以官滿譬熱行得清凉館况脫冠珮訪林泉顧平生無一可恨者豈不菲菲兮其彌章龜鶴翁史祐陵目為八葉龜鶴翁史祐陵皆蜀人公親擢乙科見可翁史坡老以師事之蜀非無賢士大夫要非其極也公以學齊之嫡超詣諸老之右萬卷繞坐不知年數於其將行賦長短句一笻雙屨吃了離支歸去離支即荔支司馬相如上林賦云答遝離支白居易荔支圖序曰若離本支一日而色變二日而香變三日而味變四五日外色香味主盡去矣記之言本於此然而離支不如藥也離支三日則色香味俱變芷未嘗變而不芳也僕斂祍清芬有年矣因記藥房以為公别公采馨香以遺所思否公名某少中大夫前興化路總管僕則莆四如居士黃淵也年月日大德閼逢甲也執徐辰也歲白露節旦居安堂記居安者吾友居之所居之堂之名也居之鐵庵先生之世也承先緒如捧盈視浮榮不滿睫宜狐黃而緼𫀆敗絮宜膏梁而脫粟寒𦵔以是為居安乎居之曰貴者仞軒冕為素有不知包周身之防吾就吾間居庶乎安富者謂金玉可長守不知非無賄之患吾散吾積居庶乎安世故憂患來如疾風甚雨在彼者常漂搖在我者常靜以俟其定時乎携琴觴問松菊燕喜壽母樂爾妻孥此一安也時乎駕長舸並驚瀾與漁爭隈延緣葦間此又一安也時乎巾履徜徉對彌明聯句進士陳師服校書郎侯喜與衡山道士軒轅彌明指爐中石鼎聯句採松煮瀑解腰共飯此又一安也時乎蒲團曲几共逺公入社逺師結蓮社修淨招淵明明曰許飲即往逺許之遂造焉勉令入社陶攢眉而去青山白雲開遮自在此又一安也萬事隨緣是安樂法客共曰然雖若此險易之相尋也聚散之無定也幽賞之未能遂其極也心思之不可囿而滯也尚有大方之家數仞之墻長高深廣平闊無閡音礙藏修時教時必有正業息遊息退時必有居學惟意所適是中固非坐馳所能止止不止於當不㑹於極此為以應坐之日而馳􅕽不息謂之坐馳止止集也亦豈視為蘧廬者所能托宿蘧廬猶傳舍止可一宿而不可久處肯堂肯構嗣前人功出門如見大賔入虛如有人敬常勝怠志常帥氣我常為主物常為客則安居也廣宅也余敢以是為居之勉易曰君子所居而安者易之序也孟子曰君子深造之以道欲其自得之也自得之則居之安君子一也由易而進孟子之天居之安者渾然之本所居而安者粲然之用由孟子而進易之地居之安者至之之事所居而安者終之之事非所居而安奚居之安惟居之安故所居而安富貴行乎富貴貧賤行乎貧賤患難行乎患難斯謂居易以俟命為子止孝為臣主忠然後東西南北不擇地而安豫敢以是為居之勉雖若此相與居由乎詩書之府安處乎道德之奧豈可無孟獻子之友哉孟獻子有友五人皆無孟獻子之家者也必得無獻子之家者而與之友則仁者助守義者助行智者助謀勇者助決使閒居不為不善宴安不懷耽毒又使賢子弟日見所未見聞所未聞來者弗納於邪庶幾稱斯堂之名之義余敢以是為居之勉雖若此時運之盛巳隔天外文獻之遺猶在眼邊丁斯時也四月維夏六月徂暑秋日凄凄冬日烈烈升斯堂也思昔之遺我以安者今如之何燕燕居息勿替引之也其為感詠深矣何如居之曰願識斯語以俟他日居之名廣翁豫則四如居士黃善甫年月日則已卯丁丑小孤山記天叟知命之年外兄孤山處士記余韻鄉授使者曰為我語天叟以孤山記見還諾之宿明年夏五孤山又自以記來風月花鳥松篁泉石一一在眼携孫課詩對客論文二三社翁乞火煮茗如畫入圖想吾孤山杖屨相羊徜徉其間豈復更知有塵事抑前此日舒風薰居雖尋常之室食雖苟簡之田老子曰食於苟簡之田苟簡易養也注云且從其間故易養古梅橫前老柏樹後雲榖春亭或釣或弋或琴或歌或同雞豚韓愈云願為同社人雞豚宴春秋或持杯螯車螯海蛤畢卓云左手持蟹螯右手持酒杯睥睨天壤評裁古今藉有問豫何事栖碧山笑而不答心自間二句李白詩吾孤山不失為幽人之貞龍蛇起陸天地反覆貴豈不仁視汝蓬蒿局高脊厚猶恐鎮厭音壓濺淚驚心何可賞識孤雲縱海都無定出個青山入個山吾孤山雖有此不樂也今水雲黑白霜樹青紅此和靖孤山景物之嘉吾孤山之景物猶前也吟中看山睡起引鶴孤山閒靜之趣吾孤山之閒靜猶前也踈影橫斜暗香浮動孤山詠梅之清淡也吾孤山之清淡猶前也非秦甲子有晉春秋孤山著述之語吾孤山之文之學又猶前也山叟寄藥野僧留詩孤山約客之詩吾孤山之友之客又猶前也所居無古杭西湖之勝吾孤山獨甘陳舊也槁枯也之味其世非景德真宗天聖仁宗之舊吾孤山獨成嘯傲之趣和靖當景德天聖季孤山古杭西湖間有林處士墓在明南京戶部莆黃女墓祔東於此可以言有道矣和靖千載人後來者未能或之雙吾孤山與之並行清亦清乎哉高亦高乎哉雖然前孤山易後孤山難心事數莖白髮生涯一片青山二句林和靖詩焉知此樂不自苦中間來乎俗人不知吾孤山者叟知吾孤山者造廬有約當分孤山一半張乖崖見陳希夷請分華山一半對兄劇談且以記往記到童子放鶴林逋常泛西湖有客至逋所童子延客坐開籠縱鶴良久逋掉小船歸俟孤山歸刻之石上曰黃淵作一粟窩記大化起伏隂陽錯置此二句冒下分二股人民草木澌澌泯泯而農不廢一股天下學士逃難解散而書不廢一股隘巷平林稷獨成人千載下為田家師此假應農不廢意始皇斧六國肉老伏生竇氏抱遺經倚巖穴秦焚書至漢文求書時惟濟南伏生老不能行口授眺錯二十八篇又何內女子得泰誓一篇獻之山堂漢一再傳猶活此假應書不廢意乃知人生定分不應餓死溝壑死兵革者天與人俱不能殺而憂患風雨窮通寒暑正農者之時也此總約上二意而末歸之農以農兼書言也進士方君芳年華月坎壈音覽於時屋隘如困書富如京磨丹漬墨日田其間暇日語余秦菁曰種一粟而千萬之粟滋吾以命吾書窩庶生意兮方將四如居士幸印可居士曰一粒之粟道何從來生於寅壯於午老於戌其蓄而弱也欲相與俱其熟也欲相與扶堅好頴栗然後刈之盈手㫪榆簸蹂然後米而藏之可易易得乎此應首假言農聖而少壯老堅如仲尼十有五至于七十猶非一朝一夕之故夫人焉可須臾不學此應首假言書深耕熟耰穰穰在秋寒之落矣然而有稷有黍有禾有秬農視其穫先視其播此言農人莫不讀書六經歟五榖也諸子百家歟稊稗也此言書末事言讀書世有一輩人漫不省立身行巳大丈夫事日出小技驕稚朋儕文章滄海一粟爾焉能名世此非讀書者又有一輩人好利惡衰厭苦逐樂色色墮無名種子中虛名浮利世界一粟耳何足介意皆非讀書者此亦非讀書者故結曰皆非讀書者吾家山谷嘗云吾輩但勿令書種斷絶若夫成功則天居士試著轉語看下何種百丈和尚作一頌之此三轉語又云請和尚代一轉語某曰此真一粟窩記大歲巳卯土正月丙寅火十六甲子金書于種讀所劉氏厚堂記劉氏厚堂成有年矣歲壬午吉月之陽朔吾友有實始來謁記韻鄉老人黃淵曰古立厚為垕字從土宇宙間最厚者莫如土故居中宫而生百昌古尚書說吕氏春秋以土為心心官天地府萬物故厚前千載巳往後千載未來人所傅者心耳世之論人子孫嘗推本其父祖曰世德之積也書澤之深也說厚字以世德之積書澤之深作骨下以傳人敷演二意此一篇大㫖余謂父祖之有子孫不過傳身子孫之肖父祖斯謂傳人傳身者一氣而屬同體而夀傳人則心之廣大實似之父祖猶夏屋有傳人則後弗棄基父祖猶喬木有傳人則枝葉類本根忠信孝悌皆為世德後之人亦必行忠言信入孝出弟以培其厚否則陵矣仁義禮樂皆為書澤後之人亦必率仁由義立禮成樂以養其厚否則不肖矣雖然傳人難事也伊之後一陟吕之後一伋曾之後惟參與西孟之後惟軻上而世德之厚莫厚於周公其從來非一朝一夕伯禽君陳於書僖公於詩差强人意大而書澤之厚莫厚於孔聖廟食幾二千年鯉也詩禮伋也中庸次則安國也頴逹也傅疏間代乃始一見俗日下無西周之文獻道日喪無洙泗之淵源傳人抑又難難建慶隆貴時萬石君尚無恙未再傳而孝謹衰慶為相時子孫為小吏至二千石者十三人慶死後稍以罪去孝謹衰矣太丘聲譽如雷公慙卿卿慙長實子紀為大鴻臚紀子群為魏司空天下以為公慙云云位益高名益下德渥於前而薄於後也韋孟至賢一經始振鄒魯少子為相殊又不及乃翁韋孟作詩諷諌楚王戊自孟五世至賢賢號鄒魯大儒後為丞相致仕少子玄成歷位至丞相守正持重不及賢河汾家世畤傳中說勃名文章成就堇堇音謹耳耳學於昔者未深而今尤淺也人又有言傳人非難天分良難便儇皎厲非進道之資碩大且儼斯載道之具望之太山喬嶽必廊廟人聽之黃鍾無間必禮樂器吾多之應載道之具句言厚濯濯春柳類美少年飄飄遊雲類淺丈夫吾劣諸應非進道之資句言不厚昔退之叙北平王三世鸞鵠之停峙視龍虎之傑魁蘭芽之茁秀視竹梧之翠碧人物巳有次第書澤世德又不與焉余曰比目論非以心論德勝氣雖言呐不出口而稱為長者學變質雖容貌不能動人而人不敢輕其書色厲內荏者無德以將外澤內粗者無學以充資禀政不足恃也鑿乎造理之言讀之斂袵起敬劉名家福門有實雅子聞孫前徽未沫音昧微晦也手澤猶存然德難嗣也細不矝大之纍惟四端可以廣心書難繼也術少差學之偏惟六經可以養心兩漢而下不足學孔周而上不易學此二假又特立議論道味自别余願有實之滋世德近如韓門之持國范氏之淳夫馬家之公休然後謂之傳人又願有實之衍書澤近如吏部朱松之文公松子元晦太史吕本中之成公中子祖謙諡成忠獻張浚之宣公浚子栻然後謂之傳人誰謂華山名高企其齊而且詔子孫孫子無斁有實號梅翁北山先生嘗目之為良壻云文字如精金美玉長江大河誠一唱三嘆而有餘音敢不莊誦委成齊記天叟記厚堂之明年有實更名希夷且命其息游之室曰委成齊齊一榻旦盥靧音悔即書所謂頮靣巳爐熏燕坐徐呻呫音帖畢呻吟視簡謂之畢吟誦所視簡之文見學記少倦假寐覺又翻架上之書矣翻之帑亂取孔子西藏書周室往見聃之不許翻十二經以說性淡泊未免與世闊踈客去亦睡客來亦睡知者不以為簡時升沉所以卷舒由我是非一切斷絶日夢遊乎無何知者不以為放叟曰委成二言於書奚自於義何居委和委順宋人子休外篇語也子休莊子也書有內外篇委和委順乃外篇知北遊中語郭子玄曰明委結而自成耳成玄英曰天地隂陽結聚和順之氣成汝身形性命委成之名昉此乎人身藐然與天地通乾坤吾體坎離吾用坎精離氣坎泉離火以神運精與氣自然凝成內丹後漢伯陽故借爻象納甲之法以寓行持進退之候委成之義昉乎此莊北遊云身是天地之委形生是天地之委和性命是天地之委順子孫是天地之委蛻魏伯陽作參同契二卷其說似解周易其實論作丹之意有實曰唐儒孔氏疏儒行記以委訓聚近世賈氏群經音辨以委訓隨聚一義也隨又一義也宇宙中間成者自成果孰為之又孰使之天地有時傾陷山川有時震墜日星有時隕蝕蒼狗浮雲浮雲如白衣斯須變蒼狗滄海桑田古有此事氣運有泰有否世事有險有易人境有逆有順前侯後瓜蕭何傳邵平者故秦東陵侯秦滅為布衣貧種瓜長安城東朝耕暮相寧戚飯牛扣歌牛角桓公聞之舉以為相又有此事詳言之萬事萬理隨其自然約言之强曰委成吾之委成意而子之乘成意而子賢士也乘成乘可成之道冉相氏之隨成也冉相氏得其環中以隨成冉相氏古聖王居空以隨時時自成叟又曰隨其自然為天理行其自然為人事天理通徹人事棄置以栩栩然為夢栩栩喜貌蘧蘧然為覺蘧有形貌吾謂汝夢亦夢汝覺亦覺有實曰無視無聽抱神以靜所以正形無勞爾形無搖爾精所以長生此六句廣成子之言出在宥篇無視三句言忘視聽而自見開則神不擾而形不邪無勞三句言任其自動故間靜不夭廣成子之卧非卧也卧時工夫起時受用吾之委成如廣成子然後可以言天叟又曰子舍伯陽而學子休乎有實曰學伯陽而不成則不運吾身自然之水火而術流於幻妄學子休而不成則不逹吾生自然之性命而談入於玄空亦非也吾全吾真吾養吾氣在我者存其自然在彼者隨其自然不必學伯陽不必學子休但學希夷先生斯可矣雜家小說多謂先生睡或半載數月近亦不止月餘不知真人無夢至人無睡東方未晞顛倒裳衣不容不欹枕看兒戲耳叟亟搖手愼勿多言且打一覺睡扺别人三覺睡讀書堂記堂以讀書名何吾宗春臺居士至樂之所也堂祠文公朱氏讀書二字公墨蹟也春之韶夏之薰冬之餘居士課子若孫各治一經非城南燈火之陋韓文公送符讀書城南有燈火稍可親之句有彭澤種讀之間陶淵明讀山海經詩云既耕亦巳種時還讀我書異流俗矣雖然讀書二言昉於何昉乎魯論書何書文籍既生以來豈無書乎唯詩書禮樂易春秋耕桑之文所謂布帛之文粟菽之味者也行世杲杲人誰不讀所讀者又何秦焚項炬漢儒𥙷葺樂竟亡傳他非全書傳注固不可無然亦難以盡信書存孔孔安國傳書五十八篇謂之古文尚書蔡氏曰今文多艱澀古文反平易禮守鄭漢末鄭玄傳小戴之學後以古經校之取其於義長者作注為鄭氏學易宗輔嗣王輔嗣注易上下經著易論五篇詩主毛鄭趙人毛萇善詩作古訓傳是為毛詩漢鄭玄注毛詩箋謂毛詩鄭箋春秋惟優左杜左丘明為春秋傳三十卷晉杜預為經傳集解發明甚多古今稱之抵牾半矣䜟諱雜之騖高逺者欲徑造不屑讀安卑近者止記誦茍焉讀穿穴新竒者讀之僻勦說雷同者讀之雜皆非也我思古人尚友千載魯中叟由志于學至不踰矩或十五或十年自覺其進而人不知顔氏子𥘉仰鑽瞻忽中博文約禮終欲罷不能曾之至善自格知正心誠意始思之明誠自學問思辨篤行入孟之聞知自居安資深逢原來言言六經句句六經後乎此文公集周邵程張之大成者也詩傳凡幾折衷本義最為簡要經傳通解卷猶未完書止三篇與皇極辨春秋不敢直下注腳於四書用功良多雖暮年猶屢刪改惟山林之日長故學問之功深斯文之宰主也止有斯人居士喜讀文公書者然當循序致精居敬持志因文公師賢聖因賢聖師六經虛心􅉼泳乃得自趣之妙切已省察庶不當仁之讓書特陳迹耳雖然天下未有無用之體亦未有無體之用講道撫世元非兩事㫷月之可孔今時之易孟聖賢正患不用用則臯䕫稷契伊傅周召擊壤云邵堯夫詩集欲為天下屠龍手肯讀人間非聖書居士其印可余言余即記文峯書堂者於居士為同姓伯仲遂筆而授之俾刻于堂之左還笏樓記前民曹省吾葉君書樓藏諸峯間以還笏扁徴余記一再余曰環樓皆山獨名笏何省吾曰笏山起於東南環內而面斯樓也矗矗又山之傑然者古字假借環還通用音亦相通故名余曰笏君家故物也取義於還猶還氊之義與雖然古者以適公所執笏書思對命備遺忘也大夫魚須士竹象魚須竹象皆笏名本制有等差豈以此為龍光哉古有龍復本者無目凡象簡竹笏以手捻之必知官祿年夀疑龍光即此人也出南部新書下之世歲時家宴積笏榻上唐崔琳每歲時宴于家以一榻置笏重積其上臣主問答亦曰笏余公靖奉使入辭書所奏事于笏各用一字為目上顧見問其所書者何靖以實對今甘棠猶謂此家寶也魏徴五世孫謨對文宗曰維故笏在帝曰此笏乃今之甘棠為子若孫而知寶之則知得之難而守之又難䇿天子廷中進士第然後賜笏通籍升朝銀緋金紫然後以象易槐得之難如假秀實朱泚欲僣位假秀實以象笏擊泚流血𬒳靣如顧少連裴延齡方橫少連曰秀實笏擊賊臣吾笏擊奸臣如孔道輔道輔為寧州推官真武像有蛇穿其前郡將帥其屬奠拜之道輔楊笏碎蛇首然後無負此笏不者倒持手板汗流沾衣桓溫將移晉室王坦之欲于座害之垣之倒持云云豈不有辱此笏信夫守之難難或曰還笏有固實乎曰昔有諌立昭儀叩頭還笏帝欲立武昭儀禇遂良諌不納置笏殿前曰還陛下笏丐歸田里芳名姱音誇好也節焜耀史册守之矣若但以昔之得兾今之還此特淺淺者誇詡庸孺耳一時富貴如槿如灰孔光張禹輩不為三公邪省吾名嵩甫文昌東石公之嗣東石之學之行之節鄉前修尚能言之正不以奮高科登禁從為此笏榮也省吾學聖人學久處約而不移長處樂而不淫亦不在笏之還未還也余語省吾酌酒祝此山曰山亦有知日當料理又酌酒祝此笏曰笏如有知勃然而起是為還笏樓記年月則大德丁未孟陬正月音諏余名淵字天叟自號四如老人七十七醉作此筆孝節郭公祠堂記天下前代名人遺跡不得毀折此至元十三年閒令甲也行臺楊監察某過莆廉訪商副使某案部俱諉博士郭廷偉重建乃祖孝子坊祠此大德元祀年也孟冬二公所教屬也人世有新故民彛無今昔孝之原情性關風俗如此聖上之宅天衷位人極以此君倡臣和氣感機應興化厲賢鑠乎盛哉昔孝節公之葬母夫人而廬于墓也亦曰母之於子也常𥙿子之於母也𥙿猶不𥙿子貢心喪其師冡傍築室尚未忍離况母喪未期乎瑞露降慈烏馴明神知之殊類知之公不知也若國子生若邑大夫若守師悉以氏名送官朝省知之公不知也公以大學生客于錢塘聞母喪徒跣奔歸一慟輒嘔血聚土為墳廬其旁甘露降于墓上烏鵲馴集紹興十三年郡上其事表其間閭表門閭傳國史復其身及子孫天子知之史官知之公不知也是心何來事亡若存誠至慮一唯知有母耳今博士君之敬其五世祖也亦曰自高以上服簡情疏此陋儒耳目之學人而忘夲非薄則誣小戴禮云顯揚先祖而不論撰先世之美何以朂後之人博士君之名亦豈待記而重然精神氣貌議論風指有光慶胄家庭愈恱洞洞屬屬前乎此迫從王事祗畏簡書朝望夕思與雲俱至昉乎此有薦于朝辭牒歸養此豈慕人爵以為親榮哉昔齊聘曾子輿為卿而不就曰吾父老句食人之祿則憂人之事吾不忍逺親而為人役子輿所以為孝博士君之學子輿之學者如之何不書四如翁黃淵於是喜為公記且羡公之有聞孫也公諱義重字處仁行義年則鄉先逹艾軒老筆炯炯此不書博士字景文滄邊其號前甲戍進士兩任清漳儒學教授堂顔則儒學提舉吳濤書年月日則辛丑孟春初吉仙遊縣學尊道堂記莆邑三仙遊為壯邑舊廟學直縣南百步許學有尊道堂世變風移講肆馬隊周續之與學生講禮加以讐校所住公𪠘近於馬隊過者唶唶至元丙戍邑長官雖搆禮殿於講堂猶未皇也大德壬寅秋文學掾方平釋菜云初鄭注云什菜禮輕也惟什蘋藻而巳無牲牢幣帛凡始立學什奠先聖先師及行事必以幣正義云天子出征反什奠于學以訊馘告注云什菜奠帛禮先師也職思其憂亟謁之郡府佐孟某幕掾孔某檄縣起廢慮材計庸揆日攻位是年冬也癸卯春令尹王某來官官事事李贊府某又從臾之逮良月輪奐美凡為間五楹草有八深尺五十廣倍其三不侈不陋袊佩欣欣然曰是不可不記學耆宿徵記於天叟黃仲元叟謹記曰夫子之道日月萬古著在人心不以有堂而後尊士而自尊其道是即尊夫子也與夫子並世者尊吾道獨子貢一人耳去夫子未逺者尊吾道獨孟氏一人耳為子貢且難難况孟氏乎升斯堂者如子貢與孟氏而後夫子之道尊不者武叔子禽之徒此堂得以移之夷之相辛之學此堂得以攻之雖然此為學子言也若夫宰百里者皆以吾夫子學道之語而俾習弦歌此堂孰得而議之長庠序者皆如吾夫子學不厭而誨不倦此堂可得而譽之必如是而後夫子之道尊子曰尊五美斯可以從政矣宰百里者而記斯言又曰謙尊而光卑而不可踰長庠序者而記斯言又曰君子尊德性而道問學為學者而記斯言庶無負昔人命堂之意堂顔今孰書之僉事張公某也又孰立之郡侯史公某也令佐後期㑹先教化文學賢稱前文學椽方平也前於永陽修泮水愜輿誦今斆兹邑獲上信友又起學宫學宫學之官舍也文翁修起學宫於成都俱可記年月日甲辰清明旦莆田縣廟學聖像記莆邑舊未有學儒隸郡博士弟子員逮學官成天地輿薪矣學左為廟廟者貌也先聖先師之所宴娭先聖夫子先師顏曽思孟娭音依漢安世樂神來宴娭顔師古曰戲官吏師生朔望奠謁春秋薦幣唯謹至元癸巳教諭高元子感夢之明月始繪泗水侯右方三十五人于廡之右單父侯左方之十五人于廡之左巳事舍菜頌禮威如按孔象唯家廟小影為真聖胄亦曰先君生無須眉天下王侯不以此損敬生並世者又曰修上趍下末僂後耳老萊子弟子出薪遇仲尼反以告曰有人於彼修上云云視若營四海不知誰氏子趨音促下短也上謂頭前未謂背膂耳却近後漢成都學始有石刻席地跪坐唐開元像先聖堂西東向先師則東北南向有神位而無像設下之世雍泮都邑偶塑轉異美髯長髭未審奚據從祀雖應禮圖歲深人古太史公亦謂鈞之未覩容貌不知有子果似聖人子羽果狀甚惡子羔果長不盈五尺不也然道貌天形非有縱目卭鼻四手八足之怪但生知者為聖學知者為賢耳形狀末也心之誠與洋乎如在心不誠與視而不見諸賢來於宋齊衛陳蔡秦楚之邦與魯君子學道洙泗之上立問坐答更唱迭和論語二十篇儒羮墻也遊斯廟者求諸心踐諸身有孝弟為仁崇德辨惑者不有三復白圭克伐怨欲不行者不有君子若人吾斯未能信者不有行不由徑舍瑟詠歸者不皆入或教不先承不謹侗好佚邇宵人非明正之徒為宵夜之行列子顛冥富貴相鹽以利者勿入非裘點之於旅語禮記孔子射於瞿相之圃使公罔之裘序點揚觶而語裘曰幼壯孝弟耆耋好禮不從流俗修身以俟死者不在此位也點曰好學不倦好禮不變旄期稱道不亂者不在此位也亦魯薛之令弟子辭也儀禮古者賔主投壼以弟子年稚者或相褻狎故令魯薛戒今之曰母撫母敖無偝立母踰言元子莆之良奧者當事自當爾何敢以闕牢禀辭講堂齊廬門序瓴磩音戚石也俱欲華好尚藉力於令長二朂哉無斁月日不書自得齊記自得二言何始乎始於放勳命契之辭也然猶有待於使然而後然也宇宙中間鳶飛魚躍蟲兮能天物之所自得者也昭文於琴莊子曰有成與虧故昭氏之鼓琴也無成與虧故昭氏之不鼓琴也柴桑於酒柴桑淵明所居採菊東籬見白衣送酒而喜謫仙於詩李白號謫仙李陽氷曰太白多天仙之詞馳騁屈宋鞭撻揚馬千載獨步惟公一人而巳人之自得者也扁斫輪梓削鐻鐻樂器形似夾鍾削木為之痀瘻纍丸又精於伎者之自得也况有道者乎子思子無入而不自得此以人事言也子車子深造欲其自得此以天理言也天下無事外之理亦無理外之事素位而行觸事而與理俱左右逢原理熟而隨事見由上下察而極於無聲無臭之至由根於心而形四體不言而喻之妙之二子者所得有自來矣進而求之子淵子其未得也仰瞻鑽忽既得則欲罷不能如有所立卓爾上而求之吾夫子生知而猶志學其未得也發憤忘食既得則樂以忘憂不知老之將至豈但簞瓢陋巷疏食飲水而寓自得哉前二子者之言自得趣固不淺一聖一賢之不言自得味猶深長自之為言由巳而不屬乎人得之為言誠中而無待乎外晞聖與賢正未易易下之世元凱晉士耳其序左氏傳謂將令學者優而柔之使自求之饜之飫之使自趣之若江河之浸膏澤之潤渙然氷釋怡然理順然後為得此豈惟讀左氏法凡讀六經四書皆然元凱惡足語此河東李侯以文獻之餘襲風聲之舊窮理之學常惺惺經世之志活潑潑蓋難與俗人言故命其書齊曰自得夫豈自得之名之贅記之又贅然不記則無以見左右逢原之天素位而行之地又無以見所樂者何於是濡筆記之余即記虛巳遊世之堂者名氏與年月日不書文妙絶今古愈讀愈有味虛巳遊世之堂記貟嶠號李侯名所居堂曰虛巳遊世余耄矣不及登侯之門兒梓至自鐔津傳侯教曰歸語而翁為記數語余答梓曰斯堂斯名合內外之道廓乎大哉虛巳者無為也遊世者無不為也巳之所以虛者心心之所以虛者道猶之水以虛而明須眉可燭猶之鏡以虛而鑒肝膽亦見不知巳之有我但見宰之者天巳之外皆人也巳生於人世不能不與世接既與世接不能皆靜而無動皆休而無作皆處而無出於是乎時與之遊焉然是遊也非奔車之上非塵垢之外彼為嬰兒此亦與之為嬰兒彼無町畦此亦與之無町畦為嬰兒喻無意無町畦喻無威儀皆謂其不小立圭角也而是非不亂於心利害不變於巳未嘗為種種者役役者好知之亂天下舍夫種種之民悅夫役役之倿雖人之合即天之合也孔孟之道不行學鄭列宋莊書者皆曰吾虛湛寥泊可以遊方之外不知之二子所謂虛者有仁義無嗜欲不將不迎以道集虛泰宇定而發天光德宇泰然而定則其所發者天光耳非人耀又不知二子所謂遊者觀其所變非觀所見或出入六合九州或縱觀江海山林順人而不失已莫非與天者遊學是書者何嘗夢到莊列妙處侯無書不讀眇乎二書亦造其微謂莊即列也養生主即虛巳之道養生主人間世皆莊內篇人間世即遊世之方惟至人乃能遊世而不避順人而不失巳注本無我我何失焉唯虛巳故能遊世雖遊世而實虛巳故托莊書四言以扁斯堂反而求之易大傳寂然不動感而遂通天下之故之二子且反高閣梓其為余謝侯之屬可則書於堂顔之左不者雖帳下兒勿與之讀劉􅍮州作書與孫䇿示禰正平平曰將使䇿帳下兒讀之邪使張子布讀之邪侯倜名士弘字河東人前集賢侍讀學士今中大夫南劒路總管員嶠真逸其自號也歲至大戊申月孟冬癸亥日庚子望莆四如老人黃淵彥安七十八筆篔音員竹名谷記莆之支邑曰游洋其西有山兩谷對峙俗號谷目境與人勝而陳氏族於斯西軒先生與老艾同一輩人邑庠祠之裔孫仲和名以節字屋後有竹一畝取文與可名竹之名自號篔谷兩為儒祭酒今兹再調鄞江學正此豈足為以節榮哉將之戍告别於叟叟贈言曰竹之類三十九而名亦夥篔當其一也房千里竹室以氣為主白樂天養竹以賢為異然皆不如衛詩之興君子去之二千餘載想其人而不可見而竹亦無知音者晉賢之遊溺於酒流於虛於竹秪辱獨二仲房白也差强人意又不可得而友矣唐賢詠竹最多唯錦里翁淨香一聯最為絶唱杜少陵詠嚴鄭公宅竹詩雨洗姢姢淨風吹細細香竹之淨易吟也竹之香誰嗅哉大抵人生斯世同流合汚皆非豪傑之士唯特立獨行而拔乎流俗然後可以對此君也王子猷曰何可一日無此君孰不種竹而比之以千戶侯陋矣史貨殖傳渭地千畝竹其人與千戶侯等孰不愛竹而比之以十萬丈夫鄙矣杜牧喚竹為軍中十萬丈夫坡仙云無竹令人俗士俗不可醫篔谷非俗士也知谷者愛谷者第以詞翰器之則俗矣竹惟淨故不俗以素衣而染緇塵乎陸士衡詩句竹惟香故不俗不流芳而遺臭乎其知竹者愛竹者當以此而觀篔谷谷家有留隂堂西軒賦之雅子解褐班斑有文句絶王謝子弟生長見聞霜雪貿貿不改其度美哉斯堂伯夷之築叟敢以此贈君知谷者愛谷者如羊裘則持以出客蔣元卿舍下竹中開三徑有羊仲裘仲者與之同遊蔣許字元卿不音否則不顧主人而去時屠維巳也作噩酉也歲余月芒種日韻鄉七十九翁黃彥安記叙竹以淨香二字作骨以知谷愛谷為意中用事宛轉反覆讀之味雋永昭武危西仲寄傲軒記靜寄東軒春醪獨撫此避俗翁停雲四言也嘯傲東軒下聊復得此生此避俗翁飲酒五言也避俗翁謂陶靖節停雲四言飲酒五言皆陶詩東坡嘗和之東軒翁疇昔琴書之所故時時寄傲於其間翁之寄以天翁之傲以天倚南窗以寄傲審容膝之易安此又翁歸去來兮第一章也不知翁者賞識其文知翁者以退為高無有解音害翁韻者翁辭三章俱寄傲者也停雲四言乎哉飲酒伍言乎哉此翁胸中度世於道悟入悟入神間意逺邈出宇宙未可與俗人言坡老和翁四言五言風味大略相似及和翁辭自許為翁後身畢竟道著翁意落在何處此十字為一句後來坡以寄傲為軒翁千載人坡亦百世士也坡去翁幾何年叟去坡又幾何年揭天地以趍新負山嶽而舍故宦于東嘉之歲叟以歸去來為幸活于環泉之歲叟以得此生為幸門無舊雨之車時誦停雲之句新吾大殊故吾六字一句以新故為字眼寄傲之樂無有乎爾後十年丁亥客至自樵曰族危氏不逺徴記於天叟黃淵叟問所以記何曰記寄傲軒軒以寄傲名何曰先世聞家也今猶鐡爐步拏川福地也今非小桃源矣禽戀舊林魚思故淵人兮能無情乎背山面溪架樓敞軒略容卧起煙雲獻狀風月入懷差侑觴詠樵漁寄此生不是傲當時叟曰子不誦避俗翁語乎寄非如子休所謂軒冕物之倘來寄也子休僐性篇云軒冕在身非性命也物之倘來寄也傲非如退之所謂既傲翰林又傲相國也亦非視世直逆旅與夫林泉人物草木蟲魚託興以為寄亦非離人立於獨與夫談諧雜俗醒醉相笑以為傲倘解翁韻唯我與爾或忱唐虞上或問魯中叟或結耦沮溺或多謝綺角子之寄此翁之寄或稱葛天民或乘藍輿入州或與田父飲或掉頭逺公社子之傲此翁之傲或仕則求吏不為嫌或隱則解綬不為矯或無則扣門而謁食或有則雞黍以迎客子之寄傲此翁之寄傲雖然子車馬有行色韻處恐落翁後有兄可友有親可娛有田可粟有溪可漁有軒可吟有案可書在世無須言息其廬庶幾樂此翁之樂歟不爾畏途馳狂歸路夢迷子身客寄乎東西何時傲笑乎山溪乃記翁語以壯客歸客名公鎮字西仲鄉貢郎南仲之季在軒黃君之後也叙事精密清妙詞約而理奧讀者宜玩索命隱室記命隱室何處士林君讀書所也隱之名多矣其上聖隱其次賢隱談隱斯為下楊子雲曰聖言聖行不逢其時聖人隱也賢言賢行不逢其時賢人隱也談言談行不逢其時談者隱也不耀天隱未及於聖文中子曰仲長子光天隱者也無往而不通矣子光字不耀王通時人季齊名隱殆庶乎賢或問樊英名隱子曰古之避言人也英字季齊明經書推步順帝徵不出隱壺山不求名曼倩東方朔人隱談者之流問東方朔子曰人隱者也詭迹混俗不求自别衆人非天非名非人而以命隱蓋不怨天不尤人而不求名之人也之人也伯休邪韓康字伯休漢桓時人采藥名山賣於長安市口不二價君平邪漢嚴君平隱於城都以卜為業日得百錢足自養則開肆下簾講老子伯休隱於醫君平隱於卜隱於醫者活人隱於卜者知天然而二子者不可得兼援引隱事類鑿出非宿學不能昔有河汾隱者以銅川夫人好藥始著方以芮城府君好隂陽始著曆銅川夫人通之母芮城府君通之兄也為芮城令儒固無不通也之人也殆若人與前說隱後說命以芮城引起自是用意不泛雖然學醫者人費談何容易視色而名不出家視毫毛而名不出門扁鵲答魏文侯曰長兄視色而名不出家仲兄視毫毛而名不出門今有斯人乎否太史公傳秦民淳于氏不與日者龜策傳接或者疑之過矣三命是律五星是曆律曆猶可談也人為萬物靈雖天之高星辰之逺千歲之日至人能測之律造於伶倫曆造於容成甲子始於大撓星算專於師曠逮軌革之書出管輅字光明漢魏時人善占術軌革之書乃其所著也前千萬年之已往後千萬年之方來興廢盛衰治亂禍福皆於此乎占凡人𥘉生年月日辰生勝衰旺窮通夀夭亦於此乎推太史公至軌革數假專為命字立論此與林處士室占地步作文不可無此意謂有耶未必有謂無耶非果無聖人不言命賢者安乎命人不能皆聖賢也然後決於命惟決於命召之在前命之在後斯自取爾善言命者莫如易澤水困君子以致命遂志水在澤下拗堂爾所以困君子居之拗不平凹也莊云覆杯水於拗堂之上芥為之舟以莫之致者聽之命以所得為者遂其志不恐懼於險難不隕穫於窮厄從吾所好而巳故困而不失其所亨此吾處士名其室曰命隱之意引易以下才結本文命隱之意闔闢變化自是機軸記者誰韻鄉老人黃天叟淵也年月日不記灌畦記州東行不百步有進士家曰歐陽氏治其書室榜曰灌畦蓋當家事也來速豫記凡四月餘眂即視字畦之齊縱橫一席地經史筆研外無敗意物說畦之齊畦之所廣四尋有半深半說畦之地畦之𬞞早韭晚菘可𦵔可湘說𬞞或問菜味周顒曰春𥘉早韭秋末晚菘淹菜為𦵔湘烹也畦之花春蘭秋菊可佩可觴說花夫婦持甕出汲老奚僕名剖竹走泉稚子掬水弄月說灌畦可入圖畫客時外來酒三行嗅花而去斯人也而有斯樂也結上數假然吾聞勺水濡沫不如甘澤之流澍音注機舂潺湲不如天瓢之滴瀝人力所至不及則渴過則溓音粘泥黏也不如空中揮灑無有踈密天有時以生有時以殺天有時以生陽一墟而萬物生有時以殺隂一吸而萬物殺日出杲杲時田汚萊民菜色一草一木亦為燋卷枯槁天有時至枯槁句作一假不屬下文賜也桔橰子貢告洋隂丈人曰鑿木為杭前重後輕挈水若抽名為桔橰俯仰隨人幾何膏潤枯橰下二句說桔橰之勞當作一假甫也連筒杜詩云連筒灌水園甫少貧客吳越齊趙客秦州負薪採橡自給南北羇遊不皇寓息連筒下二句說連箇之勞作一假樂乎不也春膏脉脉堯之壤周之野惟夭惟條實苞實茂東阡西陌件件生意奚獨此畦之人之𬞞之花十字為一句主人逌音稱然曰斯時也富者園池不復守貧者置圚儲糞之所無所吾灌吾畦猶有䓤肆可業一假吕僧珍出身甚微以販䓤為業逮貴封侯兄子求官僧珍曰汝等自有常分但當速歸䓤肆不聽其求有饑未及夌者有致書吾求薤者吾灌吾畦猶有菜根可咬二假夏屋渠渠壞垣納車汚敗縻毀吾灌吾畦有馬逸踐吾葵否三假魯漆室邑之女曰昔有客馬逸踐吾葵吾終歲不飽葵井邑聚落旦暮吏來呌囂墮突吾灌吾畦有催租人敗吾菊否四假天公憒憒殊不可曉吾致吾力無妨吾畦此四句結上四假余對以易坎陽一隂二為雲為雨此二句說坎卦不接下句雷與雲薄於卦為屯天造草昧此一時也此四句說屯之時雨與雷交於卦為解甲者皆折此一時也此四句說解之時屯必解天之道子之畦吾將賀姑少俟灌此畦者臣夫名梓記此畦者四如居士愚丘記氏吟莊子曰鄭人緩也呻吟裘氏之地祗三年而緩為儒裘地名杖折委笄時吾衣魯逢掖青襟憔悴時吾為漢博士生匪鳶匪鮪于天于淵未離人世有此倒顛吾而號吾曰愚也宜蹉跎陶唐鞭撻日月推數步曆吾不如西州智士前漢方士洛下閎多智善推算曆數班固贊曰曆數則唐都洛下閎妙術通玄吾不如竺國澄公佛圖澄天竺人妙通玄術善誦神呪能役使鬼神腹旁有一孔夜光照室石勒聞其名召試其術澄取鉢盛水燒香呪之須臾鉢中生青蓮花揲蓍布卦吾不如河東關生關朗字子明河東解人也謂王彥曰請命蓍卦以百年為斷於是揲蓍布卦遇夬之革嘆曰今大運不過二再傳改命至甲申二十四歲戊申大亂禍始宫掖經世觀物吾不如伊川丈人一燈萬卷盲人觀棋縱浪大化喜懼不知吾而號吾曰愚也宜嗟咨乎生之後不如生之𥘉乃暇豫之吾吾不蘧蒢而戚施蘧蒢編竹為囷不能俯喻龜胸者戚施布囊不能仰喻駝背者陳氏曰好奉承之態似之甘擁腫之與居擁腫無知貌朴也太行王屋奔車覆車自鞭古心庶歸夷塗惟愚故道可載與俱然而通國靳儒不孰何豫此吾所以專承曰愚叟試諧語昔有愚夫十襲石以為寶冕玄服以出客客見之而盧胡掩口而笑也主人猶忘為石十襲以帛十重封之荀子曰宋之愚人得燕石於梧臺之側藏之以為大寶周客聞而觀焉主人齊七日端冕元服以發寶匱客見之俯而掩口笑曰此燕石也與瓦甓等主人大怒藏之愈固子之愚母若宋人然雖然叟懼其不果愚也矰弋上罻羅下矰弋機而在上兮罻羅張而在下兮見楚辭棤誦篇法重心駭室交遍謫詩悉人交遍謫我謫責也或未免於投虎自衛也木石居鹿豕遊離人立獨群吠所怪或亦難乎休隂息影也昔芳草今蕭艾芳草比君子賤草比小人楚辭賢者齊平也言與民齊民變俱俗流或不得以修吾𥘉服也前講肆後馬隊周續之與學生祖企謝景夷二人在城北講禮加以讐校所住公𪠘近於馬隊咈耳搔心怵迫西東或何暇而歸尋舊書也子之於愚且喜且笑竊不自料吾言而中悔前轍之不遂偭常度而遽改楚辭曰偭規矩而改錯偭背也愚不辱子子能辱愚奈何乎丘雖然佹詩不云乎弟子勉學天不忘聖人共手荀卿所作卿既為蘭陵令客有說春申君曰荀子賢而君借以百里之勢臣為君危之荀子去之趙既又使人請之荀子不還而遺之賦時幾將背佹詩云子母以愚為疑叟尚能為子歌之丘名某字臣甫莆良士叟無名族故與歲月日不記愚丘之號不過如昔人稱短李迂辛耳李紳短形能詩辛太丘性迂嗜酒記者類於丘姓辭費且用回寧柳子為故實然回之愚著一如字似然以不然寧之愚著一則字時然而後然柳之愚其然豈其然叟此作上不及回中不及寧下不及柳不欲屋下架屋也客有問丘請代叟對如前云云二友亭記亭名二友何主人志也賔曰孟獻子之友樂正裘牧仲與李元禮之友旬淑陳實與主人曰非也賔敢問主人曰木植物也木之有心者莫如松可冬可夏李膺與陳荀為交友同許州襄城人仲尼曰受命於地惟松柏獨也在冬夏青青木之有節者莫如竹宜風宜雪二陶愛松而不愛竹二陶元亮有三徑之松弘景愛松聲庭院皆植松二仲喜竹而不喜松二仲羊仲裘仲俱有其一而遺其一杜陵野老東西南北所至誅茅覔松分竹淨香一聯人道不到千年老意相期華皓成都若非故居來往往來入門而四松在步堞而萬竹踈竒可知已吾守莆客莆第之左小亭踈明僅墨尺許窗之北松槮槮音纎木長貌而有拄明堂之規符載論松根植黃泉枝摩青天可以柱明堂棟大厦左右鄉竹畟畟音尺進也而可等封君之榮封君榮即千戶侯吾朝夕斯坐卧斯二美合并如宿素交吾是以名吾亭賔曰淇奧緑竹衛人以興武公時公九十有五德盛善至民不能忘徂徠之松魯邦以美僖侯祝侯黃髮兒齒何以使人稱願如此雖然俱一也而非二也我主人心立獨故畸於人侔於天節高世故貴不淫賤不移可冠劒而廷議可兵甲而環侍或處或逸或公或相無適而不與二友俱魯衛風斯下矣昔左史李公牧廬陵日手植松竹堂扁二友命郡人胡淡庵記之我主人政成化舒不減左史賔退士豈庵前一輩主人有命賔安敢辭遂筆答問為斯亭記主人族信氏名世昌號中隱東平人莆州尊也賔謂誰四如老叟黃淵也主人韻二友韻老叟亦韻此豈可與俗子道年月日至元甲午孟夏戊子也至元卋祖年號意足亭記天叟每誦司馬公花庵獨坐詩荒園才一畝意足已為多語兒孫曰意足二言可命吾亭第不窺園三十載非舊種讀時也異日叟訪友人德輔林兄開樽延坐亭上亭之前架蒲蔔小盆池三植以菡蓞級石為臺臺之上與左右山皆竒石也有海棠南天竹有茶柳月季花亭之後架荼䕷東西則木香刺紅而那悉茗四繚其旁蘭松雜花百餘本竹與拒霜又在亭之南它果木不登數雖不丘壑如隱薜蘿吾德輔可以適意矣德輔曰斯亭名何亭為吾擇令名名之叟遂命曰意足德輔曰曷謂之足叟曰士或以功名為足而未免浪泊之歎悔或以衣食為足而不知郭墦之羞訕或以林泉為足而又貽北山之嘲謝孔稚圭作北山移文以譏誚周顒假隱之三者皆未知所謂足也德輔非汲汲於青紫印綬者非區區於肥甘輕暖者又非枯槁於餐霞煮石者坐斯亭也四時靜佳衆芳暄妍山石之崷音酬崒音突草木之葱倩迎風揖月課兒觴客灑然無纍於外而充然有得於中此不為足又奚足德輔又曰余深顧長慮而兾永年子孫孫子勿替引之斯亭若不得天叟記於顔間豈得方之東池之勝叟逌音稱然對柴桑翁柴桑靖節所居村名不云乎此中有真意欲辨已忘言於是欣欣落筆德輔名某唐忠義藴之裔孫望族也亭在少府聽平聲事之左世美堂之右廣深各六丈有竒繇大德𥘉迄甲辰冬始完天叟則四如老人黃仲元是日曷日日南至孝經說冬至有三義一曰隂極之至二陽氣始至三日行南至萬竹胡希道見思堂記歲甲申夏六月莆黃淵天叟異姓兄可山陳文翁客溫陵胡君希道所以書抵叟吾主人文雅醖藉美無可㨂吾里如心陳公竒貴之今為相國尊客所居有玉槊萬玉槊竹也東坡云千株玉槊攙雲立堂顔見思字羡尺言扁字大也日坐其下使意也消願屬叟記其秋句叟愛友平山姚勉至自泉申主人之辭曰天地間何物最韻曰抱節君晉士雅愛此君自子猷諸賢始晉王徽之字子猷寄居空宅中便令種竹嘯詠曰何可一日無此君然其弊也不恭後三百年唐詞人俱喜吟詠少陵淨香一聯郤退餘子然未免求於聲料簡淇奧三詩則如逺根宿幹聲陽質亮老歲月飽雪霜此三假敷演武公三詩言竹之美如此然後以美君子瞻瞻句嚮慕之切猗猗句盛美之極詩人工於興物如此君子成德之名不可諼不能忘之至詩人深於愛賢如此此假說詩人以竹稱美衛武公約上三詩之意細玩自可見後來者子曽子猶好他人不好余十四五時有晉士王子猷之雅而無晉士之弊年強仕慕香山白居易之節而得香山之趣今耆老誦武公之詩則師武公之德叟吾同甲又同好敢溫前請叟讀巳逌然曰此人有此韻煩吾兩山可山平山問信希道叟號韻鄉有圃種讀歲寒老伴數竿自足彼美丈夫盈庭鸞鵠誰歟戶外羊求解見上鄰卜人各天方姢姢在目彼心我心我竹彼竹晉風流迂唐文章俗大學典刑老成淇奧鶴鳴子和君倡余讀努力華皓元身圭玉幽人之貞大過之獨黨印斯言持扣九曲兩山曰是即見思堂記當為叟報希道龕于壁此文始王子猷中白樂天終衛武公立三柱以形容愛竹之意復以自已愛竹轉鷹三事末又諷詠以足其意拮曲起伏宛轉不窮讀之當具一眼劉氏復本堂記劉氏之堂以復本名何用簡名復乃祖知本名之舊也人生乎祖一念之復祖其相去聲而子孫孫子書澤演迤方將未艾堂之東西有亭各二浩浩亭名者養夲然之氣怡怡亭名者全一本之貞小小亭名者心誠以事本𥘉之元悠悠亭名者力久以充夲體之實由身及家事天如親是夲也根於方寸溥之萬有巨無不包細無或遺邇而無間逺而不測其中庸所謂大本者乎雖然談何易易惟學問可以配浩浩惟孝友可以樂怡怡惟嚴恭可以翼小小惟純一可以致悠悠談何易易雖然在易之復𥘉九一爻為德之夲造化由是復元氣之𥘉人心由是復真性之𥘉進而上之二臨三泰皆𥘉爻所生也天運復則人事復則君子之朋亦復而亨矣君子之亨則劉氏聲名赫奕又象乃祖可以為斯堂之光余記舊年後村舊為劉丞相第桃弄舊為陳僕射第相頡頑時二老夀俱八袠之上城市陵谷之後禁從家聲空有鐵爐步之名鐡爐步見韓文蓋傷地改而名存也實重烏衣巷之歎此嘆後村之零落也烏衣巷王謝盛時故宅惟桃弄堂宇浩浩兒孫怡怡局音局天蹐音脊地詩曰謂天蓋高不敢不局謂地蓋厚不敢不蹐畏心小小課子讀書尊禮賢士未嘗付吾道於悠悠以家觀家復劉氏者其在用簡乎落筆至此感慨亦當何如至大庚戌小雪後記至大元武宗皇帝號尹氏萃貞堂後記尹氏鄭圃地名官族也良臣彥士也萃貞堂尹氏先塋孝享之地也名斯堂記斯堂者誰西疇野人施某名堂安慶郡博士謝某記堂也此復記何情無窮文亦無窮也然則堂所以命萃貞者於義何曰萃之義一貞之義四萃者聚也人之身父祖之身也隂精陽神二氣之聚斯為人若父若祖魂升魄降氣之變則散矣散者曷使之聚於是祠之至此釋萃字之義有其心信於禮無一毫而不中斯之謂正祭不欲數去聲又不欲疏春雨而怵惕秋霜而悽愴或朔望或薦新以時思之斯之謂常天地有升降而貞者常觀日月有盈虧而貞者常明人世有新故而貞者常一夫如是然後可以言固此三假解釋貞字四義不者視時汚隆為巳敬簡僾愾之心何自而生僾悒也愾太息豈先民報夲反始之義哉亦豈尹氏翁季所望於來昆雲仍哉來者玄孫之子昆者來孫之子仍者昆孫之子雲者仍孫之子或曰萃之繇即爻字為有天下者設尹氏名斯堂何曰易不可為典要聖人有聖人用賢人有賢人用學者有學者用公卿大夫士農工賈隨所用而用之斯堂獨不可以萃貞名乎遂濡毫而記其義於後若夫尹氏之家乘堂之年月此不書是記也莆四如老人黃淵彥安七十九筆此題典重平實當作時義文章看東野書房記叟曩客樵川富沙匯江芝山瑞安時傾囊置書歸里朱墨校讎唯謹丙子戊寅間兵蹂其半盜藏其半然後歎藏書之難草餘年來新進小生以科舉不行而輟讀與刀筆相從事者不暇讀吟風月以為工者又他讀間知課兒燈火尋行數墨而不知其所以讀叟雖未離清淨業然聰明不及中年開卷如生掩卷旋忘乃又歎讀書之難或喜榷訂訛缺穿穴叢瑣騁韶妍釣聲譽而斫木不勝任製錦不中度不為行河之禹貢則為理財之周官惟讀錯故用錯叟髮種種不諧於時益重歎用書之難噫嘻藏而不善讀猶不藏也讀而不善用猶不讀也三山讞掾汪君學仕俱優有房庋音鬼閣也書萬卷朝夕倣徉其間慨然欣戚今古介博士凃音塗姓君囑叟記數語叟喜君之善藏又善讀且善用也故以其所感歎樂為君道之前代元夫巨人宅三事者書任人凖夫牧作三事三公也惟受用論語一句兩句用書正不在多此語又惟東野領㑹幸勿他客見曰我輩學問止論語汪君名某新安人叟謂誰莆四如老人黃淵字天叟記已授凃君復之俾留東野壁間以為吾兒異日邂逅一笑話柄魚我亭記孟子曰萬物皆備於我則物物皆我性分之所有也以物觀物則物自物以道觀物則物即我魚雖天地間物眇然小哉而大易之信可及中孚彖曰信及豚魚中庸之至可察在淵或渚則知理之無定在潜伏孔昭則又獨之所當謹孰謂我自我而魚自魚莊惠二子亦豪快士惠曰子安知魚之樂莊曰安知我不知魚之樂莊子與惠子遊於濠梁之上見鯈魚出遊二人問答惠固辨矣莊未為真知魚其設為吾夫子之言曰魚相造乎水人相造乎道然不過謂魚與人各自足而相忘耳聖賢之學不然東野汪君穿池養魚蓋悟詩易中庸之理而非惠莊灑落玄虛之誇但此我與我道而我難與俗言叟與野俱不相知以道觀我則野同乎我而非異乎我獨魚我之謂我而非我之謂我乎彼魚也獨庾氏之魚而非辛氏之魚乎庾氏穴池養魚以木為憑欄登之者其聲堂堂每憑攔投餌魚必踴躍而出辛氏云云不投餌但聞䇿䇿之聲魚亦出是庾氏之魚可名堂堂辛氏之魚可名䇿䇿出宋齊丘化書遂筆以授魚我野寄聲曰賢者亦樂此乎叟又復曰儻與我共我將魚我從而聽叟即記東野書房者年月不書南劒路新社稷壇記河東李侯以前集賢侍讀學士中大夫守南劒路總管府政成之明年喜溪山之如昨慨社稷之弗稱與侯之簉𥘉救切倅也左傳僖子使平􅱀氏之造程侯謀撤而新之程姓亦願庀其事計徒於巳酉某月訖役於某月某日壇在郡西山之麓靣勢址壝丈尺崇殺去聲齊廬門垣一如禮法左右掖則公風雨雷而壇之尊祀典重農事也侯寓書徵莆黃淵記淵敬記曰社稷之示平聲各一而所配之神亦各一社與稷若二而實一也百昌皆生於土而土爰稼穡於榖為重榖非土不長土無榖則耗故稷與社等祭社必祭稷風雷天之號令雨其水澤也土非雷風奚其動奚其散榖非雨奚其潤奚其化歲之上下係焉叙社稷與風雷雨相需通祀之意非末學可到於是郡國得以通祭祭于北墉答隂義也祭日惟戊用剛辰也獨陽不生獨隂不成土榖得冲和之氣然後由貞而元亨利也竊嘗怪下之世春秋祭外隂陽之或沴雨暘之不時高士泥閉縱之術齊民信巫覡之禱於社稷漫不省至謂箕畢之不神百里之不足震驚箕風星畢雨星百里震驚雷也應上三神之義吁陋矣農所依者二侯二侯所依者神土榖之神與天同功而能召風雷上雨澤者也不此神之告若何彌水旱順豐年哉我二侯之仁於民敬於神神亦體二侯之意不疚爾農且庥于民田更野叟樂歲終身飽雖神之賜亦二侯之賜也而今而後語僚屬府史曰豫二侯者非干譽以徼福也為爾後之人後之人繇上逮下以和召和庶證音徴咸若萬分一潦若早有謁從欲非瀆非僣勿怠勿壞李侯名倜自號貟嶠真逸程侯名文沆號西樓南劒總管府判官淵號四如老叟年月日至大二年立冬乙巳將樂縣桃源橋記將樂南劒路支邑也邑十里南曰桃源溪古渡也溪有橋汀廣午道也東西行者利之歲異月殊水磯橫斷並溪之民或塗以茅庋音支以木繩以筰音昨竹索夏潦秋霖茅杇木蠧筰亦解坼音拆裂也涉者病焉今總管李侯士弘始下車惻然曰橋梁不修誰之過諉邑簿徐某前廣德路同知吳某董其事堂僧覺德首受役要繇是善勝金明皆僧名等有輸財者捐粟者助上庸者絫石為址橢音惰器員而大而方之釃渠為洪導而四之不低不祚架梁其上左右埂音梗坑也丈六十有咫環築以石直欄橫檻崇麗堅緻輿者行者如行九逵靡楮一萬萬餘而民不以為苦且勞句興役於大德丁未十月竣事於至大戊申七月祭飲之日仕於此邑者邑之巳任未仕者田更野叟共祝橋夀余於是賀此橋之遭也不可不記記巳賦以詩曰穹壤間水有利有害其害橫流其利沃溉川陂澤梁關國之政昔人以此覘陳議鄭仁哉我侯說以使民相厥桃源通旅敬賔水既昏星也正土功乃興梁空以行不夙而成鎮蛟龍淵跨鼇背上天造地設蓬瀛蕩蕩萬口一詞我侯之德侯曰當然牧守之職旄倪祝侯如傳植鰭音耆魚脊濟彼巨川舟之楫之誰能詩乎泳漢以歌俾侯黃耇等橋之高聖墩順濟祖廟新建蕃釐殿記妃號纍封前此有年矣宇宙趍新真人啓運祀秩百禮命申一再護國者功庇民者德明著則神之誠不可掩也盛矣哉聖墩廟幾三百祀歲月老正殿陋李君清叔承先志敬神揄龜筮卿士庶民協從繇寢及殿易而新之鳩工於大德巳亥祭落於癸卯臘月五六年間始充就難矣哉按舊記妃族林氏湄州故家有祠即姑射神人之處子也泉南楚越淮浙川峽海島在在奉嘗即𥙷陀大士之千億化身也而莆聖墩實源廟之祖墩以聖命之何妃馮浮槎現祥光遍夢於墩之父老遂祠之賜順濟始於何時妃護夕郎路公允迪使高麗丹國使李公振請于朝也廟前曰殿半以後曰寢乙殿居甲丙間建於何年自制幹李公富奉妃像正位序始殿曷名蕃釐地示音其稱媪釐者福也百順故蕃筆則法從去聲陳公讜立則李令尹茹存舊也殿之木焉須妃隂隲民之精爽不二者曰山之西有木巨甚工師求之果如神言盡售其材以歸殿之費焉出四方之善信樂施音試也殿之役誰助教役屬功則鄉之寓士耆宿奔走疏附則里之千夫百夫長也雖人也亦神使之也始者乘槎而宴娭於斯今兹指木而輪奐於斯吁異矣哉或曰神妙萬物御風乘雲變化無方奚必留瓊館於人間曰不然妃猶日也日必有次妃猶星也星必有舍他所謂神者以死生禍福驚動人唯妃生人福人未嘗以死與禍恐之故人人事妃愛敬如母中心鄉音向之然後於廟饗之廟言貌也其求諸神於彼乎於此乎乃有寢有殿有正殿神之報乎人猶親之愛其子孫故是饗是宜榖我士女降福而亦穰簡此殿之所以扁蕃釐於是大書特書若夫妃禦大菑捍大患應在祀典此不書清叔廉靜謙和而老於事廟東湄嶼移星轉漢有識者巳亦不書前殿觀瞻未稱清叔有志竟成將不一書某甲午冬嘗夢妃以記相諉忽焉十載而李君清叔奉妃之命來不敢以老醜辭故墨筆以印前夢書既系以詩曰穆穆天子前聖後聖上昭下漏靡神弗敬灑澤龍宫河圖輝映莆僻海陬矑歡拜命其一公家有齊季女生也賢哲嶽鍾瀆聚殁也神靈雲飛電吐不識不知自成功所其二天回地游否泰消息殷墟周京化為黍麥大哉乾元坤順合德斯廟耽耽千年血食其三福地仙居珠簾玉坐帝子天孫容衛右左木從西來神受人造駊騀音叵我嶙峋方壺翠﨩其四春秋歲時謁欵穰穰上聲迎兮何至送兮何往神而宇之其中曶蠁忽響聽爾六祝去聲嘏爾景貺其五張天師正殿記昔有船訪蓬萊日候神人見跡甚巨漢武發船遣公孫卿求蓬萊神人卿言夜見一人長數丈就之不見見其跡甚巨類禽獸云喜以為仙者又有老翁拆葉為舟與客泛渭登旬抵家者陳季卿十年不歸一日值終南山翁折竹葉置寰􅌡渭水中卿見一舟甚大登舟旬餘至江南謂無邪載之史及他書謂有邪知者蓋未盡信孰有駕鐡舸留靈跡如我仙師與平聲師以仙名分形散景通神變化豈塵凡所能測識舸雖焱音熖騰為虬為龍而步嶟留石可尺二許甚彰彰也易溪流而平岡驅黎民於境上農祈榖麥而雨應商禱䑺檣而風若盜賊不作呰音子癘不生此又有功於民者捍災禦患於祀典宜師之廟福清州峯頭玉蜍山之左始創於天禧𥘉重搆於治平三前殿則首事於紹興二其賜額昭靈則又八祀也師之錫號保禧熙寧之十進封妙應顯祐惠應妙濟福順皆紹興三十年以後淳祐德祐間也記是宫者進士陳良宦族黃顔榮也然前記謂按圖史而無所載未知何許時人後記書師之諱曰存或有所考與平聲抑以疑傳疑遂信而徴與平聲嘗聞翊聖真君降言於守真之子汝父遭逢於吾故令子孫受福正一真人亦逢聖代得道之後世世不絶竊意師非翊聖之裔即正一二十三代諸孫行音杭故親傳祕訣與道合真乘雲御風其來勃勃音拂其去縹繹入鐡透鐡入石透石有如飛鳴偶留指爪夫豈凝滯於物以人間冕服宫室為戀哉雖然此一福地與他葆祠不同黨非後寢前廟若何而栖神靈繇是姚勉募編列新正殿敞閣室闢步廊僝功於至元乙酉祭落於丙戍碧窗朱栱聈聈音杳皇皇非前日之柱穿蜂溜燕舞帷塵矣洎丁亥春改塑神儀瑞氣徹天侍衛導從如朝通明無有有無恍然上界官府今登天矣余舊遊斯廟覽江山之竒羡蓬萊之樂裴回久不忍去因記太史公曰嗟乎仙者非斯人而誰為之遂修辭紀實於麗牲之石而系以詩曰至人學道師赤松神姿逸氣心夫蓉手五明扇腰雌雄馮虛駕鐡超鴻濛玉距㾗深雕鏉音漱工巨跡千古鎮蜍峰狂颶怒濤鎖魚龍夜醒月凉水笙鏞騎吏無鞅鸞鶴從朝侍玉堂雲朵紅天樂隱隱聲徹空俗耳可聞不可逢渺視齊州等蠛蠓滄海有時揚塵風獨此瓊館留人封神仙之說非夢夢士民尸祝社禝同椒醑鞠􅛏曲跪瓜棗供余非紫陽山人翁若為詩之銘新宫叙事若虛而實文法必老學乃造汀州路重造府治定光吉祥寺記鄞江府治之東寺曰吉祥白衣菩薩伏虎禪師主賔真相奉嘗于兹有年矣俗姓法名地産僧臘先後封號有銘塔者有狀事蹟者有碑記者有贊頌歌詠之者具載實録此不書第偈句九十五首各書贈以之中或隱語或名氏不可測知耳二師大抵以本尊本而心法勝以願為願而氣力大故覺道威靈豪出諸大士之右若貴賤若賢愚若小中大乘人遊我門繞我座禮我足皆傾府空藏去聲以侈其祠宇攻木礲石以紀其功德至元丙子不幸竒劫寺􅑒音尖火滅于兵豈物巨細各有數師亦不得仞而有邪然壞固有數興亦有時郡侯黃公去疾諉僧寶興起廢未成而去同知薛公元稹亦諉之構均慶院都元帥李公梅刺孫端請見堂老以性庀事繇是大殿前後殿成天寶閣成三門兩廡言言嶷嶷上凌煙空性老戊戌年西歸屬護者西堂宏刻意專用力勤營度有序宏弟子慧鏡𥙷見堂處質偉行潔對師發誓了大莊嚴以次法輪藏殿羅漢堂毗盧觀音二閣寢殿坐禪亭丈室水火池一時壯觀寶相𣑽儀宛如本來靣目叙事明備老學小心如此然宏之功居多抑師有相之道歟宣慰劉公巡部又於北坡架萬歲亭以表嵩呼之祝逺邇走集唯見佛尊猗與盛哉莆四如居士黃淵耄矣􅩹音度戶懶去乞水洗眼至大巳酉秋鏡介鏡道名介使也鄉友汀庠學正陳仲和前蓮邑典史方元善徵余記余恐當筆不過遲半載而速至再三余乃歎曰於戲道之盛師以誠動宫之侈師兮何心師與諸佛不生不滅鏡為龍象出勢力心下始大安隱去聲起戊戍迄庚戍拮据蓄租亦十三載甫就豈不難難居士嘗聞佛法似一隻船祖師東來付兒孫大家把纜要到彼岸直待時節因緣燥性撑向須彌峯頂下觀三千大千世界鏡老駕舟不至須彌峯頂不歇且與後人作古居士又竊歎大浮屠辦堅固心如水穿石儒童菩薩直下傳燈幾宫幾人能如居士前所聞佛法否又能如鏡老光輝道場放黑月成白月否居士雖喜為鏡老記亦重為斯文愧遂併書於記末鏡莆遊洋林司業之後自號明心法門尊足也記巳系之辭曰白衣隱去是空非空魔化為檀巋巋祠宫滿山泉石十里松風千萬億年庇䕃人封日月神通相百歲翁覔偈四句贈之以中至大三年清明日莆四如居士黃淵記韻鄉記此鄉何鄉四逹皇皇無門無房四逹皇皇也杜云山潤川媚月湛霜明有天叟者遊處中央宇泰定而發乎天光宇器宇也德宇泰然靜定則其所發者天光耳非人耀四如居士一日徑造主人叟杖藜應門子貢乘大車見原憲原憲華冠候履杖藜而應門顏色種噲曽子居衛緼𫀆無表顏色種噲注云剝錯也又盈虛不常之貌而眼如點􅃮晋杜佑眼如點膝妙處正在阿堵顧愷之曰傳神寫照正在阿堵謂眼也舉止寒澀若無甚技解音蟹然不言而四時之氣備晉書曰裒雖不言而四時之氣已備坐良久沃三蕉葉東坡云吾少望酒杯而醉今亦能飲三蕉葉蕉葉即蕉花之葉情浩浩笑云云飲罷薦茗啇較一水兩水建安鬪茶以水㾗耐久較勝負相去一水兩水居士曰昔叔度何如人並世者時月不見鄙吝復萌同郡人陳蕃周舉嘗相謂曰云云或往從之纍日方還郭林宗莫議其將少間願聞此鄉之風叟曰春之朝縞花淨擢香入肌骨夏之日竹隂清閟門自可欵韓詩誰家多竹門可欵秋之月鮮鮮寒榮愈晚愈好冬之雪踈枝令蘂怪怪竒竒此鄉之勝致也蓬茨蓋屋桑樞牖室褐塞原憲居魯環堵之室茨以生草蓬戶不完桑以為樞甕牖二室褐以為塞上漏下􅊜匡坐而弦門庭藩落皆著紙筆晉左思欲作三都賦構思十年門庭藩落皆著𥿄筆遇得一句便書之一榻炷香人意幽逺堂上九十餘尊含飴弄孫飴米糖漢馬后曰含飴弄孫不能復關政眉間漏出喜色伯仲如坡子瞻如頴子由夫婦如鴻梁如光孟此鄉之居室也架無多書古文六經外惟左氏語左丘明春秋傳蒙莊書莊子蒙人著南華真經馬遷史子雲玄淵明少陵詩昌黎柳州集不貯他物此鄉之簡素也湮罍沈鼎古器之遺遺欵墜刻古文之遺偶有流落人間者收於几按餘則無絃琴一陶淵明折腳鐺一古德和尚向折腳鐺子煮飯喫老瓦盆一杜云田家瓦盆盛酒此鄉之器玩也暑𬒳白練裙寒著百衲衣晋羊欣著白練裙唐裴休披百毳䄲時捉蒲葵謝安扇擲麈尾麈麋屬尾能生風辟蠅蚋王衍揮玉柄麈尾善談老莊見晋史炊雕胡飯芝麻也米黑宋玉賦炊雕胡之飯釀真一酒東坡送菊苗虀山谷碾新茶荐以菊苗蘆服鮓蘆蔔菜名後漢更始傳洛陽宫女掘蘆蔔根食之俗作蘿蔔白樂天齊劉禹錫作鮓以饋之此鄉之服食也或安山林內枕流漱石晋孫楚語枕流欲洗其耳潄石欲礪其齒不纓塵垢氛太鵬六月而有間意莊子大鵬去以六月息者也蓋大鳥一去半歲至天池而息或著富貴中一龜一鶴趙清獻入蜀旁無姬侍清規粹德與雲俱潔或寓京師未嘗候公卿門人欲即之終不可即或浮湛音沉里閭同雞豚社對田父飲坐深而鄉黨敬韓詩云願為同社人雞豚宴春秋杜詩壯遊篇云坐深鄉黨敬日覺死生忙或遇俊人勝流飲酣論豪語古純孝貞烈從臾尚友千載或恥徇財每生之失鵩賦云貪夫徇財品庶每生慷慨劇詆直欲不與同世胸中雖竟一𥿄識不肯讀人間非聖書李白不讀人間非聖書邵堯夫詩亦有此語文雖未至小好大好韓云時時應事作俗語下筆令人慙及示人慙以為好小慙以為小好大慙以為大好古氣可以參彖繫詩雖不能天然可愛口中時有稷契輩語碩膚几几之似周公威儀抑抑之似衛武侃如誾如䄡如翼如似夫子手之舞之足之蹈之似孟軻陋巷簞瓢不改其樂似回春莫舞雩浴沂詠歸似點道學自修盛德至善似參簡文溫理似伋不屈其志不纍其身夷惠之間似蜀賢人或問李仲元楊子曰不屈其志不纍其身在夷惠可否之間奚名之不彰也鼓有虞琴𢋫文王操優游高明似唐儒生韓文云有儒一生魁然其形抱琴而來鼓有虞之南方𢋫之以文王宣父之操優游夷愈廣厚高明追三代之遺音此鄉之老成人也居士曰入其國其敢不知其為人也溫柔敦厚深於詩疏通知逺深於書廣慱易良深於樂恭儉莊敬深於禮見禮記經解載孔子之言此鄉此人之謂與雖然願聞先生之風叟曰良如金玉重如丘山儀如鸞鳯氣如芝蘭知居士之所以為居士者此則知叟之所以為叟者亦此居士曰不知叟之為居士兮不知居士之為叟與相視一笑乃相與忘言乎此鄉之天退而書為韻鄉記天叟名淵與居士同姓同時人黃四如先生文藁卷一葉摽寫
