front:
  text: 有宋福建莆陽黃仲元四如先生文藁前序莆前一輩四如黃先生為名進士為經學老師為詞章大家數異時艾軒翁以經學鳴遭際阜陵致身法從莆士之談性理者率皆其徒二劉後人則有若樗庵翁以詞章著穆陵脊之厚當兩制躋文昌莆士之工詞章者多師之若四如翁則瓜山先生之嫡孫行家庭師友究之經學邃矣演迤而為詞章汪洋大肆若記序若碑銘若題跋蒼然之光淵然之色未嘗求合於古也而制雅未嘗務去陳言也而意新未嘗求異於人之說也而自不能不異蓋以詩書禮易春秋為之本而旁推交通若國語之博離騷之幽太史公之潔無不備焉昌黎所謂仁義之人其言藹如者也違丗屏居戶屨常滿使其逢則旃厦扉垣蓋先生劵內物惜乎兼經學詞章之長而卒不施宰物者孰從詰之哉吾又觀於莆有夾漈鄭漁仲先生白首窮經尤精於史學鄉也雖以布衣召而終老丘園為可恨四如翁不為艾樗之顯甘同漁仲之晦然位雖不顯而書則傳身雖晦而名則彰通志之行夾漈之顯也文集之傳四如翁之顯也士君子患無令名之難窮逹顯晦不足計也夫不在其身必在其子孫公之子子材學世其家而文彪於時今為長汀郡幕以翁與豫咸淳辛未歲聮榜帖稡翁之文若干篇將鋟而傳之不鄙囑豫叙豫於翁何能為役辭不獲命乃喟然曰翁之文傳則湛輩亦托不杇幸也遂忘其僣而為之叙云元至治三祀清明後一日前進士清源傅定保書有宋福建莆陽黃仲元四如先生文藁前序濂成童時即讀四如先生諸經說見立論精微鑿鑿過人逺甚未嘗不慕豔之稍長歷求先生之事蹟然後志其淵源之所自而凝道之有方也蓋先生居莆陽唐御史滔之十二代孫世為儒家其父績師事瓜山潘公柄復齊陳公宓二公實考亭朱子勉齊黃公之髙弟子也先生夙承父訓年十二試舉子業鄉校多占前列後二十九年始擢咸淳辛未進士第調監瑞安府比較務未上名公巨卿爭聘之為講師而丞相江公萬里挽之尤力聲譽翕然動於一時德祐乙亥冬始之官與簽樞陸公秀夫遇陸公一見極器之明年丙子杭都已涵國事不可為陸公趣先生至行都充益王府撰述官兼處置使司幹辦公事改刑工部架閣以通直郎升武學諭遂轉朝奉郎國子監簿兼福建路招捕使司都參議官先生皆辭不就宋既改物歸隱重山密林不與世接四方有受學者先生為敷繹濂洛關閩之說而開導之其為文辭務以理勝不暇如他文士馳騁葩藻以為工而當時求者紛如也門人武夷詹清子類次六經四書講義為六卷刋之先生之子元汀州路總𬋩府知事梓又分記序墓銘字訓之屬為五卷而刋之先生年八十二而終遺文流落於薦紳者尚多其曾孫鄉貢進士至又裒聚為十卷將刻諸梓介楚王府伴讀陳子晟徵濂為叙以傳濂聞濂洛中微考亭未興艾軒林公光朝獨倡道莆陽從者如歸市江泉東井之學乃聞於天下網山林公亦之實紹艾軒之傳網山之後樂軒陳公藻又起而繼之樂軒家長樂網山居福清咸來講學東井而風聲所被氣澤所薰人皆有鄒魯之行及乎瓜山復齊之起推闡考亭經訓東西角立化行而教敷文質尤彬彬可觀先生産於艾軒之鄉耳目之所濡染固巳先立乎其大者復因父師之教矻矻窮年遂探考亭之正緒則其所著皆六經之微㫖所宣皆天地之祕藏有未涯涘者奈何道未及行而宋祚巳移識者不能不為之惜先生之所藴與不可傳者固巳隨物俱化若併其遺文同就泯滅不亦重可惜哉先生之子若孫孜孜以傳世為務可謂不死者矣濂年耄而昏避求文者若避讐敵甚不得巳多令學子代之今以童年慕豔之久勉循至等所請而躬叙之如此然先生之集自能行世亦不藉區區之文而后傳也先生黃氏諱仲元字善甫名淵字天叟號韻鄉老人云洪武八年秋七月已未朔翰林侍講學士中順大夫知制誥同修國史兼太子贊善大夫金華府宋濂謹序有宋福建莆陽黃仲元四如先生文藁目録
