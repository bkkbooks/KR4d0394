body:
  text: 卷之一夢筆記族祠思敬堂記學稼軒記半山精舍記藥房記居安堂記小孤山記一粟窩記劉氏厚堂記委成齊記讀書堂記還笏樓記孝節郭公祠堂記仙逰縣學尊道堂記莆田縣廟學聖像記自得齊記虛已逰世之堂記篔谷記昭武危西仲寄傲軒記命隱室記灌畦記愚丘記二友亭記意足亭記萬竹胡希道見思堂記劉氏復夲堂記尹氏萃貞堂後記東野書房記魚我亭記南劒路新社稷壇記將樂縣桃源橋記聖墩順濟祖廟新建蕃釐殿記張天師正殿記汀州路重造府治定光吉祥寺記韻鄉記卷之二蒙古字學題名記序鄭雲我存藁序題漫翁林春山草韻序鄭雲我孔子年譜序講春秋序忍經輯要後序李氏家集序通志序姚野庵詩解序表兄陳可山序送歐陽臣夫序送術者龜峰序序贈吳丹陽贈楊愚谷序送林理齊序春臺易圖序忍經序題宋蜀翁北遊詩卷後題黃耕叟存藁跋方正巖正通庸言劉畏獨答何卷之三誨林于髙冠辭歐陽學修字訓方天覺字重甫字訓學孔字訓夾谷可與字訓姚平山仲一字訓字汝亦說夢雲夢雷伯仲字訓伯俊字訓彥聖字訓明卿字訓林則時字說顧舜可字說傅彌年字訓林于髙三子字祝辭引師說祝辭師孔祝辭師旦祝辭以辨以順字訓林起東字訓甥孫郭啓翁智逺字訓林景惠字說洪與我字說陳汝作字說陳耀卿字叙大年字訓昌年字訓喬年字訓卷之四清逸處士春山林君墓志銘韶溪姚君墓銘書宋故龍川史君姚公墓志後歐陽君厚墓志銘李仁可墓銘故中山處士林明甫墓銘故進士謝春塘墓志銘架閣通直劉君墓志銘太學録此堂葉公墓銘隱君子林君亨之墓銘貢士洪德章墓志銘夏宣武將軍墓志銘薛君立墓志銘故通守太學博士介山林公墓銘故梅西先生郭教授墓銘太孺人林氏墓志銘壽藏自志卷之全上古心先生書祭文祝文事𫐠世次附
