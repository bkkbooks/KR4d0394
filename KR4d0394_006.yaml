body:
  text: 吾諸孫東松地官既善繼吾師承德郎木齊翁志新梓九世祖四如公文集以書最便道過家掃祭公墓尊賢里嶺口廷宣方患眼疾不能偕行念公去後二百三十年有孫文炳克世其家振揚遺落此家慶也因而有作用見慰喜之私烏石山之前世家稱東黃品樹枝以繁印池流且長述者惇叙㕔作者思敬堂追逺跨隆棟無謀掣道傍圭田薦宏敞私第捐安詳憲憲既在上言言亦在廊後人非木石家􅒑如琳琅艾軒尾蹊徑考亭闖門牆紹聞獨不懼仰止耿相將父子崇道德秦漢無文章注疏採國史學殖鋤天荒線緒者誰子九代生賢郎挺身甲科顯出門郎官揚得無念爾祖端可肩平當迢迢魚鳥跡惻惻蟲鼠傷躋之翼經史勝於陳衣裳茂草鞠周道枯藤掛斜陽手持日星文步出狐兔場下書化冥貨掃地傾椒漿疾豫聞蘇息觀駭走傍徨賢賢而親親作法永不忘嘉靖壬寅歲六月六日賜進士出身奉議大夫廣東按察司僉事裔孫東村廷宣頓首書跋右莆陽黃仲元四如先生文稿四卷明嘉靖刻本乃四明范氏天一閣故物今歸北平圖書館考仲元擢咸淳辛未進士與陸秀夫交善德祐之變秀夫趣仲元赴行都充益王府撰述官及兼福建路招捕使司都參議官等職皆辭不就宋社既屋歸隱山林以濓洛關閩之說教於學者其子汀州路總管府知事梓分輯記序墓銘字訓之屬為五卷刊之然遺文流落於外者尚多其曾孫至又裒為十卷再刊之嘉靖辛卯八代孫鉞及其子文炳等又輯刻為四卷即此本也蓋至是其集凡三付剞劂矣今五卷本十卷本均佚傳世者當以此為最古最備之本四庫全書本卷數與此本同惟割裂第一卷自得齊記以下至韻鄉記為第二卷又合卷二卷三兩卷為第三卷為異耳仲元別著四如講稿六卷有嘉靖丙午刻本版式與此本略同他日當別謀印之海寧趙萬里
