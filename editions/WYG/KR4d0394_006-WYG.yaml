  text: 遺
  hash: sha256:5607985a9b8dc8657c189c36b2bf744bc4750885ffd2fc49c88a2890ad64775d
body:
  text: 上江古心先生書古者士之摯雉若見於師以菜為摯曷為或以雉或以菜雉言介也菜言㓗也士不介不㓗不敢見然士之見於周公者十人三十人百餘人千餘人何多周公於十人三十人百餘人千餘人中僅得三士何少周之士俱自好亦游大人以成名乎公好士如不及亦為之厚薄貌乎舍三士他無人乎漢不古摯禮廢掃門者艱於一見不嫁者禮之上賔魏勃掃曹相國門以求見蒯通見曹相國曰婦有夫死三日嫁者有幽居不嫁者求婦何取曰不嫁者通曰求臣亦猶是東郭先生梁石君齊隱居不嫁願禮之相國皆以為上賔宰天下士者必有所擇唐之士摯以文貴之甚賤之甚以古文倡者光範之伏其氣餒釋言之辨其辭費芻米僕賃之急其得小不免為今之人我朝諸賢犖犖音落可外文字猶用片言摯於王公矧碌碌者疇能自異然則某固願聞名於將命者何也古心先生一代不數人百年能幾見者也某生長東南非不知有伯淳范祖禹謂顔子不貳過惟伯淳能之時陳瑩中不識伯淳作責沈文以自責雲山塹隔伏謁無路今詣康廬登龍門矣然與其相羊於某丘某水先生舊所釣游之處使人意遐而清不若侍坐於書册琴瑟之前得見宗廟百官之富崑崙在望滄海在前而猶不即猶空此生如獲一見相國矣將與四方竒士交譽盛德歟某言呐音訥辭柮音咄政不能譽縱譽之一把泰山不加益國憂如􅄠士低如䑕李斯少時見厠中䑕食不絜近人人數驚倉中䑕居大廡不見人大憂嘆曰人之賢不肖如䑕矣時人之耳目在先生公論之標表在先生世道之輕重天下之安危在先生九州四海孰不期先生之再提一筆入福蒼生也大臣身在江湖心在魏闕一處一出與隂陽相為消長亦必有道又非兒童走卒之所能知前修偉人魏野一詩獨勸子明王旦字以退明允一書獨愛富公以徳某也始見安敢輕浮作此躁語将謂孫家同榜子弟當以禮拜沂公歟寒門落落望雲霄閥如梯天政不敢自陳家世事分於相國也將謂文潜客於少公文潜張耒也少公潁濵也文潜淮隂人與晁秦黃號四先生並從東坡逰張初游學於陳學官轍愛之因從軾從軾亦闕而稱其一唱三嘆亦當與晁秦黃學士師事長公歟晁補之秦觀黃庭堅東坡長公顦顇視姬姜自覺形穢政不敢居叅門館下士於相國也否則以所業徹於相國歟某生為人又為丈夫固不可與空生物穢天壤間然書可成也仲塗十年一闕不遽語之門人程易傳最晩出且謂說得七分史闕修也唐鑑多有好處亟戒開封毁板新唐書經歐宋名筆猶無一毫前漢義理微宻工夫浩大二事俱難草草文可工也語言妙天下者讀同列一疏乃遂不復自為人目為夫子者作六經閣記終不可主公意詩可學也建安黄初暨晩唐幾千百家獨子美不可擬議江西宗派呂居仁以歌詩至豫章大出而學者同作共和録其名曰江西宗𣲖以其源流皆出豫章也陳無已以下凡十四人傳衣付鉢范質舉進士主文和凝曰屈君十三欲傳老夫衣鉢也不如西湖處士以水影月香一聯行世苟焉引筆行墨髣茀聲𠻳恐非當行家非不欲爲之不敢易爲也就爲之如北方竫人見者齒矧山海經云東海之外有小人名曰竫人列子書今之世惟古心先生傳逺之書名世之史金石之文絃歌之詩與易詩書禮樂春秋等不知可與陳無巳盡言否某願執經焉又否則見相國當談政事不談文學歟某謂六經四書言言是理言言是用一部論語趙普後先可事兩朝正心誠意四字朱子中塗可持告君彼行河之禹貢復讐之春秋傷財害民之國服爲息國服謂生民於國所服之閑農圃類也息者保之使生息也出周禮泉府王安石謬引注疏以息爲利息而行青苗之法惟讀錯故用錯讀書正要有用書亦正未易讀冠仕冠棄壯仕壯棄某則不敢一行試吏成公呂氏之官箴西山眞氏之政經一一可以爲訓若臨大事當於六一翁處學來今之世惟古心先生清忠粹徳豐功盛烈載旂常銘鼎彛與臯伊傅呂周召並不知可與蘇子言容平生本末否某願問爲邦焉然則某之來無所摯而敢見乎曰不介不潔不敢見某於道之秋毫百未得一然某之學傳於先君子績先君子傳於𤓰山潘柄復齋陳宓復齋𤓰山親傳文公勉齋之學者也學孰大立身行已爲大時若命謀位與材㑹不憂不通顯欲得汗青一幅芬芳百世則實難難故脱凡近志髙明陋希世友千古居於家凛凛乎如處女之在閨處於鄉兢兢乎如懷千金之璧而行不待謁刺餙游聲人故識靣者少不作一皺眉事亦不受人指㸃以廷對見君父第一歩直透剛腸所欲言者一落千丈無戚容以一命之士皆可行志求爲歩兵而歸麄冗淹速不屑意人或朝得軒裳暮馳奔車之上乃獨退然􅖏户與孔門冠童者遊􅖏徒古切塞也人或倚一郡爲北道主人鄧晨為常山守王郎反光武走信都晨請從光武曰從我不如以一郡為北道主人乃歸郡竊竊焉俎豆從事之列乃獨謝以為煩願從子弟尋劉公父子讀書處則某之所存亦少異乎人也昔黄叔度之賢無一見於外而林宗重之李仲元蜀人不持一字於揚雄之門而法言書之淆之不濁者其志㓗林宗遊汝南往從憲累日方還曰叔度汪汪千頃陂澄之不清淆之不濁不可量也不屈不累其行介故可重可書今有人焉氏名與二子同志行與二子同古崖既取之於驪黃牝牡之外矣古心先生天眼一盼儻歆然曰若士也為子必孝為臣必忠必不讀父書而敗趙括必不游師門而叛必不兩來張師德必不三變商君衞鞅也商君始説孝公以帝道不聽又以王道不入終以伯道公與語不自知膝之前席也進而教之又幸也仰惟古心先生之心先知覺後知先覺覺後覺之心也已欲立而立人已欲達而達人之心也此心流行天地並生物我同體相國之門未有一人不爲道周徳全之士豈但薦藉華寵其身哉某故願先生輔之翼之振德之某之挈挈而來也思拜羽儀如渴如饑五歩十歩盤紆樊中脩摯師門又何遲也若曰子來幾日然後求見長者則克之罪大若曰彼亦人耳傲將何求則愈之過小恃此無恐先生儻與其介也潔也某敢不立雪以請惟先生亮之四如集拾遺
