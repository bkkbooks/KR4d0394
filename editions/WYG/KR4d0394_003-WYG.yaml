body:
  text: 誨林于髙冠辭名岡前進士林用可名楝之仲子于髙岡冠父執友黄淵誨之冠屬嘉禮請以冠喻初緇冠再皮弁三爵弁禮記所以莊其首也凡人首髙於身冠髙於首所加彌尊欲成人者德進而又進也譬諸山焉地勢之順而髙莫如山山脊曰岡順而愈順髙而愈髙者也詩興髙岡者四獨巻阿之九鳳凰鳴矣于彼髙岡與君子游如長日益而不自知與小人游如履薄氷每履每下㡬何不陷此則而大父矩軒先生敬而名之義岡拜而對詩意不然余曰閑居記賦詩凡二而崧髙惟岳峻極于天吾夫子訓為文武之德表記引詩十有七而髙山仰止景行行止吾夫子釋曰詩之好仁如此中庸記言登髙自卑而及於兄弟既翕和樂且湛言極髙明道中庸而及於既明且哲以保其身學詩一一泥於文義皆臆書也于髙聽叟之辭然後知人之有冠猶宫室之有墻屋志在子歐陽學修字訓四門博士來裔臣夫梓之子至孫冠唐歐陽詹為四門博士臣夫其來裔韻鄉老叟字之曰學修學有小有大十五則志于大學况成人乎至孫學大學矣亦知子曾子止至善以詩淇奥取興乎至善者理義精微之極如切如磋者討論窮理之事故曰道學如琢如磨者省察克治之功故曰自修由百能而千能然後瑩徹切而不磋脫墼耳墼居的切說文瓴適也一曰未燒者脫墼蓋瓴坏已成而未燒者觸之則散由四勿而四無然後粹精琢而不磨燕石耳宋愚人以燕石為寶客見之而笑察之則贗偽物也韓愈詩居然見真贗齊人曰鴈魯人曰真舜大聖人猶無一日不學舜之學雖無書傳可見然常如深山野人一切皆不能以動其心必至於此然後為之至學夫子亦聖人也聚天下之賢豪而傳其所傳猶曰德之不修學之不講是吾憂也俛焉孳孳不知老之將至則道學也自修也豈易易事學與修一本學所以為修之之地修所以驗學之之功敢以學修而敬爾名願為舜毋為蹠願為孔毋為墨千里日至始于足下學修工夫爾其朂哉不則行百里者半九十至猶不至非所以望吾臣夫之雅子方天覺字重甫訓人心之所以知覺者何天牖之也人𦕈然小天牖之若孔易天曠然大人任之則甚重天若何牖之室以牖而明心無竅則塞心與耳目皆天與我耳耳聽目視覺之小心通衆理覺之大不立其大而從其小覺者昏矣重如之何天者人之天父者子之天子之身父之枝天牖之父教之思也若起行也若翼覺不知其為覺重亦不知其為重暴者弗克荷去聲棄者鮮克舉猶正墻面畫且息胥失之重甫重甫來前語汝一貫忠恕達則參唯士𢎞且毅仁任諸已鑽仰雖勞學博入約回竭吾才如立也卓大學一書在先明明克拓職分修齊治平乾稱一篇事親如天或樂或畏子責當然宇宙趨新烏山如故元氣清淑豈惟爾父天分學力兩遺後人重甫重甫拱璧爾身學孔字訓名異天叟之友君善留兄之子異丰姿清令性識機警冠前二日語叟曰夫人處世不能特異者俗不能大同者介余字異曰同叔何如叟復曰伯夷伊尹於孔子未嘗不同而丑也獨以所以異問孟以有若之言對蓋出乎其類者生與人同拔乎其萃者德與人異吾夫子所以不獨賢於堯舜而又自生民以來未有不獨未有而又盛也然則人患不能異耳雖吾夫子於逸民七人以下亦曰我則異於是無可無不可無可者不以可為主而有不可者存無不可者不以不可為主而有可者存此吾夫子所以異叟請易以學孔字孔何余何鈞之人也然正唯弟子不能學也善學孔者莫如顔猶末由猶而微猶未達况由賜商偃乎雖然聖無二道人無兩心孔雖萬世而一人心通千古於一息論語二十篇皆吾夫子之道亦吾夫子之心也而學論語者自鄉黨入學鄉黨然後容體正顔色齊辭令順斯可以語成人於是乎冠異今冠矣所以異于人者何曰異所願學者孔子惟學孔子故與人異否則與人同奚其異夾谷可與字訓名立夾谷可與之在門也度而文日以四書為問暇時請曰立以可與敬名願先生訓其義授之叟曰論語二十篇唯子罕二十九章最難體認此章重在權字自漢以來談經者俱以反經合道為權先儒謂權只是經又謂權與經亦當有辯吾子不字與權而字可與者何可與曰蓋欲識權之義必先知立之方立者自守之固也立也齒未學與適道雖粗知趣守苟不固前功俱棄叟因訓之曰顔子得夫子博約之說既竭吾才如有所立卓爾孟子之答公孫丑亦曰中道而立能者從之顔之所謂立者中也孟子之所謂立者亦中也惟知所謂中然後知所謂權中未易知也執一則非中矣學道立權四字而立居其三此正是過關處學道而不能立則轉而之他亦易從矣立而不中安知權之為義哉權者所以稱輕重而取中也雖然夫子曰可與者可者當其時之謂與之為言許也蓋學而適正道然後許之以自立許之以自立然後許之以權吾夫子十五而志於學三十然後而立立之一字不亦難難可與年駸三十從孟之所謂立而見顔之所謂立庶幾可以進吾夫子之所謂立歲月未艾工夫儘長可與朂哉異時人皆與之不獨吾與之姚平山仲一字訓夫子生知安行者也猶曰庸德之行庸言之謹有所不足不敢不勉此語原從何來蓋得於易之乾乾健故一誠故一夫子自志學至不踰矩無一時一刻不下工夫健而誠所以一學乾自中庸始庸者常也惟常乃一學夫子至于一然後庶㡬夫子彼曰唯者何人哉誰謂華山名髙企其齊而仲一進之又進之字汝亦說名驥平山猶子兄弟之子俱韶潤坡云花顔得酒尚能韶韶紅也又有妖韶女雖老有餘態驥於第為孟驥名馬佳子弟肖之驥冠畢友人黄淵曰汝來前吾語汝睎驥易亦驥難晞願學焉亦斯齊矣驥之可稱者德非謂日致千里曷謂德調不駭輿良不踶齧閑之維則此一句出詩翼翼斯臧人於子弟願為良不願為駑願為駿不願為􅐒玉篇音䝉士東切驢子也不遲頓韓詩曰駑馬遲頓不跅弛漢書曰泛駕之馬跅弛之士跅落無檢局放弛不遵法度不齷齪齷齪齒相近聲亦不厲搏厲搏晉問云喜者鵲厲怒者人摶教則指毛命物朱子云毛馬齊其色物馬齊其力凡祭祀朝覲㑹同毛馬而頒之凡軍事物馬而頒之吉尚文武尚强旅立相馴驤則風騣音宗霧鬛東坡詩風鬃霧鬛寒颼颼駕雪來下二句出晉問非人中驥乎顔淵於舜曰有為者亦若是揚雄於回曰睎顔亦顔之徒余敢字汝曰汝亦夢雲夢雷伯仲字訓雲字祥甫雷字澤甫魁樞忠肅公公名文龍之子伯夢雲仲夢雷公在之日命之也雲也雷也於公名同類而相感者也公之意深乎哉然則曷敬二子名雲之閑抱幽石依深谷雲之神沛雨而徧乾坤捧日而端至尊詩云歸去不成雨虚岩抱石眠公羊傳曰觸石而出不崇朝而徧雨乎天下吾字雲曰祥父雷之伏孕根荄保蟄藏雷之起發駭響於地中騰百川于天下吾字雷曰澤父雲屬坎大象言雲者二將作而未大故屯雖小而未垂故需何以故險猶入而未出也出乎險則施平矣人世有平有險險則隠絢然五色賢人祥也韓賀慶雲表五采五色光華不可徧觀平則見爛然輪囷屈曲盤戾貌歌云郁郁紛紛蕭索輪囷是謂慶雲朝廷祥也宋書曰慶雲五色太平之應也忠肅公之以名汝雲也以此震為雷象於屯卦獨曰洊雷一而再故曰洊敬天之怒當恐當懼象曰洊雷震君子以恐懼修省何以故氣猶逆而未解也逆者解則雨作矣人境有逆有順逆則困衡拂亂動心忍性辟辟音闢除也隂養陽巻去聲之澤一身順則發潛振槁闐闐音田雷聲天衢莫我敢遏鼔之澤八方忠肅公之名汝雷也以此祥父從忠肅公以死生險阻備嘗矣澤父思忠肅公之不生還創平聲巨痛深矣憂不極者智不明困不深者思不發天之成就大才也每於窮困為造化降之祥澤汝後必矣二子者慎而汝也身勉而學以答天意世故風雨何足以動汝哉伯俊字訓名髦實父亞余十歲餘有子伯俊冠余不及從賓贊後賀之日伯俊以見鄉先生之禮見去聲睂宇軒軒韶舉韶和暢之義見正韻言其生質之美居然是出羣器實父曰有可以善善否余按爾雅曰髦俊也註云士中之俊如毛中之髦然則詩所謂譽髦斯士者其俊士與又按淮南子曰知過千人謂之俊十人謂之傑夫一人而蓋十人之上難矣又蓋千人之上愈難矣然傑以天資言俊以學力言傑以才言俊以德言資不可恃須學以將才不可衒須德以充人豈易為哉學者學為人而已未冠教之小學所以養材而育德已冠敎之大學所以長才而成德冠責成人之道人孰大人身爲大又孰大人倫為大冠義記誠身為上盡倫次之大賢地位由此階升顔子之為顔子者由謹視聽言動之四曽子之為曾子者由敬容貌顔色辭氣之三故回居四科之首參於晚年傳道最先夫子猶曰囘其庶乎孟子猶曰事親若曾子者可二者咸無焉衆人矣何以為髦士何以蓋千人之上伯俊勉之若夫年少氣盛色矜意髙此二句為冒謂能文章為俊角勝于觜距之場二句一意謂取功名為俊挺立於風浪之津二句一意如天邊鶻飛有息時如冀北馬馳有止時竊竊乎何足長雄一世三句作一意勉之詞人所共知戒之詞出于先生之所獨得渾厚嚴毅且敬且服伯俊戒之彦聖字訓名宜春乾坤軒豁日星明穊音既稠也人生其間或一值焉舜臣五武臣十唐虞之際於斯為盛山川出雲有開必先當之者維申及甫東周仲尼七雄子車斯文之傳千萬萬古然當年老身未嘗一日泰猶之潤溽也而禾盛月令六月土潤溽暑禾盛者感火氣也蟄坏也而鞠黄月令八月蟄蟲坏户鞠黄者感金氣也坏音陪閉塞也而芸生月令十月閉塞而成冬芸生者感陽氣也俱不如勾畢出萌盡達之時二句出月令季春之月條惟人亦然天之生人也不偶將福祐而家扶將而身必稟之以中和之氣必畀之以賢聖之資必開之以明昌之運人生于中國又生為人又生為丈夫此身不貲貲音咨史記不訾之身謂貴重無量可比也通作貲夫豈易得為雅子然後貽父母以令名為吉士然後副國人之幸願為良臣然後為清朝之瑞物非但曰饑食渴飲夏葛冬裘而已非但曰服備可以成人矣吾友戴君存厚之嗣適音嫡曰宜春孩名也問字於余春字六經何訓余以鄉飲酒義六言言字也下春産六字是也對春産萬物者聖敢奉字曰彦聖甫彦美也聖生也君與先大夫種德未食其報有子如春生意方將美哉美哉詩曰彼其之子邦之彦兮果如是余與存厚閑我弟兄老伴願見之子如唐虞成周也豈不美哉美哉明卿字訓名惟月吾鄉莊敏龔公之族子惟月冠其叔景陽請字於其師閑我閑我以明卿字天叟為之訓曰月受日光故與日貞明而不息古人制字所以從日從月為明雖然日無盈虧月有圓缺自哉生明而之望明者漸盛而漸滿自旣生魄而之晦明者漸減而漸消然消者固未嘗消而明之本體即在人雖負陰抱陽以生陽為一身之主幼而冠冠而壯自哉生明而之望之月也壯而衰衰而老自既生魄而之晦之月也養之以理義充之以學問一㸃光明皦皦生白何少何老昏於情蔽於慾入歲以來即有䝉氣矧及耄乎昔謝重侍王道子坐月夜明白本傳作明浄道子歎以為佳重曰不如微雲㸃綴道子曰卿居心不淨乃欲滓穢太清耶事見本傳此事雖小可以喻大明卿戒之毋斁林則時字說名宜韻鄉老人黄淵天叟之友清逸處士林伯雨之良子宜韶姸警敏有蒼老氣處士愛之叔父沖素處士尤異之歲己丑十一月丙午朔日南至之明日冠前期處士語叟某以則時為吾子敬名請所以訓叟曰宜者當然之理時者介然之㡬孟曰介然理若典要時有變易以權合經則存乎人易彖傳於頥大過解革言時於坎睽蹇言時用而言時義者四時與義皆兩事獨於隨曰隨時之義與豫遯姤旅不同義者宜也隨時之宜不繫乎人故隨貴變也隨之義大在學者則審已而隨於人臨事而擇所隨皆隨也有可隨有不可隨是謂時措之宜苟以無可無不可為隨惡乎宜乎人性皆理不能無欲氣質之用狹問學之功淺於是公私非是剛柔緩急長短小大先昧乎介然之㡬動靜損益出處語黙取予辭受俱越乎當然之理惟不識時故不達宜隨之爻丈夫皆陽小子皆陰係陽失陰居正者也係隂失陽從邪者也已居於正凡事皆正已從於邪凡事皆邪苟隨乎哉則時春秋尚富驟難語易然既以成人見丈夫小子當謹所隨叟敢申時之義而祝以詞曰聖人即乾惟一仲尼稷回參伋賢者之隨軻深乎易其庶乎幾楊墨子莫三者俱非改而他師陳相夷之正乎不也善惡兩岐而則時甫謂起家兒昨丱今弁如墻築基大體小體慎從爾思舍賤就貴清斯濁斯稱量尋尺範我驅馳學道立權惟君子時衣去聲兹德言福祿來宜顧舜可字說名松老天地人物通一氣耳木之受氣有淺深厚薄松也稟天地之英氣故為百昌之傑仲尼曰受命于地惟松柏獨也在冬夏青青受命于天惟舜也正幸能正生以正衆生此說蓋木於此人之受氣有昏明清濁舜也稟天地之正氣故為羣倫之冠是皆自然而然者雖然君子不論氣木心不正脈理皆邪松唯有心貫四時而不改柯易葉人所以虚靈知覺者心心之精神是謂聖聖豈異於人哉順其天盡其性耳舜此仁義我亦此仁義舜此孝弟我亦此孝弟此心之存曰我即舜猶之松焉中堅緻而潤澤自根實而神王豈必注沆瀣之華薄日月之光然後可以柱明堂而棟大厦余友閑我之子松老冠以舜可敬名千歲之材養於拱把昨視如嬰今視如龍虬角雖弁鱗髯未蒼積之以年月培之以學問老之以師友勿蝕之以好樂而害其長勿薫之以聲譽而耗其實勿深之以嗜欲而搖其本天真全而本性得松乎舜哉舜乎松哉叟亦閱世卧雲壑者愛吾舜可如子姓願吾舜可封殖之傅彌年字訓名九成傅元楚之孫與㸃之子九成名清令可愛踰就外傅之年二受業於余啓發之資達憤悱之志遲長善救失余之職也設弧之旦乃先吾魯中叟一日孔子魯襄公二十二年庚戍歲十一月庚子生余心竒之雖未冠預為之字曰彌年彌之為言益也久也年之為言夀也耉也舜樂九成逮周之東㡬二千年而魯中叟猶在齊聞之德之深者樂之入人亦深豈可以歲月計之雖然年彌髙難難德彌卲又難難禮經冠字之詞祝之以成德祝之以麋夀麋鹿之大者夀千歲滿五百則色白蓋欲其德與年俱進進不已也德者何事親孝敬長弟存心仁制事義盡已忠待人信而又詩以養其情性禮以束其肌膚擇正人之居遊逺損者之友樂藏修息游不離乎師夫然後德偕身長日益而不自知昌而熾耆而艾不知老之將至也年彌髙德彌卲惟魯中叟一人當之或曰衞武公亦其人也余於是訓其義以授彌年彌年志夫子之學者也武公事業又係乎時之我以爾聽余言毋忽林于髙三子字祝辭引前進士年家子林于髙之子伯肖祖仲肩祖叔肯祖幼而知學婁音旅語叟曰晉人呼名為小字柴桑翁靖節之子孩名之曰儼字之求思余欲援陶例為三子請所以字先生其惠教之叟諾而未暇一日過于髙所呼三子前誨之曰材衖宗薄公而曽大父也松湖宰公而大父也而知爾父名汝之意否叟為若各訓以字而祝以辭若其聽之毋忽師說祝辭肖祖字昔傅氏說審象惟肖待以師臣置之廊廟問答三篇如天兩曜典學二言君道體要矧人子者聿念厥紹詩禮傳家用功在少敬内義外父教師詔毋侗好佚毋浪謔笑字爾師說期爾英妙庶肖而祖之才之卲師孔祝辭肩祖字昔端木賜喻墻及肩衞聖人道日月與天雖未至孔得孔之傳性及聞道晚異早年矧人子者筆耕書田養正於䝉習慣自然毋為物誘毋為欲遷必𢎞必毅任重力專字爾師孔期爾聖賢庶肩而祖復舊家氊師旦祝辭肯祖字昔周公旦堂播曰肯大誥告王明訓炳炳特友其辭以教以儆俾無棄基歴年有永矧人子者學為本領禮戒四非日常三省透善惡關造聖賢境當仁不讓做第一等字汝師旦期汝忠鯁庶肯而祖盛名鼎鼎以辯以順字訓以辯井之字以順升之字叟祝于髙三子以字髙之兄于野又請曰行可叔父之子二曰井曰升俱可教先生亦贈以言叟答野曰易大傳三言九卦三陳九卦以明憂患之道履謙復恒損益困井巽九卦一言井德之地二言井居其所而不遷三言井以辨義其三於井曰井以辨義井雖居其所而不移汲者徃徃來來所以汲者或大或小或木或缶應之多少各隨其宜此謂辨義人之酬酢事物亦然敢字井曰以辨辨即明辨之謂善惡不辨寜合於義易大象言君子五十三有言在上者有言在下者有兼上下言者各有受用處升曰君子以順德積小以髙大木生地中日髙一日此升之象而必曰順者蓋惟積故髙由小而大木之勢順也君子觀象而順自有之德性於小者日日積之未有不極其髙大者此心此身至切工夫不善學者每於小善多不屑為逆矣又安能積又安能髙敢字升曰以順先儒讀大學誠意章方透善惡一關爾辨爾順戒之戒之野命二子拜曰敢不承教林起東字訓名寅生叔父林某為其兄時軒之子寅生冠字則朋友命之禮也易說卦曰帝出乎震震東方也漢律厯志曰引達于寅寅於方為東於時為春天時人事於此乎始書言東作者謂萬事至東而俱作非止農功也一歲之計在春一日之計在寅一生之計在少少而學者大明東生然後晉而中天不學則晦明者損矣昔晉趙文子冠見韓獻子韓戒之曰此謂成人始與善善進不善蔑由進始之一字旭日始旦之義也戒爾寅生字爾起東此余所以覆露子也起東朂哉甥孫郭啓翁智逺字訓啓之為言開也譬之戸焉闢則通闔則塞人之所以為人者心也心之所以通達者識也仁義禮智皆心所有雖仁為先而智實重于仁是非之心不明則仁義禮智皆失其本心矣詩云天之牖民如壎如篪天之啓乎人者在一牖字伊尹曰先知覺後知先覺覺後覺人之啓乎人者在一覺字牖惟虚故明心惟虚故智心之智在覺惟覺則悟入甥郭之仲子曰啟翁余為之字曰智逺人而不智心孔其開乎雖然啓之者天也使之知所以啓而啓者人也人非學不成學非師不啓人誰不智氣貳之欲參之啓者塞矣吾夫子之於門弟子曰不憤不啓俟其自憤而後啓也憤則智之天即在啓則智於理必明愈廣大愈髙明智其逺乎然則智之所以逺者自學始學日廢則識日卑智若何而致逺師之良友之勝前之鍵鍵音蹇管鑰也今之通啓矣知奚止於一室之内宇宙豁如古今昭如逺矣若夫傅巖老子啓沃一事余未敢遽言之髙智逺智逺毋為人下朂哉朂哉林景惠字說名和余友林德符之仲子小名佛奴蓋感吉夢名之也將冠謂與伯子之名不類更名曰和字景惠屬余訓其義余曰人於天地之性一而氣質或失之偏即之也溫聽其言也厲人不皆吾夫子也中節之和十人中八九失之况制行乎和而不以禮有子患其不可和而不流子思然後許以强哉矯生斯世為斯民同流合汙以此為和不然昔者髙辛氏子豹之惠貍之和各盡其一俱謂之元之二言而欲兼有之不亦難難後來魯展氏季百世之下聞其風者薄夫猶可使敦鄙夫猶可使寛和㡬於聖矣孟子車尚慮學之者其弊流於不恭蓋學之者但知季之和而不知季之介季降志辱身矣而言中倫行中慮事人以直斷不枉道雖三公莫易其介徒和乎哉景惠景惠而知而大人命汝字汝之意否而質過于狷狷雖行已有守惡乎和而量失於褊褊則待人太狹矯其褊而歸之和如魯男子之學惠也斯可謂之和矣汝聽余言可當佩韋毋忽洪與我字說名恩先友洪德章之孫恩祖命之名也將冠乃翁問字於叟叟曰人生在三君父師也戴履中間食土衣毛此君之恩也鞠我育我顧我腹我此父之恩也匡之直之輔之翼之此師之恩也入而侍親知所以孝出而就師知所以敬仕而事君知所以忠此為人之大閑也雖然有此身則有此性性孰命之天命之則此恩若何而報之乎四端五實天既全而與之人而為人亦當全其所賦賦布也分也付與也付而有其所有視聽言動之勿非禮而後謂之奉天容貌辭氣顔色之貴乎道而後謂之順天侗好逸則䙝天矣邇宵人則逆天矣君者臣之天東西南北唯命之從可也父者子之天不虧其體不辱其親可也門弟之師夫子蓋受罔極之賜喻以日月而未足又喻之以天不可階則事師猶天也天豈易事哉雖然知天之與我以斯道也當自學問中來學有二曰知與行孟子車曰知性則知天知之事也養性所以事天行之事也又謂耳目心三者皆天之所與我者先立乎其大者則其小弗能奪此其為大人而已矣大者曰心之官則思也恩將冠則學為大人矣叟於是字汝曰與我蓋以天兼君父師言也事天則知所以事君父師矣張逺公西銘一篇盡之乃翁其以此誨而子與我而衣斯言陳汝作字說名雷霖鄞江陳耀卿之雅子芳年華月清令可愛慕道而劬書不逺訪天叟于莆叟扣其名若字以雷霖國濟對叟曰濟者舟楫之事不如霖雨之難雨所以澤天下蒼生也國云乎哉為之更曰汝作易屯解二卦俱震與坎雷之鼔則為雨其未作也屯之象其既作也解之象屯者君子以經綸之時經綸者屯難之世君子有為之時屯之亨則施光矣解者君子有攸徃之時解之動則夙吉矣若有所徃則宜早徃早復不可久煩擾也蓋解出初險雖然易不言霖者何雨三日以徃為霖霖即雨也雖然乾言雲雨而不言雷者何乾之初爻為震震為雷時方就潛而未躍故霖亦渴而未作飛則雨施平矣雖然見龍在田德博而化是亦大人作霖之事也維昔髙宗中興商室此飛龍之大人也有臣曰説起於傅巖此見龍之大人也以大德之君遇大德之臣作霖之寄不仰諸說則仰諸誰時之未則潛時之以則見聲應氣求霖其作乎爰敬汝字曰汝作甫汝作歸而復于乃翁翁必曰作霖相業也說之相業蓋自學始叟誨汝以學今日之學異日之行汝作其以此字為字陳耀卿字敘名暉易小象傳曰君子之光其暉吉也光者明之體暉者明之用光至於暉其明著矣暉至于耀明又盛矣嘗譬之日光其質也暉旭旦也耀則中天而明無不照也天地始判日即生焉若非日昱乎晝宇宙晦㝠萬物何所覩哉人之所以光明俊偉者以陽明之氣塞吾其體也故積中發外如日之暉學問之充事業之見炳炳烺烺照人耳目又暉之耀書曰爽邦由哲哲即暉之義爽即耀之義爽以事言哲以人言以哲人而理邦政事事爽快明白決矣吾曜卿之名之字以此或曰前修名褒字貶今曰暉又曰耀毋乃非用晦而明之理曰不然君子未嘗不晦其明也而明之誠形自不可揜丈夫礌礌如日有豁達無晦昧不者幽隂之小人耳昔裴耀卿字煥之於唐貞觀開元間有直聲後來官至平章僕射豈拘拘以名褒字貶為例乎吾耀卿之名之字以此耀卿名暉族陳氏鄞江人今佐清漳府幕余因字其子汝作并敘耀卿所以名字之義余莆四如老人黄淵天叟大年字訓名焴孫從子身道之子焴孫設弧日伯祖名之年十八將加元服伯祖又字之大年榖熟則人民育五糓皆熟斯大有年焴字從火從育榖雖生於土潤於雨炊㸑者火餴饎者亦火也餴甫云切半蒸飯饎食也音熾非是惡乎育農之殖苖苗冀其秀秀冀其實然後謂之有年蓄之豐積之髙又謂之大有年人之於學亦然學所以育德也如坎之泉養於䝉如離之火進於晝則充實而有光輝之謂大年彌髙德亦彌卲矣而知伯祖名汝之意不也而氣質非不美剛或失之過而問學非不諄時或失之怠過非中也怠自棄也皆德之累旭日始旦毋寒于陰雨雪萌方茁毋失于野燒音少野火曰燒而欲為大人者當防人心之危深慮旦氣之梏親正士則謹繩墨就良師則知詩禮磋之磨之緝之熈之猶農力田年年而大有年老伯祖豈不願吾孫之為佳兒乎八十翁下筆至此感慨不少大年其衣此德言毋謂我耄喬年字訓燾字喬年㓜名疇祖號東軒行兆卄九官登仕郎興化路儒學教授四如公嫡孫翁老矣欲見一孫六十四歲梓也房下得長頭兒時至元甲午四月二十三日也喜劇醉劇弧矢之旦命以疇祖蓋翁號書疇亦蘄此孫耕書中之田享書中之夀也元貞丙申甫三晬翁語疇曰汝若冠翁名汝燾字汝喬年梓而父也從木燾從火又取生生不窮之意未及援陶翁字子例外表孤山聞之逺寄字義謂吾道之傳與天覆照同一悠久似大而夸或者疑之疇年十七翁又及見汝冠矣一日微熏快著數語人生難得男子身又難狀貌有雄偉者有竒怪者俱不若精神之淳容止有重遲者有皎厲者俱不若氣象之雅識見有曠逺者有深沈者俱不若學問之髙精神闒颯豈胡耉之相氣象便儇豈致逺之器學問卑陋豈典刑之老燾字從夀從火翁祝爾夀汝精神淳則生於色見於面爾氣象雅則望之儼即之溫爾學問髙則過則聖及則賢學問二字又精神氣象之本領養自家心濟自家身始則十五年一進自三十年每十年而一進至從心所欲不踰矩地位然後等而上之且八十且九十且百歲不知老之將至豈不光明俊偉哉不則悠悠失之于前又不汲汲償之於今精神氣象俱不惶惶枉過歲月夫奚益翁年八袠蘄汝為起家兒又為保家兒使邦人士稱願曰四如之孫巋巋喬岳翁與而父喜當如何喬年朂哉慎哉燾再拜曰敢不佩服大父之訓昌年字訓熈字昌年號耕道行兆三十五官將仕郎漳州照磨四如公次孫天叟以五行闕水請於先君更名淵梓以子材字水生木也子材之子孩名疇祖光祖俟其冠也孟名燾字喬年仲名熈字昌年卜於先聖而協木又生火也熈於書傳訓廣於周頌鄭箋俱訓光明獨昊天有成命篇毛傳訓廣而鄭謂廣當為光酌篇鄭又訓興廣也光也興也字訓雖異於義可貫而一熈字從火地二生火質若微而未著及其炎上大有之在天上而文明重離之照四方而麗正豈不熾而昌乎辰為大火於人猶少之年也午為鶉火於人猶壯之年也人之年學問貴少事業貴壯少而學問始旦之旭大昕之朝煇如也壯而事業書日之接庭燎之㑹則有光矣然事業之係乎天者不可必學問之盡諸已者不可廢學問緝熈於光明則可以續詩書之燈可以嗣父祖之徽不惟亢身而又亢宗不者影響昧昧老而無聞與夜行而不以燭者何異若夫事業之來行其素學不必矜察察之政不必求赫赫之譽亦必炳炳烺烺為一光明俊偉底人庶㡬熈熈乎廣哉功名久逺理義悠長而昌爾年熈也允臧時大德癸夘秋光祖第二晬之旦大父四如老人作示子材教昌年昔爾大父命名曰熈爰字昌年預作訓辭熈字從火昌字從日火日光明義訓則一汝今冠矣惟學則明如火始然如日方升傳書傳人祝爾遐夀旣昌而身復昌厥後至治初元清明後一日父梓書四如集卷三欽定四庫全書四如集巻四宋黃仲元撰
