body:
  text: 清逸處士春山林君墓誌銘嗚呼天人革命之際仗節守義世自有人直少耳山林臯壤之士履潔高蹈又一軰人若夫城是民非火水焦没人皆逺嫌謗算成敗事如蟣虱誰爬梳之士有不幸身値時危浪驚柂旋若亡楫維春山林君伯雨雷龍所以冐風塵而不辭君豈樂諧附邀顯融者姑尚抑齊陳公尚即尚公主之尚抑齊葢雷龍之姑夫也即忠惠公陳鞾開閫秉樞君朝夕侍何官弗可廼廻翔隨計甘垂翅於青㝠仙㓂鼎沸君迯難客止北山方公思練事達變者左右之檄君叅録令莆田無何陞佐郡改宣教郎北騎環城來之皆坎命隻患深墮乎樊中輿圖混官制行君以治中署郡事不年餘流離集震撼定君精神倦閉門郤掃而清逸之褒渥矣鴻已㝠飛猶離矰繳雖家事落然而賦詩怡然耕吟前藁予跋醉吟漫吟後藁予敘本生父大有母葉氏更葬予銘已系家牒最可痛者世父大存卒君後之伯氏霖龍卒君元妃黃夫人子世雄後之世雄與季敏孫死兵夫人前卒繼陳氏子猶子宜翁宜温恭善為子婦貢士黃鎧女十年君卒又五年宜夭母陳氏以宜兄伯竒次男富孫主宜喪彼蒼廻斡胡爲是區區者不畀于君殊未可曉君貌魁梧襟坦夷詩精毛氏故故謂經之㫖趣云訓故舉大義而已史熟司馬治鑑書工顔筆天文地理貫穿融液辰冬末疾帳坐末疾謂手足緩急猶校唐詩明夏端午再作手教囑宜學禮於余余亟存問連呼易簀者三曾子寢疾童子曰華而睆大夫之簀與曾子曰斯季孫之賜我未之能易也元起而易之死生大聚散矣君生乙未正月殁癸巳五月年五十九宜生癸酉四月殁丁酉三月年二十五伯竒卜是歳閏臘庚申葬君延壽羅峯原以宜祔女子子四長婿教諭陳大雅男良燾次與側出住奴許嫁傅黃宦族㓜恃其母孫男富孫女二伯竒飲泣謁銘予書曰先賤後貴者多壯達晩窮者幾窮似達貴似賤者此莫之致而致君跋㚄於景定驅馳乎丑寅無須㬰之樂有寵辱之危殆如沐而求解未有騎而不下覺今昨之是非付春華之開謝雖令客之不來幸處士之可書竹風燥兮霜梧雄鳳去兮呼雛造物者未定君父子竟制於天歟造物者果定君子孫其必振歟嗚呼韶溪姚君墓銘屠維單閼之歲屠維已也單閼卯也閼逢閹茂之月閼逢甲也閹茂戊也前福清尉姚勉將葬其父闕走𨽻人以善狀來謁銘曰銘所以繫名傳世先生諱淇字景瞻世居莆之韶溪因號韶溪曰朝嗣者晦徳不仕曾大父也曰野庵先生隆贈朝散大夫者大父也曰龍川府君直夫階至朝奉大夫者父也配魏氏息九人男君錫君煥俱夭君舉為伯貢士元泰後君厚業於文勉也女適魏節孫益敬顧成父郭元善皆士大夫族願書之以附繫名傳世之義銘所以論譔先美先人蚤讀世書侍龍川府君之治所禦㓂捍城士之甚武之甚晩學空竺不牽六欲自束脩至耆指使六十曰耆指使經云嗜稽乆之稱不自用力繼以指意使令人爲子孝爲弟弟於僚友稱長者於閭巷稱善人願書之以附論譔先美之義銘所以志卒葬月日先人不幸甲戍臘月十七日以疾終禮踰月而葬何以緩亂故勉未即死危不得葬今兹筮宅于鳳蹟山占曰從卜日癸酉占曰從卒窆有期願書之以附志卒葬月日之義淵曰嗟嗟乎景瞻之光系如此不書惡惡可景瞻之爲人如此不書惡惡可嗟嗟乎景瞻之有子如此不書惡惡可勉以京學進士恩免受初階屬車蒙塵承詔扈從特循一資景瞻亦㫖贈從事郎惜景瞻之不及見也夫書而予之銘曰后土濕兮天隂隂山河在兮草木深東西兮乞命大王南北兮校尉摸金人何生兮可藉骨何土兮可托思滄海兮欲傾歎親朋兮凋落若景瞻者積善之餘死順其正葬歸其居淒淒寒風蒼蒼宰木泉石有知護一團玉書宋故龍川史君姚公墓誌後公官至二千石而清貧如韋布士徳彌厚葬彌薄後三十載或猶尋陽翟藏處張侍中遺言厚葬晏丞相遺言薄葬二公俱葬陽翟厚葬免禍薄塟致禍嗚呼時危世難干戈接聯泉下徳人有幸不幸非關葬厚薄也公之孫勉偕諸昆弟忍痛更葬事已泣曰丈夫得一幅汗青足矣事謬不然史筆悠悠昔誌吾祖者其人最强項廼大書曰善人曰君子曰循吏曰老壯窮堅陵遷谷易一切毁壞此紙幸留吾將重刻宰上以識吾哀願徵辭於石隂余嘗銘公之子景瞻之墓三嘆兹事忍書之乎雖然自有龍坡有此山川人朽名芳公何憾焉諸孫雅雅書種綿綿時之來兮當復家氊如一株桂散花萬千秋香未歇更有年年維女後之人慎旃慎旃詩旃之也歲辛巳後中秋里後學韻鄉老人黃淵誌更葬月日不書歐陽君厚墓誌銘漢重儒林學尚書者班固著以歐陽氏班固傳歐陽𤣥字伯和事伏生授兒子孫相傳尚書世冇歐陽氏學唐尚進士官四門者韓愈號以歐陽生韓愈有歐陽生哀辭生謂詹也曷爲氏若生尊異之也問其人與可傳者問名不問位士有不第進士置籍儒林伍中亦可書已况四門苗裔乎或問某生曰吾里井上君厚也井上粤若來登年矣君厚曾大父渭卿欝林州博白縣令大父祺父起莘世食舊德君厚諱德載以質行稱財五十有九卒君厚持家約與人信誨子弟以誠塊處一室對聖賢書目謹勑士偶快意飲酣歌永叔醉翁亭記坡老赤壁賦又風塵表物初署博士生浮屠氏歸我田博士以文功比於武事命題君厚賦出聲籍甚後二十年浮屠氏復取我田君厚持左契白大閫卒我歸某甲㥏音典心慙墨不得意去君厚儒人此事未見儕輩猶交誦義籍棄塲屋試州縣什出二三恐未可少弄筆生不幸老死罣音圭蓽門圭竇衡堇堇耳耳君厚未死前七日趣具觴客與訣參悟死生如雨日霽此豈無所養者黨逮耇兮留今視東門其可蕪未知尚端坐讀書或拊缶而呼烏烏唉君厚之闕㓜孤字之誨之歲甲子果薦名娶呉氏子男四椿壽梓稚圭泰吉女二皆歸士族孫至孫丙子秋呉夫人亦亡亡之四月椿壽有兵難明年又明年仲子梓卜竁桃枝嶺吉𤣥月己酉雙合窆椿壽從祔緩以亂故梓也才來謁銘涕滿匡問所以表於原上吾曰先大夫之可傳與子之可傳先大夫也氏亦可生亦可不者鄉人之於先大夫也君厚之我其亦君厚之乎公羊子曰稱字褒之也然則亦尊異之辭與梓唯唯吾於是書君厚之墓曰君厚而與銘曰彼岡然音洪石殞聲有宅隆然藏者瞢瞢然瞢音蒙目不明也來者顒顒然昔之日匔匔然匔音弓今之日蓬蓬然蓬音逢盛貌而我銘之􅍵􅍵然􅍵音同憂也李仁可墓銘嗚呼義士李君之墓君諱汝文字仁可其先温陵北鎭人六世祖以武功顯析居莆仙遊太平溪遂爲大族甲溪上大王父某王父某父某承信郎出山樹徳君倜儻有節㮣闕事當否立决盤錯無窘色視之量汪汪於人自青白闕試進士屈即棄場屋闕燬者再不悒悒人以緩急扣俱足分願去或闕亦不掛口晩年牀即床字頭金盡有謁闕獲狠者闕之寃者平之餓者活之尸者殣之殣覆道中死人於是此邑稱義士必曰李君李君閑居由由然與鄉人皆迎師教子非國士不我乎館精舍規橅視學宫先聖先師像設其間先聖先師見記東西齋寢偃偃謂屏厠庖湢備置都養來衿佩於是學子稱義士必曰李君李君丙子夏西鄉弄兵掀簸而南逼溪市二里許君率民伍勇前魁者手之徒有年少仞曰此李官人義士義士挾君挺身迯亡何忠肅陳公以樞參出爲撫諭使辟君授初階君囑予以好辭謝誠不願官忠肅公語余曰此時而有此人義士義士丑冬寅春兵南北來死者坻京君脫竒厄寄止湄隖不一月重遇攻刼窮空甚兵退君還溪滸招流逋化龍蛇爲赤子變榛莽爲聚落雖北人亦曰李官人義士義士溪北居者稍寧君翛音蕭然南山葢茅三間爲菟裘計左魯隠公曰營菟裘吾將老焉葢魯邑名病已藏即臟字去聲不安榖君適音的子師古衣不解帯醫禱萬方里父老俱蹙曰李官人義士義士辦香北嚮爲君祈生君竟不起疾其卒也人有欠君債者無有欠君淚者君所識多勝流獨敬余爲法度士庚午西上君爲治裝乙亥之戍君又治裝比君逋播猶資送余余亦曰君義士君義士每歲荔子丹走一力到城是年伻不來余心怪吾朱甥語君病故余亟寓書問無恙君病在席但寄聲云非止失食飲節言非飲食失節恐有死生分前夕君見音現夢於余上帝授我山主山主者爲山之主也余覺唶音窄左傳註行扈唶唶曰吾故人將如白雲在天不可呼不可呼又八日朱甥書言君死廼吾夢之明日又明日余爲位哭且哭以文此故人死無已知者師古日謀葬君戸外事或如疾風甚雨隻手爬梳保先人遺體不暇葬以此故緩令卜宅於某里某山之原食句食以卜言書惟洛食是也先一月師古哭徵銘余亦哭曰余尚忍銘此故人也夫然余不君銘又誰銘君元妃梁氏前卒繼室黃氏春秋六十六死當辛巳七月二十九日葬在某年某月某日師古黃出乆從余學頡頏詞章不與髽髽音查俱髽不與咻俱咻可謂克世其家它姬子某九歲女某四歲君平生厚親故里閈而汾曲之田不足供子舍舍人也饘粥然後人人知君爲龎公人人知君於死之年余知君於生之前君所以嗜予至老不衰今無此故人矣徒倚溪橋興懷舊事下晴風佳日至鷄鳴未散皆舊事也晴風佳日並轡班荆把酒持螯海蟹也雨浪平聲雨聲也之時促膝膝相逼也語軟鷄鳴未散俛仰已爲陳迹環溪觀大觀之觀去聲傍此土人尚有義士如吾故人李君者乎否不待弔君新墳然後洒淚向西風也悲夫銘曰人促促以爭名君視如涴音宛泥箸物人刼刼以營生君棄如唾吐涎也藐若視乎公卿其交有道若混世於埃塵其身皓皓前此酣歌升平洒掃擊考書傳所謂考擊也猶擊缶之意後乎蜩螗沸羮古詩有蜩螗沸羮之語喻昏亂也青山眊矂歲月忽兮流星死生事大叶柁去聲俗音也無老成兮典刑科斗瑣瑣埋斯人於幽扄九原者不可作些叶箇去聲借用也下馬者讀吾銘不沃酹車勿過故中山處士林明甫墓銘國清地名古有國清堂鄭耕老詩云六月國清堂上望依稀身更在西湖林氏之昭曰回年府君贈承奉郎國鈞於艾軒爲諸父行穆曰存庵先生浦生雷震震生丞丞生夢􅙫即栗字其嗣適音嫡諱遵文字明甫自號中山處士生於甲辰四月娶朱氏生丈夫子二曾度曾贍女子一歸呉遯山次男公老孫男三實寶潛以大德庚子九月某日考終年五十七余聞而哭之三丁未仲春卜某日窆于其原前期明甫親友存厚戴君元吉爲其孤來徵銘且告緩故余對存厚泣霑襟曰余嘗銘明甫先君子定齋矣尚忍銘吾明甫乎哉敢不諾嗚呼明甫家聲之懿世學之傳余初意爲快士及門授業廼衣服朴而無華辭觀德而有度觀去聲玉藻云習容觀注云容貌儀觀也識高趣平聲正余大噐識每月兩講雨甚亦至耳聽手抄退質所疑渙然怡然則於吾言無不説舉子業中方幅間得前輩緒論扣所自以網山樂軒宏齋三先生對結字小楷不俗崔瑗雖得筆勢而結子小疏五七言妥帖深逺爲子弟無違禮處伯仲皆順德暇日校讐經史客來開樽觴詠春初秋九季也湖上宴集族戚怡如風月佳時買舟速余耕樂堂前濯纓亭上爵油油後賦程伯子四時佳興四時佳興與人同程子秋律詩也玉藻云三爵而油油以退油油謹重自得之貌殊不减舍瑟人兵火後明甫孤苦負土營葬中猶遣伻來勞余戊戍酌余榖城炰鱉擘蟹明甫語余軒冕無分湖山有縁二句言生今猶旦暮明甫已不可作二句言死明甫雖事作業非賜之殖最樂周急非商之恡音吝與人立速也然諾非求之辟凡事務平實非師之過貢法乆停擇師教子惟聖哲之書乃讀馬復有令計租受庸於刀筆之習必戒箕裘吾世業圭璧爾元身此明甫過庭之誨可以知所學所存矣婚嫁之債甫畢鐘鼎之養不待世運浩溔音杳人壽爾夭奈何乎明甫追念疇昔落月屋梁如見顔色不惟存厚痛吾明甫余彌痛吾明甫銘曰忠信篤敬若而人文質彬彬若而人之人也斯可謂之處士命子以曾欲其孝兄弟友于信其孝之子也斯可謂之雅子二孤皇皇相厥隂陽有封若堂歸燕爾藏德厚者流光善積者慶長書種兮不斷來裔兮永昌故進士謝春塘墓銘南劒將樂有進士謝景雲諱漢章號春塘者篤實君子也春塘性資聰頴十三通詩毛氏學弱冠兼治春秋三傳與老成人相頡頏二十有七以詩經拔解太常報聞還山著書有詩集傳春秋分國事類春塘小藁八卷不幸年三十二蚤世孰予去聲其有不使其施悲夫先春塘病逾旬自忖不可諱呼冡子中筆授之曰􅀈有生而有死兮適晝夜之常理惜祖父之托重弓依後人以爲衞既未見於朝市兮合於山林而肆志􅀈買山之無錢吁捲茅之可慮無一名一位之可戀兮無好田良宅之可羡所戀者明師而今不可復親所羡者佳友而今不可復交生不得以遂丘水之願死必欲親身於丘水之遊後人成人以成余謀筆已浩歎而訣僕諷誦喟然曰春塘之所養可知已然此春塘之學之文也其大者孝爲百行之先春塘六歲失怙八歲而母趙嫁十四而大父母繼殁嫁母與後夫突如來如陽曰恤孤隂則剥廬易卦爻詞鬻産而去家事落矣他人不堪其憂春塘一身百難自童兒至没齒無怨言昔孟子車謂凱風親之過小而七子曰母氏勞苦母氏聖善不知其母之過春塘甚似甚似盖又難於凱風矣有學有文而嗇於年世固有之醇孝而不胡耇未之有也薰致燒膏見焫天何爲哉此可爲春塘嗟嘆也僕於春塘雅不相識於其子聞譽處而已無疑號也不逺裒春塘行義年寓書徵文於後死者曰詩云明發不寐有懷二人傳禮者曰父母之謂中於日月將改葬先父母敢泣以請僕拊心語我不知其人人奚我知欲辭之而逺不可辭廼摭家乘繫其世出謝方雅之族晉末散居江左入閩則五代之季於泉爲著姓有諱履者官至工部春塘鼻祖也占籍惠安菱溪多聞人有諱瑞者宦學古鏞樂其風土家焉曾大父維清結廬邑南三十里許大父如晦又於泉獅巖下卜宅四載而返古鏞二父業詩爲經師大父娶趙不宜男父炎劉出裹糧旴江受業名未就而夭母亦趙氏生春塘及女子子一春塘妃呉氏丈夫子中前順昌雙峯山長仲文逺季不成殤女昭奴下殤生八歲以上乃成殤春塘生於某年某日卒以乙亥八月某日呉矢靡它後春塘三十三年卒中娶李氏文逺娶伍氏孫男三襄詢子一未名孫女三長未行平聲餘㓜二孤奉春塘吳氏匶合葬于瑞龍山之原至大已酉某月某日也無疑慷慨有大志學贍而工詩文前此迯難春塘平生所著十無二三無疑收拾殘斷廣求魁人韻士印刻板也可以慰春塘於九京九京讀爲九原墓山也吾家山谷敘謝師復遺藁方行萬里出門而車軸折可以隕涕余於春塘亦云吁嗟乎春塘難乎其爲子也子如無疑又能爲子來者觀謝氏世世不失令名當求之文墨之外不銘惡惡可銘曰春塘小字曰騫閔子騫也小字曰騫者言其少以孝稱也兮終身之孝國稱賢德行雖列四科兮可慟者似顔之年後之人後之人兮如松之茂蘭之滋後之人其謂誰兮五馬山下謝無疑相丘水而塴音崩堆也新阡兮是爲無疑之父之墓銘春塘者又誰兮莆四如黃淵彦安甫架閣通直劉君墓誌銘嗚呼丙申之難岷峨悽愴衣冠屑播於江浙湖廣者夥獨閩最尠丙子之變山岳舍故輿徒奔湊於七閩又多惟莆罕見巳卯春余坐文峯下有一士巾履儼如歩趨翼如意其官人也揖與之言氣下語温粹德君子也詢族出則曾森諱存畔字蜀簡池後溪文節劉公之曾孫也交臂而散猶未相知且相善君時僑客寓也爲莆人郡庠學正虛席金贊君氏名於博士曰願借蜀産之珍以爲莆泮之望博士即延致之余寄食西東貧故之以君抽裳金舘勝彦買書教子經緝生計雖不豐亦苟美且養先夫人文氏所生楊氏如母而尚平之債俱了尚平字子平後漢人男女婚嫁既畢乃勅斷家事遊五岳名山不知所終時相過存呼樽對牀嘯咏談賞君善余余亦知君矣君靖厚淳質慎交遊遵涯分而意外之來有如疾風甚雨不數年物之倘來皆寄百年之身寄而又寄前孰翼之後孰顛之天公似太憒憒遂以存吾自號然忍人所不能忍有無畧不掛口篤鄉情者今玉融守梅庵母公前莆田尉菊存班君二人耳歲丙申來往延平良苦至未越月冡訟復起君心𠞰形瘵疾於是乎作瘵音再病也余於君雖悃悃款款然亦奈君何哉少間君愀然曰吾祖與父壽俱五十八吾年相符恐止此數余對毋恐毋音無亡何亡音無君果不起倫莫大於朋友痛莫大於死生嗚呼君之世系大王父先祖即後溪先生學禁中魁人韻士也王父某秘閣監丞父某大理正母鄧氏君之宦學繇䕃補銓注泰州民曹調三衢讞掾攝龍游今遄剡爲眞在有政稱人呼活佛改通直郎刑工部架閣洎長涵江書院非君志也君之歲月庚子十月二十六日生于霅川霅音狎蜀地丁酉五月十二日卒于莆田寓舍君之妃𦙍平舟楊公之外孫女即文氏先已卯二月卒男季源季深女適前宗正丞蒲公某之子杭前進士趙時􅀈之子佛孫佛家奴女珠娘外孫旂孫嗣祖續祖女聖奴先是君自度竁音串壙也於常太里芳蓮塘辰山葬其配而虛其左今二孤筮庚子六月甲寅奉匶即窆音砭下棺壙中也昔有父没而不克葬後好事者改卜新宅文士多之君家弊矣源也深也二子名垢衣削食復君于土則爲有子矣雖然此子道之當然是則銘銘曰時之來兮顯融時之去兮窮空日未昳兮數終宴其歸兮幽宫極必復兮變則通後人弗棄基兮庶揚乃祖乃父之清風重曰重猶騷之亂詞結語瞻彼墓門云誰之思彼西方之美人兮九京若何起之噫太學録此堂葉公墓銘嗚呼天下事有幸不幸惟士亦然士之進身先鄉貢次舍法偶中鵠則謂之幸非知得也不貫革則爲不幸非愚失也月書歲攷健者升梯或再優或三優猶黃甲郎堂下再拜釋褐去余於此堂葉公君選見之君選樵之泰寧人諱必茂妙年異羣兒侍父宦遊師東莞謝某習周禮學已酉預計偕次年補太學生乙卯魁監舉三舍積優調温陵郡博士四考循從政郎監行在草料塲未上改轉文林郎除太學録兵戈橫放蒲海雲以招撫幙辟儒學提舉辟俱不就邑燬於盗公居深宻而强梗不敢犯􅖏門温故書􅖏音度塞也邑宰張梅溪某來即家起領學事公勉一出新廟學振文風張爲行省都事以公行蹟薦聞公已勇退淡泊無宦情矣自號此堂寡言慎行居鄉事上信友無貴賤老少一以謙和所謂泰而不驕者耄雖及而未嘗一食息廢學所謂俯焉孳孳者儒書外喜讀關老子繕生養性所謂修身以俟者其可敬也夫公之先大將軍從輝自富沙領軍鎭歸化即令邑因家焉洎公十二世矣曾大父某監潭州南岳廟大父某通直郎父某從政郎容州判官母三華陳封州某之女所生母蕭氏配亦廬陵尉蕭某之女公之栖辟雍也孺人治家課兒一不以諉公丈夫子二長繼與南劒路延平書院山長次某孫某某孺人甲午冬先卒葬于蟇湖生於丙戍二月某日乙未十一月二十一日終于家壽八十二卜以戊申臘某日窆公三湖祖塋之右承公志也余閒居無四方之役於公無一靣之雅公之孤某不逺寓書兒梓以銘文屬余後死者得托名於不腐焉敢以衰涸辭廼敘公世族行義年而銘曰天何爲哉奪有道士人生大齊百旦夜耳譬諸流水流者止矣譬諸行客行者歸矣然而歸者未嘗歸止者未嘗止詩書之澤流聖賢之道行不在其身則在其子孫孫子旭日東升又旦之始嗚呼此堂死乎不死隱君子林君亨之墓銘莆士大夫郡仙遊莆巖邑羅峯林氏仙遊右姓有以文藝官其族者有以耋老望其里者有以詩書世其家者余心慕之忻忻然一日過平聲詩人春山許許讀爲墅堂上畫像甚古望之鶴骨松貌川渟水止谷虛蕭然如雲水人使余已在塵􅅽之外曰此方山予季常與春山曰吾先君紫陽翁也像之右楷法端勁峭快贊之字即之貧賤自若王公不趨以此自處是名村夫此四句贊之詞下文故曰翁自贊也細讀乃見翁自贊也曰此東郊仲塗與嗚呼可以想見其爲人矣此一句結上二意問先諱曰大有名亨之字以字行紫陽翁其别號也問世出曰唐侍御史藻逺祖也太中公茂宗五世祖也累贈朝散去聲大夫巨曾王父也朝奉郎添差通判江州一鶚王父也宣教郎知南康郡都昌縣渙考也問年曰三百九十有二甲子也隱六十五歲有竒問娶曰夫人葉氏正簡公顒之曾孫女也問子姓曰男霖龍終承信郎監潮州鮀浦塲爲伯父後者雷龍也妻進士葉國佐者女也世雄承信郎閩廣宣撫大使司計議死于兵者孫也問學行年曰先君年十六即棄舉子業曰三塲焉能名世千里求師授六經學不肯爲章句儒老猶書眼如月暇則觴客賦詩深酌細論自解謫仙坡老妙處殆異乎弄筆生皓首不能離塲屋者十四字爲一句先君女兄弟抑齋忠肅陳公領招捕使時求士可客者以上清逸處士銘中姑尚抑齋考之抑齋即亨之女兄弟之夫也忠肅公陳鞾也先君甫弱冠練事若素宦噐爲偉人以官聞於朝搖手止止勿破戒殆異乎豪士俠客夤緣僥倖以發身者十五字爲一句咸淳改元寵秩髙年先君以雷龍名薦書故恩錫初階命書下一御冠裳拜於庭退解褐如它日語子孫曰生稱善人死表於墓曰處士吾願畢矣殆異乎纎夫窶人晩名一官沾沾自喜者十六字爲一句余曰不試進士如伊陽伯不拜聘爵如擊壤翁夫也中之矣春山又曰先君事親孝持身潔耆義樂施志節可託緩急莫年闢藏室編讀方外書人疑其為三景弟子而不知學伯陽也内景中景外景謂三景凡道通三景稱三景弟子魏伯陽作參同契二巻借爻象納甲之法寓行持進退之候將謝人封撫琴談笑端坐委蛻莊子言氣自委結如蝉蛻視家人無戀戀意人疑其爲仙臺郎而不知似東明也侯道葉晨飛松頂揮手謝衆曰玉皇詔我爲仙臺郎今去矣洞天六宫人死至其中各有職文王爲東明余乃問卒葬曰卒則戊辰四月二十八日葬則其年十月二十日也邑之慈孝里西明山所葬之麓也後一星終十一月庚申更葬之年月日也葬者霖龍更葬者雷龍也楄柎窀穸如初禮楄柎也又方木也柎合葬也長埋曰窀長夜曰穸雖更葬不改宅也不改宅何有舊也春山又涕下不能禁曰葬也者藏也子而藏其親孝斯終矣易易音異墓非古䘮不可不深長思也葬之又更葬於余心有大不獲已者昔人有云葢棺事了由今言之了猶未了乾巛坤慘慘盜賊攘攘百室之邑生者或可以隱死而埋藏地下者曾不得安乎若堂若坊夫子曰吾見封之若堂者見之若坊者矣檀弓堂坊皆壟之形荒炬野草雨夜風晨昭明焄蒿朱子曰鬼神之露光處是昭明其氣蒸上處是焄蒿不與萬物共盡安知不怒號而悲鳴人間别無􅀢事孝子創鉅痛甚創瘡通傷也􅂒也禮記頭有創則沭又刀傷未合曹參身被七十創宜於此焉變矣更葬云乎哉十餘年間天祝予天祝予吾所生父不幸大故吾兄死吾從子又死春餘展墓孑立捧奠思卜所以爲後者不可食息少遼緩更葬云乎哉元祐子孫一片精白後輩不知給事胡公知之子知我者願畀斯文光此壤樹余亦有愴於子懷不知哀之來處遂以所聞於春山者書曰有宋隱君子林君亨之墓廸功郎不書成君志也春山即君之仲子雷龍世其學者官侵漸也貴顯矣今食于家爵以不書書已揭銘宰上曰吁嗟夫君友羊裘晉蔣元卿開竹逕有羊仲裘仲與爲友鼻端不齅音嗅利名鈎死生夜旦等浮休冷平聲然御風逍遥遊空餘駿骨扃巖幽寒沙捲地岠音巨齊州蒼生破碎天爲愁九京紛紛離此郵星飛枕化託留侯櫝而藏之難也收體魄既宅神棲留白鶴柱頭嗟井丘表獨立兮山之陬一酹寒泉蘋藻羞有來者那問松楸仰看河漢占斗牛時雨將降雲油油詩書之澤百世流貢士洪德章墓誌銘丁卯貢士洪德章諱巖虎余親友也自號吾圃里人但以字行弱冠拜鄉先生鄭獻翁爲師言呐呐然如不出口而以詞賦鳴世鄉校選塲餘子俱避三舍晚年工五七言詩日鍜月錬妙處入神有小技存藁軒渠集余爲之序外有講藁二巻余賞識之德章大父奕孫自孝義里寧海鎭析居郡右父一之月書季攷婁占魁亞婁音吕左傳牛馬維婁有屋一間介于諸林之側林姓人衆故曰諸林湫隘囂塵闢而新之左右丈尺不可得諸林門戸熱時以氣凌人獨於此老敬其長者曰此丁宋傑僚友迨諸郎競爽林戒兒姪曰隣家子有錚錚異日俱青雲噐爾曹宜折節下之德章果拔解天廻地㳺林冷如灰言諸林昔日熱今日冷也洪升如日仲叔季不幸早世獨德章爲第一流授門徒累束脩買隣地治圃種花澆蔬視簞瓢猶山雌然明明在上百官牛羊亦山雌也闇闇在上簞瓢捽茗亦山雌也士無科目舍學校焉之㑹師閫選諸縣學官人競善地德章退注興化縣教諭囑伯子譍門戸譍音膺當也仍挈仲子坐萬山中朝晡盂飯燒芋咬菜課諸生外翁季唱和人或不知無愠色大徳丙午代者將至衿佩歌餞亦無喜色秋丁後微得滯後疾别歸問醫及門信平聲宿整巾而逝九月十二日巳卯也生於已亥十一月丁亥年六十有八性不憙音喜飲每好飲余飲半談星行婁語余曰某事先生之日尚長渠豈也料徳章命止於斯前娶陳氏其母族也生男珠繼陸氏生男希文女二適林清父林員孫孫恩年甫十四德章在時爲其配卜葬靈川里洪庄澗之原葢四世樂斯丘也二孤卜丁未某月某日奉匶窆余不待孤之請而銘其宰曰宰字見春秋秦伯謂蹇叔曰若爾之闕後之逹縣博士不如前之榮鄉貢郎區區升斗之禄而俾壽之不將伸於彼而屈於此憒憒音聵心亂也不可曉兮彼蒼陟彼岵瞻望父兮痛哉厚夜之長左傳註窀厚穸夜厚夜長夜也稽諸卜筮終然允臧子孫孫子書種綿綿留待墳前桂子之芳夏宣武將軍墓誌銘天運有别合山岳有故新從漢遊者多猛士𨽻秦府者俱將才而籍飛騎歌都護孰無雲起龍驤之思驤舉也若夏宣武盖以豪雋而乘明時而成榮聞者也宣武諱璟字元臣其先自淮入閩占籍于泉帳前總轄隱夫之孫閤門宣贊必勝之子宣武舊忠訓郎殿前司左翼軍統領智足應變勇足御軍功足決勝海雲蒲平章噐愛之河漢改色車書共道帥殷士而侯服篚𤣥黄而臣附是時奔走先後㨗瑞安㨗温陵㨗三陽宣武之力居多觀其所使知在上之徳觀其所主知在下之能平章舉最太史書勲廼刻符印以償優勞宣命下初武德將軍管軍千戸再宣武將軍管軍總管三管軍上千戸散官如故若省都鎮撫福泉興化鎭守又行省累署表也宣武號存齋資厖厚性寛慈持身㢘勤同士甘苦時平固圉養馬也雖憚單騎之嚴明文書省約亦樂將軍之簡易鞍馬餘閑喜延勝彦絃壺娯笑於鄉黨姻舊敬尊已者慈下已者友敵已者一無間言驥踠音宛曲脚鴻墜大德庚子十一月二十一日感㣲恙終于三山治所其生之年戊申九月初六壽五十三娶曾氏繼丁氏男定保丁出以父任賜黄組昭信校尉福州新軍上千戸捧萬戸府檄鎮守興化路娶尤宣慰孫女它姬子觀僧失明應保尚㓜長女歸莊刑部子在次歸陳天賜孫男大順女一定保卜以丙午某月某日奉匶窆晉江楞伽山前期下馬訪余泣曰孤不孝抱陟岵之痛舊嘗執經師門願丐令辭俾光壤樹余憐其言哀諾而銘曰嗚呼宣武奮身右科寵功之典不一猶未脫矢石之勞嗣爵之德至渥宜爾受山河之褒不假之年者天西風噓送於雲蘿克濟其美者子異時積閥於節旄嗚呼宣武死奚可憾䰟即安乎繭窠墓穴也薛君立墓誌銘興化吉了薛自侍御史廷覇給事中元鼎來莆前埭薛南海令之穆又自吉了來穆生一興興生阿小小生君立諱鸞晬而孤母鄭氏携就外家教養嚴教李天隱噐愛之余與君立居相近知相諗音忍告也髫齓音引誦數百言成童命題立就弱冠志鋭塲屋迨至元改物余捕播深宻解后君立號泣旻天吾母未知存否禱之吉余酌以酒别去君立訪母果無恙孝通神明如此戸外事殷征繇趣迫勉受鈔庫使無何以母老辭母喪甫祥又科治賦君立因號鐵耕道人痛念先廬弗忍棄基撒舊起廢堂寢雖安㕔事未完里中子航海遭㓂死君立曰吾舊也讐必復間闗瘴區獲㓂抵罪暑歸發瘡郤醫遂不起病年四十五大德已亥八月二十五日也君立生於某月某日佚蕩有膽畧凡事不與神謀唯决諸心皂白人物無銖兩差葬諸父以禮待親舊以誠雅不憙飲風月佳時觴客少飲而未嘗醉娶彭氏生男二長烏公次白公女學道紫澤觀孫女一烏公卜丙午臘月庚申􅀈柩于常太里滄溪橋西原哭徵銘余猶記天隠酒邊語余君立踰三十福力未可量第恐發之驟享之淺今知天隱之言信哀而予銘銘曰婦持門户勝大丈夫兒肯堂構書曰厥父基厥子乃弗肯堂矧肯構異六尺孤六尺十五歲以下也周禮云國中自七尺以及六十野自六尺以及六十五皆征之韓傳曰國中二十行役則七尺者二十歲也其升降皆以五爲率則六尺者十五歲也隨時聽屈信之運應變無悔吝之虞嗚呼君立有子也夫瞻彼堂坊山川縈紆君立體魄其安之乎詩書苗裔其兹兹乎故通守太學博士介山林公墓銘故介山林公諱㝱協字若山丙辰大對鼇峯陳公某讀公策曰得此士可魁天下參詳官以言太直沮公對人語狀元不做何恨吾母不見吾一第大可恨又八年以太學博士添差建寧府通判又四年冬不候代歸劒守迎公溪鐔飲餞賦詩直聲曾向榻前塼先帝褒加已十年不是主司迷李廌廌爲東坡客坡知貢舉廌下第坡送之詩云過眼終迷日五色只縁通判屬齊賢太祖幸洛齊賢獻十事帝謂曰汝可輔我為相後有司選齊賢下第帝不悦一榜特與京官通判守即鼇峯意猶以前事為公惜便道之福清縣館内子孺人方氏家䟦渉無恙恙毒䖝喜傷人古人草居露宿故相勞問必曰無恙又明年已巳正月感末疾卒累官承議郎年五十四孤陶纍纍返匶説輤説音脱禮説笏説軸輤載柩車盖大夫布士葦席後渴葬甚不及時謂之渴葬過時謂之慢葬化變而嬗句出鵬賦衣冠蕩析壬午臘月丙申始塴于尊賢里秋竹原葬迫陶書來曰先生父執幸賜銘余逋播不暇諾比一再泣告余先君宰木之葉再易蹇叔曰宰上之木拱矣宰冡也不表兹阡陶非孝余退考公氏族三山石井人初從游洋後占籍郡左王大父某成忠郎王父某松門居士父贈宣教郎為儒聞家至公則門益大公七歲失怙家窮約母贈孺人游氏督教有方公不好弄委已從師日手抄夜暗誦少長文宿意新妙年與計偕升辟雍抜胄解魁舍選中進士乙科青霄歩武健者登梯舉足愈髙逺調郢州教授改監京局未上尹漕繼辟幙事殷參決無留不茹不吐居無何除工部架閣文字國子録太學博士凡所薦皆名侍從劵内官職如稼而獲不丐而有郤授員外司馬家食課兒時貴不知有此寄公暨簉音湊倅也㑹府七邑訟累政不能決公譬禍福曉理義兩造交譲冶司綱五年不及補公却例巻捐已俸官吏愧服夏五水漂民民仰存活公白庾臺曰孰重廼開義廪恩貢増額郡欲扞格公護棘圍曰宜寛果得異能朔齋劉公召公被㫖承乏半錢勺酒不支府帑嬴數千緡終更出闗耆宿遮道有百餘人殿後也擁一大旗書徹底清三字留去余每侍飲從頌語公士夫持身如玉湏無㸃涴音宛汚也科第官爵可致欲無慙難公惟無慙故不受涴學有本原矣莆自艾軒老仙去朱晦翁客復齋陳公仰止堂吾道盡付滄洲後翁門人𤓰山潘公來復齋帥里居良士禮東嚮席時西岳顧君立先君德逺號尊足魯兀者無趾踵見仲尼仲尼曰子不謹犯患今來何及兀曰吾惟輕用吾身是以無足今吾來也猶有尊足者存註云尊足刖一足未足以虧其德明夫形骸者逆旅也潘陳二師繼殁公拜西岳西岳又殁公拜先君永矢靡它公需次先君屈公書堂月講先後未三載先君與公下世天乎公本孝友實踐履嚴進退審義利於是八九歲時謂鄉校人人先奪即不肯入客京師時束脩奉母粗糲費外悉歸仲氏伯父囿山公當臺時公以子姪侍書策謁請一不聽内舍積優欠進士級伻報母疾公亟輟試駕湍南下入門不見母哀幾毁將徙月樂王肅云是月禫徙月樂舍期復迫公寧遲遲一詔掌固實時平湖陳公榻前特奏林某道德文章超異流俗公初不知後亦不謝拜學官時北地薄福建子無賢否例罷獨噐賞公公不爲動丐外補時西澗葉公强留少須一除可得美郡公以書生寧不求多對在富沙時西澗登庸同寅勸公問鈞公以一字不入帝城郤彼詭御者貫小人乘疾顛者敗覆車下視公所學所守可以少愧公白而長身安恬和易飲止桮杓偶㣲醺即哦杜詩坡詞上聲高下聲下倨㣲曲句甚曲皆中律同歌者上如抗下如隊倨中矩句中鉤六律合陽聲六同合隂聲律以竹同以銅言助陽宣氣與之同也散語平粹儷語雅則邈有清韻殊嗇厚福陶送死皇皇事生業業大者既識公志必傳陶之子闕女闕於公為孫余追念死友猶記軼事收涕次其語銘曰昔坐齋牎書罷杓音標北斗前四星為魁後三星為杓移夢汝先人對床話私士甲乙伍爾雄衆雌官止别駕見州勿爲後兩大試前言中之建古三刀晉王濬夢懸三刀於梁又益一刀李毅曰明府其臨益州乎果然越爼而尸荘子曰庖人雖不治庖尸祝不越樽爼而代之以占法原數盡化期介山訊予成是邪非越再星終琴鶴歸里一夕館甥老兵假寐聞萬喏聲曰迎福師視之乃公覺相驚異明日而五疾不可諱氣體流通咸陟二巫名觭音畸漢五行志匹馬觭輪致司𨽻何心非醉非寐彼㝠之間疑有是事聰明正直柱國閻羅玉堂給札訣語又何賢如精氣非物焄蒿不騎箕去麟鳳那千萬億年如水行地龍魚去矣科斗蛙子瑣尾相爾耒裔故書盈庋音鬼竟爾緒業吉祥止止重曰夢之占嚮可徵兮蓍之命今如神兮墨筆操牘問所以然兮於卦遇同人之乾兮故梅西先生郭教授墓銘梅西先生魁壘士也漢鮑宣傳魁壘之士士壯貌於夷白鄭鉞異姓兄弟於滄邊號郭廷煒同宗兄弟大徳乙巳秋先生客二兄所走也周旋其間視予猶叔度也先生和余十聲韻歲晩七絶余亦有重約十年又十年之詩别半朞舊對自北來楊伯起家童名阿對舊對取此義過門語余莆新博士又我先生余呼樽喜劇時丙午歳後陬二月也月也無何先生書來它日黨堪一行去秋之約殆天啟之未一月先生凶問至人能料生渠能料死嗚呼先生昔陸子壽再調郡文學掾未上而殁區區尋尺之禄棄如脫屣宰物者亦不與之年命與數也然子壽所以傳不朽者正不計官資之崇庳音婢歳月之修短我先生似之先生舊客授時以方石巖公權爲愛友余爲畏友風日佳時登臨觴詠石巖偕商確理義磋磨平粹唯余訪問氊寒燈青握手軟語四如禮學精邃願叩兩端易與四書僕雖有述然不敢示吾四如遲六七十脫藁就正然否未晩也前於泉山繼於吳江閑居於里閈與守令佐矜佩講畫者皆學問之大端經濟之要務長篇近體樂府散語翰墨餘事耳晩輩以此知我先生淺之爲丈夫也先生之學得於家傳先生之行無一不可以語人者其事母孝生業業死皇皇其待人恕内偲偲外怡怡又余耳目所睹記此先生所以爲先生先生諱堂字德基其世出自光之固始來家長樂芝山曾王父某王父某以文學稱號書厨家父存齋翁某春秋傳論盡掃塵腐登壬辰第終合浦教授先生甫十一歳母夫人林氏力貧教督以至成立甲戌補國子生將積外優貢舉停矣知先生者馮公某張公某商公某趙公某陳公某潘公某賈公某最最者翰林學士雪樓程公某也或輓或推先生淡與泊遭苟焉為貧奚意奔車之上所養者大也初號梅西居士中號息齋末後號六平山人公卿大夫士但以梅西稱以是知先生之心先生以乙巳九月二十九日生今春清明詣張令尹某燕席翊日徧謁親舊歸猶課僕種葵丙夜赴玉樓召李賀夢人告曰天帝白玉樓成請君為記遂卒二月十八也春秋六十二嗚呼先生二丈夫子長履行入書學博士選遽奪所天次鼎女子一適進士陳某先一年夭履下五月二十七丙申奉柩塴于穫嶺原先塋之側不逺伻來徵銘余日以詩哭尚忍銘乎哉然前此余銘先生之母夫人今焉敢辭收涕銘曰嗚呼先生貞不絶俗近於時行危言遜近於知奨士成名近於仁其類有道者歟唯有道而諧乎古故盡道而令其終也固可重為斯文惜惟有子而續其世也又可為斯文幸先生之期其子葢異乎人之期余之期先生之子亦然遂銘先生之窽音欵空也庶人與先生之書而俱傳太孺人林氏墓誌銘莆郡文學掾梅西郭先生名隚之母太孺人林氏以至元癸巳五月六日卒于寓舍年七十七先庚寅冬梅西載道來南僅一蒼頭自隨明年春始迎養太孺人學如舟室如斗糲飯茹薇母子怡如設帨之旦諸生講升堂拜太孺人簡脂澤膚色脂澤勝杯杓闕之㑹不沛公鴻門勝杯杓不類諄諄者暇日佐婦箴即釙字縷課孫吾伊三端午猶酌艾端午節有艾酒詰朝日加午無它恙遽為歸人言初三端午猶飲艾酒而次日即死也梅西授代未能歸室不幸親䘮未即返輤音青䘮車葢貧故之以梅西言語妙天下莆士友孰不愛之而莫助之龜毛成氊坡詩云刮毛龜背上何時得成氊豈不難難梅西號泣語叟曰先君存齋丞蕭山時吾母相其貧不廢禮成其㢘不失義視官禄上下節縮供賔祭餘則置苟簡之田先君晩年懶宦未㡬無禄隚甫年十有一吾母單持督從師嚴脱簮珥致束脩夜對膏火必從旁紉緝達曙不寐歳甲戌隚補國學生吾母喜曰吾今可以見乃翁九京矣天運回旋人世故新吾母戚戚唯恐吾之不顯融盖期以逺者大者不但一博士耳痛哉吾母䘮矣亡矣隚若何酬母之志隚將以是年某月奉匶歸葬于先君穫嶺西之原叟知余者幸與吾母銘以寫余哀吁閨閫常德誌婦人不宜書太孺人教子如軻言太孺人能如孟母三遷之教而成其子如孟軻之賢也有歐陽氏母家訓見瀧岡阡碑表獨不宜書歟莆距長樂倍三舍三十五里為一舍草凍樹枯丹旐淒淒梅西望國望鄉哭如何其嗚呼太孺人諱道靜存齋先生之次妃存齋精春秋學魁辛卯鄉書第壬辰進士官止㢘州教授男隚也孫履鼎孫女一人銘曰閨門恭約得温温家以善積子名聞存齋之書今故存露楸雲塜藏瑶琨相厥夫君利後昆涵暉發祥紛輪囷慶雲歌蕭索輪囷輪囷屈曲盤戾貌壽藏自誌唐御史黃文江滔之十二代孫仲元字善甫辛卯十月廿八日生髙大父兖漕貢進士曾大父必彰大父汝守修職郎父績表德逺為鄉先生晩號獨不懼翁二母俱宋監丞藻之孫沙丞克剛之女余十二喪母然已工舉子業鄉校屢音旅占魁亞壬子理宗純祐十二年紀預計偕太常郡國歳計上最簿詣京所徵之人縣次續食與偕來也報罷與孤山陳端然可山陳文翁中外表刻意讀潘陳二先生書雖不甚解然必窮㫖趣使自得之翁集四書爲近思本録未脫藁余日夕刪補翁有詩曰深爲助我喜敢作譽兒癡王福畤少子勸亦有文常詫韓思彦思彦戯曰君有譽兒癡餘力自韓柳歐曾文外手抄二百四十二家汪龍溪洪景盧題於集後妄意貶剝翁語仲元曰吾兒萬一成立末節必不漏逗音豆留也住也及掇邵堯夫善人吟以四如自號翁又喜曰難難但勿過飲於號斯稱逮聚徒發策吕周元公問行義多大成集所不載翁代季子仲固答且謂非吾兒不能問非老父不能對烏山一見器賞館樵川山殁烏山即方澄孫莆人守樵川余坐家不殖生産事如母繼母也起孝起敬歲輟學職俸及束脩四之三爲菽水歡寄食富沙樗翁三薦達於朔齋劉公余不謁見公語林太博曰此兄當於古君子中求之歲辛未度宗咸淳七年省闈文本心以論策寘第五廷對以直言忤時宰賜同進士出身張鎮孫榜第五甲四十有一矣調監瑞安府比較務需次食貧如心貽書常齋俾就二劉祠堂一月兩講為學者師董之者後坡劉求志也癸酉捧檄考類試歸過鐔津古崖江公留郡齋古崖先生萬頃也時守劎州即古心先生萬里之弟載之滙江席未温古心先生買舟速余芝山將及期告假省親抵里門十日鄙被兵龍顛虎倒余幸苟活時甲戌臘月也乙亥徳祐改元年也冬之官守相陳山泉虚經博士席相處不就屈余入幙有强民挾貴不禮税官者有頑佃廿載不納主租者有妄首富家造麯者一見剖決泉喜得人無何泉罷以書别余君來我去彼此無福丙子春端明陸君實秀夫至自平江偶同邸一交臂再三褒歎古雅可敬待如子姓飲食必俱入夜炙燭對酌劇談曙動共飯廼出及聞杭䧟挑包辭歸既資送余又留行槖夏五趣余行都充益王府撰述官兼處置使司幹辦公事又改刑工部架閣改刑工部乃端宗即位改元景炎時也以通直郎陞武學諭不兼旬得五京剡處置使楊公刑侍應公祭酒許公少傅張公一實翁也遂轉朝奉郎國子監簿兼福建路招捕使司都叅議官雖荷已知竊天寵然未嘗供一日職升斗不批劵歴斯時何時榖而耻也實齋拜樞使猶命撫諭使毛公邀余同舟將有異除余力以母老辭及聞公全家投海余哭公詩人皆傳已死僕尚愛其生公忠義終古不朽而余猶為人猗古崖於余異姓兄弟有四如吟最簡古實翁於余異姓父子題種讀詩極理致卓樂山以易解囑余敘篇端未七日而樂山亦以兵死末着渠不可料如此余當潮汐洶湧之衝嘗著檮杌集識此邦之仕於朝者與士而求仕及他州士夫仕於此邦者不敢出客丁丑屠城之變丁丑景炎二年也此集與前後告身無存言之如夢然老身自甲戍冬混迹大化阽音炎死者數客芝山而免客瑞安而免客䂬溪王洋而免客環泉而免可謂不幸之大幸非宰物者孰相之尺絲寸縷不留著身又孰念之家世清白石田茅屋二親殁後余不與叔季分財東西南北又不殖生産家道敝又敝矣余三十方娶斗軒先生丁南一之女斗軒懐安尉左廂人辛巳歳以同産弟仲㑹之子子材為嗣余命屬水於五行欠水人世趍新余以四字從水䖍卜先君拈得淵字北山方公為字天叟改號韻鄉水生木故子材名梓余舊旅食它州即傾囊買異書歸干戈横放盜竊兵燬雖欲讀無可借所著學記農談欠改春秋説止閔公欠續他散雜寸片亦未上藁盖無暇披揀亦無傭書者嘗夢感麟翁遺余雙筆志欲修史而未果大槩見於夢筆記矣一生不能歌樂府詩亦不甚工嘗自以四端差欠智六極占居貧一聨爲得句暮年雪鬂書案黏音粘黐音梨黏相黏著也黐亦是黏戸外事不到耳間有聽談經者大抵如越人之視章甫宋人資章甫而適諸越越人㫁髮文身無所用之出莊子道世交䘮繕性篇云道與世交相喪也殊亦可歎孫疇祖名燾字喬年光祖名熈字昌年義又取木生火也女孫名應娘皆子材婦林氏出林癸卯秋中蚤世仰事俯育子材殊亦難難子材於乙巳臘月為余營一貉之丘於篠塘原余甚樂焉殆天作地藏吾祖留以遺余犬馬之齒行耄及矣書債未了俛焉孳孳萬一應盡便盡應盡便盡二語出陶集何憂何懼昭武在軒黄公紹嘗許余文艾夜之太白殘年之巻施子材異時當為余彚稡音卒遺文以成余志子材課兩兒郎讀本分書毋差塗轍得壽斯文一脉以昌我后之人此則老夫區區願望不然目不暝於九京大徳十禩大德元成宗年號丙午立春第三日四如老叟自誌四如集巻四四如集拾遺
