front:
  text: 封畛
  hash: sha256:90eb649704abb648f66741759d586f2cbb44475505e666015dd271fc9b007159
body:
  text: 演迤扶將勿替有引學稼軒記癸未六月哉生魄天叟記學稼軒何以記記為傅君德陽作也德陽者何心田翁景周之子也不名而字之何前進士也以學稼名軒何稼農事士學之志常業也昔之民無不農之士後之民皆不士之農故九井廢四民分農之子常為農士之子常為士農農而已冀缺擕儷冀邑名缺人名卻其姓也沮溺結耦雖農不農問稼於士哆然而對哆音咤大口貎吾食舊德非服先疇士士而已此格物之學所以不明也農夫以百畝不易為憂君子以一物不知為羞不必種粟而後食也神農二十篇宰氏十七篇亦不必談與不必耒耜吾家操也丈夫二犂童五尺一犂亦不必問與稼者稼也有生之義稼之地某宜一易某宜再易某宜三種某宜五種中地一易休一歲乃復種下地再易休二歲乃復種不易美地稼之名某種當早某種當晚某熟最先某熟最後稼之噐曷為錢鏄曷為􅀈苃曷為槍刈曷為椎銍錢鎛田噐詩痔乃錢鎛鎛音博苃音撥椎木棒銍穫禾短鎌稼之政曷用人耦曷用牛耦此二句言耕曷用貆麋曷用羊豕貆音桓貉子此二句言糞止水以何寫水以何周禮稻人掌稼下地以防止水以澮寫水坊堤也先雨何待時雨何挾先雨耘耨以待時雨時雨既至挾其槍刈耨鎛以從事田野出管子周禮云聽師田以簡稽註云簡閱也稽計也又當稼事所當簡稽也有為國卿者於苖曰少也眴眴乎眴音絢目動何其孺子壯也莊莊乎何其士成也由由乎何其君子有為王子者於田曰深耕穊種穊音槩立苖欲疏非其種者鉏而去之此漢朱虛侯酒令之詞士何事曷不尚論古之人于耜納禾三之日于耜十月納禾稼其始播百榖皆豳風詩始播百榖與豳父老為周旋人卒焉起焉作勞無一日休句斾斾穟穟幪幪唪唪音捧模寫稷躬稼時物物景狀後老師耆儒塗易一字不得二詩者非周公決不能作此等趣味千載下何人獨解平疇交逺風良苖亦懐新領此惟一元亮冬菁飯之半牛力晩來新識此惟一子美東臯下潠官張杜曲此四地稼所也或視穫或補畦﨑嶇徃來奚空自苦亦曰士而未仕則耕仕巳又耕常也今章逢者以首苧蒲身襏襫為恥苧蒲草笠襏襫蓑衣管子云首載苧蒲身服襏襫此之為農山林者以載嬪息服疆畝為名嬪婦也出嬪于虞息子也有賤息弱息不倡書中有粟之髙談書中自有千鍾粟真宗勸學歌則出豆落為萁之怨語種一頃豆落而為萁漢楊惲失位怨望詩回視陶杜孰真孰偽徳陽仕而巳者也俯不恥細民之賤前不慕退士之名有溪可榜進船也音謗有田可饘既耕且種還讀我書如讀山海經時在家早起憂國願豐又如詠吾宗孫子時信居寵之虚榮不如為農之可樂雖然井飲田食出作入息農曰稼士曰學百畝五畝以事父兄農曰稼士曰學耕野皆堯舜之道農桑即王道之始百姓日用由之而不知仁者見之謂之仁智者見之謂之智陶杜可謂知稼穡之興語學未到周公地位古今無兩周公德陽願學者何年年秔熟約叟重客往來阡陌尋浣花子美溪酌彭澤陶令酒相與歌風雅於碑山之南使田更夫也野叟擊壤羣和曰吾儕小人亦學稼者而有此樂乎不也豈不為山中清話叟為何黄姓淵名自號韻鄉老居士半山精舎記癸酉歲莆邑昉起學宮博士張君肖季實來丙子冬學宫成時樞相宣閫如心陳公以博士名聞于朝已改舎入宫矣居無何莆更兵燬余館外弟宇下距環泉環泉地名尺有咫後三年庚辰春博士寓環泉之南過存相勞苦夜闌語軟時或酬倡余貧到骨博士父子不相聊少日蹙頞相告吾違父母國有年昔昔舄吟昔夜也越人莊舄仕楚而病思吟則越聲列子云精神荒散昔昔夢為國君秋半戒途無以實槖小人有闔廬曰半山精舎願徵子文輝潤捲樞余囅音展曰子謂吾文其與可竹文同字與可善畫竹四方求者足相踵廷珪墨李廷珪墨能削木墜水經月不壊與迂何甚後五月又相促廹予廼更端而問曷名乎半山博士曰昔王文公築第白下門外為道之中後捨報寜人以半山名寺文公子雱死公坐鍾山恍惚見雱荷枷杻如重囚遂施所居半山園宅為寺以薦福黄太史遂稱公為半山老人吾精舎在莒溪山半因用其名名之非慕此老也然則孰名之曰杜公康侯名之且大書然則靣勢何鄉曰一水䕶田將緑遶兩山排闥送青來然則經營何始斷手何年斷手字晉魏以來之語凡營造了當言斷手者矣杜工部題江外草堂詩云經營上元始斷手寳應年曰先君子庀具也徒於甲午落祭於乙未歲丙午漂於水唯棟扁坋汙泥淤中濯溉如新殆若隂相遺我後人又四月巳酉六月誅茅編竹苟完一區吾精舎雖不加闢成先志也然則精舎之名昉于何時曰漢仲承劉仲承也明五經隠居立精舎講教數百人辟並不就文有檀敷也家貧而志清舉孝廉不就立精舎教授逺方至者常數百人子良包咸也習魯詩論語住東海立講舎教授諸儒以之講授句絶蜀元直徐庶也庶少好俠後感激折節學問詣精舎聽習經業義理精熟以之聽習句絶魏譙東魏曹操也讀書精舎宋石壁謝靈運也石壁靈運精舎有詩云出谷日尚早入舟暘已㣲武帝立精舎於内殿引沙門居之以之讀書句絶逮晉武帝奉佛引沙門内殿名義胥失之句吾精舎書室也非緇廬也緇廬僧寺也出唐李庾西都賦有田可耕有池可魚莆雖信美然非吾土擕書歸隠不失故吾則走也幸余蹴然曰莒山之半甲午以前樵夫野老之所同有甲午以後巖處竒士之所獨擅端平距淳祐甲午㡬何時而此舎巳荒田野草丙午距巳酉又㡬何時而荒田野草又為幽人之廬巳酉距庚辰又㡬何時間闗濡滯在天一握一握小貎孤雲兩角山名在天一握安知伊威不在室蠨蛸不在户也伊威䑕婦也蠨蛸小蜘蛛也户無人則有之博士於癸卯壬子兩隨計吏俱試奉常屈戊辰叨恩僅授縣師家食六載方告戌期何分寸之難躋攀宦莆終更終更今考滿也段㑹宗終更而還遄脱選調寵晉兩階又何朝適而昔夜也至突未黔事乃大謬不然盎無儲米嚢慳一錢栖栖萬狀又何頭方命薄舉翮觸四隅使瞽者揣聽又未知博士相法當何如隂陽儲與千變萬紾曷為從類曷為居方索之不得求之招揺之下然昔人觀園囿之興廢知洛陽之盛衰李文叔書洛陽名園記博士行歸故都視城郭而猶如故蒼生而各環堵豈惟為平泉李德裕平泉莊周回十里一樹一石喜過比隣訪故舊或各隔異方或無家可問晨烟夕露莽蒼㓕没使人意象惘然甫也草堂杜子美草堂在成都城外亦無顔色豈有感也夫然予聞管仲父曰定心在中耳目聰明四支堅固可以為精舎博士春秋髙精力完無一㸃老人衰憊氣夀猶方將未巳不知返子之舍種𤓰采蕨穿花藉草尚憶吾天叟否秦東陵侯邵平秦破種𤓰長安城東張翰曰吾采南山蕨飲三江水足矣天叟名淵姓黄自號韻鄉博士樵之挐川人名靖夫李出也為處士夢庚叔建後句可謂能為之子矣因記而授之歸且與莒山結縁庶他日不作生客子由作栖賢堂記云僕為書之且欲與廬山結縁他日入山不作生客葯房記房書室也命以葯何葯白芷也淮南子秋葯披風喻芳㓗也正則屈原名見離騷九歌謂芷為葯芷楚草也一名白茝一名澤芬蜀與楚接壤而蜀産尤多然草之芳潔者何限而獨取於葯者又喻檢束約敇之義此公所以葯命房也公意若曰天地間陽為君子隂為小人君子者禮義束其心廉恥敕其躬故明光俊偉正大洞達烺烺炳炳如青天白日磊磊落落如髙山大川師師儀儀如瑞麟祥鳯嚴光李泌輩抱道懐德無營當世使人油油翼翼歆慕不已千載下芬猶未沫與小人肆而無忌憚頑而無羞惡溺深壊速然後泄泄沓沓甚虺蝪蜩螗之幽隂虺蝎毒惡蜩螗聲惡幡幡音畨輕也捷捷貪槿花石灰之榮利子雲允南伯玉諸人谷永亦字子雲譙周字允南說後主降魏陳子昻字伯玉上周授命頌以媚悦武后糞壤同腐識者為之喙唾胷嘔矣猶喙之吐唾胷之嘔逆也人之為人而不别芳臭不辯清濁可與不音否也以公之識趣如此則公之律身可知巳公孝友如密李密信義如忳王忳誠直如輔孔道輔非但以政事文學表表自見於世者襟懐光霽無一㸃宿生葷酒而又沃以經傳芳潤故處樂如處約人不得以是顛倒之乾坤回互岷峨愴悽浮家江南澼絖之封莊子曰宋人洴澼絖善為不龜手之藥者客買其方百金以説呉王大敗越兵呉裂地而封之支離之粟莊子曰支離之卒受三鍾之粟猶得全其天年苟活其孥而公嚼蒚音力麻飡苻蘺不改度也蒚麻苻蘺芷之别名應葯字天外飛鴻偶留方壺方壺莆為八壺之方也回首白雲浩然謝事昔人以官滿譬熱行得清凉舘况脫冠佩訪林泉顧平生無一可恨者豈不菲菲兮其彌章龜鶴翁史祐陵目為八葉龜鶴翁史祐陵皆蜀人公親擢乙科見可翁史坡老以師事之蜀非無賢士大夫要非其極也公以學齋之嫡超詣諸老之右萬巻遶坐不知年數於其將行賦長短句一笻雙履吃了離支歸去離支即荔支司馬相如上林賦云答還離支白居易荔支圖序曰若離本支一日而色變二日而香變三日而味變四五日外色香味主盡去矣記之言本於此然而離支不如葯也離支三日則色香味俱變芷未嘗變而不芳也僕斂衽清芬有年矣因記葯房以為公别公采馨香以遺所思否公名某少中大夫前興化路總管僕則莆四如居士黄淵也年月日大德閼逢甲也執徐辰也歲白露節旦居安堂記居安者吾友居之所居之堂之名也居之鐵庵先生之世也承先緒如捧盈視浮榮不滿睫宜狐黄而緼袍敗絮宜膏粱而脫粟寒葅以是為居安乎居之曰貴者仞軒冕為素有不知包周身之防吾就吾閑居庶乎安富者謂金玉可長守不知非無賄之患吾散吾積居庶乎安世故憂患來如疾風甚雨在彼者常漂揺在我者常靜以俟其定時乎擕琴觴問松菊燕喜夀母樂爾妻孥此一安也時乎駕長舸並驚瀾與漁爭隈延縁葦間此又一安也時乎巾履徜徉對彌明聨句進士陳師服校書郎侯喜與衡山道士軒轅彌明指鑪中石鼎聨句採松煑瀑解腰共飯此又一安也時乎蒲團曲几共逺公入社逺師結蓮社修淨招淵明明曰許飲即往逺許之遂造焉勉令入社陶攅眉而去青山白雲開遮自在此又一安也萬事隨縁是安樂法客共曰然雖若此險易之相尋也聚散之無定也幽賞之未能遂其極也心思之不可囿而滯也尚有大方之家數仞之墻長髙深廣平濶無閡音礙藏修時教時必有正業息遊息逰時必冇居學惟意所適是中固非坐馳所能止止不止於當不㑹於極此為以應坐之日而馳騖不息謂之坐馳止止集也亦豈視為蘧廬者所能托宿蘧廬猶傳舎止可一宿而不可久處肯堂肯構嗣前人功出門入見大賔入虛如有人敬常勝怠志常帥氣我常為主物常為客則安居也廣宅也余敢以是為居之勉易曰君子所居而安者易之序也孟子曰君子深造之以道欲其自得之也自得之則居之安君子一也由易而進孟子之天居之安者渾然之本所居而安者粲然之用由孟子而進易之地居之安者至之之事所居而安者終之之事非所居而安奚居之安惟居之安故所居而安富貴行乎富貴貧賤行乎貧賤患難行乎患難斯謂居易以俟命為子止孝為臣主忠然後東西南北不擇地而安予敢以是為居之勉雖若此相與居由乎詩書之府安處乎道德之奥豈可無孟獻子之友哉孟獻子有友五人皆無孟獻子之家者也必得無獻子之家者而與之友則仁者助守義者助行智者助謀勇者助決使閒居不為不善宴安不懐耽毒又使賢子弟日見所未見聞所未聞來者弗納於邪庻㡬稱斯堂之名之義余敢以是為居之勉雖若此時運之盛巳隔天外文獻之遺猶在眼邊于斯時也四月維夏六月徂暑秋日凄凄冬日烈烈升斯堂也思昔之遺我以安者今如之何燕燕居息勿替引之也其為感詠深矣何如居之曰願識斯語以俟他日居之名廣翁予則四如居士黄善甫年月日則巳卯丁丑小孤山記天叟知命之年外兄孤山處士記余韻鄉授使者曰為我語天叟以孤山記見還諾之宿明年夏五孤山又自以記來風月花鳥松篁泉石一一在眼擕孫課詩對客論文二三社翁乞火煑茗如畵入圖想吾孤山杖屨相羊徜徉其間豈復更知有塵事抑前此日舒風薰居雖尋常之室食雖苟簡之田老子曰食於苟簡之田苟簡易養也註云且從其間故易養古梅横前老栢樹後雲谷春亭或釣或弋或琴或歌或同鷄豚韓愈云願為同社人鷄豚宴春秋或持杯螯車螯海蛤畢卓云左手持蟹螯右手持酒杯睥睨天壤評裁古今籍有問予何事栖碧山笑而不答心自閒二句李白詩吾孤山不失為幽人之貞龍蛇起陸天地反覆貴豈不仁視汝蓬蒿跼髙脊厚猶恐鎮厭音壓濺淚驚心何可賞識孤雲縱海都無定出個青山入個山吾孤山雖有此不樂也今水雲黒白霜樹青紅此和靖孤山景物之嘉吾孤山之景物猶前也吟中看山睡起引鶴孤山閑靜之趣吾孤山之閒靜猶前也疎影横斜暗香浮動孤山詠梅之清淡也吾孤山之清淡猶前也非秦甲子有晉春秋孤山著述之語吾孤山之文之學又猶前也山叟寄藥野僧留詩孤山約客之詩吾孤山之友之客又猶前也所居無古杭西湖之勝吾孤山獨甘陳舊也槁枯也之味其世非景徳真宗天聖仁宗之舊吾孤山獨成嘯傲之趣和靖當景德天聖季孤山古杭西湖間有林處士墓在闕在處文炳㓜女殤祔墓士東於此可以言有道矣和靖千載人後來者未能或之雙吾孤山與之並行清亦清乎哉高亦高乎哉雖然前孤山易後孤山難心事數莖白髮生涯一片青山二句林和靖詩焉知此樂不自苦中間來乎俗人不知吾孤山者叟知吾孤山者造廬有約當分孤山一半張乖崖見陳希夷請分華山一半對兄劇談且以記往記到童子放鶴林逋常泛西湖有客至逋所童子延客坐開籠縱鶴良久逋掉小船歸俟孤山歸刻之石上曰黄淵作一粟窩記大化起伏隂陽錯置此二句冐下分二股人民草木澌凘泯泯而農不廢一股天下學士逃難解散而書不廢一股隘巷平林稷獨成人千載下為田家師此叚應農不廢意始皇斧六國肉老伏生竇氏抱遺經倚巖穴秦焚書至漢文求書時惟濟南伏生老不能行口授晁錯二十八篇又河内女子得泰誓一篇獻之山堂漢一再傳猶活此叚應書不廢意廼知人生定分不應餓死溝壑死兵革者天與人俱不能殺而憂患風雨窮通寒暑正農者之時也此總約上二意而末歸之農以農兼書言也進士方君芳年華月坎􅇄音覽於時屋隘如囷書富如京磨丹漬墨日田其間暇日語余秦菁曰種一粟而千萬之粟滋吾以命吾書窩庻生意兮方將四如居士幸印可居士曰一粒之粟道何從來生於寅壯於午老於戌其蓄而弱也欲相與俱其熟也欲相與扶堅好頴栗然後刈之盈手舂揄簸蹂然後米而藏之可易易得乎此應首叚言農聖而少壯老堅如仲尼十有五至於七十猶非一朝一夕之故夫人焉可須㬰不學此應首叚言書深耕熟耰穰穰在秋寒之落矣然而有稷有黍有稻有秬農視其穫先視其播此言農人莫不讀書六經歟五榖也諸子百家歟稊稗也此言書末專言讀書世有一輩人漫不省立身行巳大丈夫事日出小技驕穉朋儕文章滄海一粟爾焉能名世此非讀書者又有一輩人好利惡衰厭苦逐樂色色墮無名種子中虛名浮利世界一粟耳何足介意皆非讀書者此亦非讀書者故結曰皆非讀書者吾家山谷嘗云吾輩但勿令書種斷絕若夫成功則天居士試著轉語看下何種百丈和尚作一頌頌此三轉語又云請和尚代一轉語某曰此真一粟窩記大歲巳卯土正月丙寅火十六甲子金書于種讀所劉氏厚堂記劉氏厚堂成有年矣歲壬午吉月之陽朔吾友有實始來謁記韻鄉老人黄淵曰古文厚為垕字從土宇宙間最厚者莫如土故居中宫而生百昌古尚書説呂氏春秋以土為心心官天地府萬物故厚前千載巳往後千載未來人所傳者心耳世之論人子孫嘗推本其父祖曰世德之積也書澤之深也説厚字以世德之積書澤之深作骨下以傳人敷演二意此一篇大㫖余謂父祖之有子孫不過傳身子孫之肖父祖斯謂傳人傳身者一氣而屬同體而夀傳人則心之廣大實似之父祖猶夏屋有傳人則後弗棄基父祖猶喬木有傳人則枝葉類本根忠信孝悌皆為世德後之人亦必行忠言信入孝出弟以培其厚否則陵矣仁義禮樂皆為書澤後之人亦必率仁由義立禮成樂以養其厚否則不肖矣雖然傳人難事也伊之後一陟吕之後一伋曾之後惟參與西孟之後惟軻上而世德之厚莫厚於周公其從來非一朝一夕伯禽君陳於書僖公於詩差强人意大而書澤之厚莫厚於孔聖廟食㡬二千年鯉也詩禮伋也中庸次則安國也頴逹也傳疏間代迺始一見俗日下無西周之文獻道日喪無洙泗之淵源傳人抑又難難建慶隆貴時萬石君尚無恙未再傳而孝謹衰慶為相時子孫為小吏至二千石者十三人慶死後稍以罪去孝謹衰矣太丘聲譽如雷公慙卿卿慙長實子紀為大鴻臚紀子羣為魏司空天下以為公慙云云位益髙名益下德渥於前而薄於後也韋孟至賢一經始振鄒魯少子為相殊又不及廼翁韋孟作詩諷諫楚王戊自孟五世至賢賢號鄒魯大儒後為丞相致仕少子𤣥成歴位至丞相守正持重不及賢河汾家世畤傳中説勃名文章成就堇堇音謹耳耳學於昔者未深而今尤淺也人又有言傳人非難天分良難便儇皎厲非進道之資碩大且儼斯載道之具望之太山喬岳必廊廟人聽之黄鍾無閒必禮樂噐吾多之應載道之具句言厚濯濯春柳類美少年飄飄遊雲類淺丈夫吾劣諸應非進道之資句言不厚昔退之叙北平王三世鸞鵠之停峙視龍虎之傑魁蘭芽之茁秀視竹梧之翠碧人物已有次第書澤世德又不與焉余曰此目論非以心論德勝氣雖言呐不出口而稱為長者學變質雖容貌不能動人而人不敢輕其書色厲内荏者無德以將外澤内麄者無學以充資禀政不足恃也此又以德與學再進一歩說劉名家福門有實雅子聞孫前徽未沬音昧㣲晦也手澤猶存然德難嗣也細不矜大之累惟四端可以廣心書難繼也術少差學之偏惟六經可以養心兩漢而下不足學孔周而上不易學此二叚又特立議論道味自别余願有實之滋世德近如韓門之持國范氏之淳夫馬家之公休然後謂之傳人又願有實之衍書澤近如吏部朱松之文公松子元晦太史吕本中之成公中子祖謙謚成忠獻張浚之宣公浚子栻然後謂之傳人誰謂華山名髙企其齊而且詔子孫孫子無斁有實名梅翁北山先生嘗目之為良壻云委成齋記天叟記厚堂之明年有實更名希夷且命其息游之室曰委成齋齋一榻旦盥靧音悔即書所謂頮靣已爐熏燕坐徐呻佔音覘畢呻吟視簡謂之畢吟誦所視簡之文見學記少倦假寐覺又繙架上之書矣繙繙帑亂取孔子西藏書周室往見聃聃不許繙十二經以説性淡泊未免與世濶踈客去亦睡客來亦睡知者不以為簡時升沉所以巻舒由我是非一切斷絶日夢遊乎無何知者不以為放叟曰委成二言於書奚自於義何居委和委順宋人子休外篇語也子休莊子也書有内外篇委和委順乃外篇知北遊中語郭子𤣥曰明委結而自成耳成𤣥英曰天地隂陽結聚和順之氣成汝身形性命委成之名昉此乎人身藐然與天地通乾坤吾體坎離吾用坎精離氣坎泉離火以神運精與氣自然凝成内丹後漢伯陽故借爻象納甲之法以寓行持進退之候委成之義昉乎此莊北遊云身是天地之委形生是天地之委和性命是天地之委順子孫是天地之委蛻魏伯陽作叅同契二巻其說似解周易其實論作丹之意有實曰唐儒孔氏疏儒行記以委訓聚近世賈氏羣經音辯以委訓隨聚一義也隨又一義也宇宙中間成者自成果孰為之又孰使之天地有時傾䧟山川有時震墜日星有時隕蝕蒼狗浮雲浮雲如白衣斯湏變蒼狗滄海桑田古有此事氣運有泰有否世事有險有易人境有逆有順前侯後𤓰蕭何傳邵平者故秦東陵侯秦滅為布衣貧種𤓰長安城東朝畊暮相寗戚飯牛扣歌牛角桓公聞之舉以為相又有此事詳言之萬事萬理隨其自然約言之强曰委成吾之委成意而子之乗成意而子賢士也乗成乗可成之道冉相氏之隨成也冉相氏得其環中以隨成其註云古聖王居空以隨物物自成叟又曰隨其自然為天理行其自然為人事天理通徹人事棄置以栩栩然為夢栩栩喜貌蘧蘧然為覺蘧有形貌吾謂汝夢亦夢汝覺亦覺有實曰無視無聽抱神以靜所以正形無勞爾形無揺爾精所以長生此六句廣成子之言出在宥篇無視三句言忘視聽而自見聞則神不擾而形不邪無勞三句言任其自動故閒靜不夭廣成子之卧非卧也卧時工夫起時受用吾之委成如廣成子然後可以言天叟又曰子舎伯陽而學子休乎有實曰學伯陽而不成則不運吾身自然之水火而術流於幻妄學子休而不成則不達吾生自然之性命而談入於𤣥空亦非也吾全吾真吾養吾氣在我者存其自然在彼者隨其自然不必學伯陽不必學子休但學希夷先生斯可矣雜家小說多謂先生睡或半載數月近亦不止月餘不知真人無夢至人無睡東方未晞顛倒裳衣不容不欹枕看兒戯耳叟亟揺手慎勿多言且打一覺睡扺别人三覺睡讀書堂記堂以讀書名何吾宗春臺居士至樂之所也堂祠文公朱氏讀書二字公墨蹟也春之韶夏之薫冬之餘居士課子若孫各治一經非城南燈火之陋韓文公送符讀書城南有燈火稍可親之句有彭澤種讀之閒陶淵明讀山海經詩云既耕亦巳種時還讀我書異流俗矣雖然讀書二言昉於何昉乎魯論書何書文籍既生以來豈無書乎唯詩書禮樂易春秋耕桑之文所謂布帛之文粟菽之味者也行世杲杲人誰不讀所讀者又何秦焚項炬漢儒補葺樂竟亡傳他非全書傳註固不可無然亦難以盡信書存孔孔安國傳書五十八篇謂之古文尚書蔡氏曰今文多艱澁古文反平易禮守鄭漢末鄭𤣥傳小戴之學後以古經校之取其於義長者作注為鄭氏學易宗輔嗣王輔嗣註易上下經著易論五篇詩主毛鄭趙人毛萇善詩作古訓傳是為毛詩漢鄭𤣥註毛詩箋謂毛詩鄭箋春秋惟優左杜左丘明為春秋傳三十巻晉杜預為經傳集解發明甚多古今稱之抵牾半矣䜟緯雜之騖髙逺者欲徑造不屑讀安卑近者止記誦苟焉讀穿穴新竒者讀之僻勦說雷同者讀之雜皆非也我思古人尚友千載魯中叟由志于學至不踰矩或十五或十年自覺其進而人不知顔氏子初仰鑚瞻忽中博文約禮終欲罷不能曾之至善自格知正心誠意始思之明誠自學問思辯篤行入孟之聞知自居安資深逢原來言言六經句句六經後乎此文公集周邵程張之大成者也詩傳凡㡬折衷本義最為簡要經傳通解巻猶未完書止三篇與皇極辯春秋不敢直下注脚於四書用功良多雖暮年猶屢刪改惟山林之日長故學問之功深斯文之宰主也止有斯人居士喜讀文公書者然當循序致精居敬持志因文公師賢聖因賢聖師六經虛心􅉼泳廼得自趣之妙切已省察庻不當仁之讓書特陳迹耳雖然天下未有無用之體亦未有無體之用講道撫世元非兩事朞月之可孔今時之易孟聖賢正患不用用則臯䕫稷契伊傅周召擊壤云邵堯夫詩集欲為天下屠龍手肯讀人間非聖書居士其印可余言余即記文峯書堂者於居士為同姓伯仲遂筆而授之俾刻于堂之左還笏樓記前民曹省吾葉君書樓藏諸峯間以還笏扁徵余記一再余曰環樓皆山獨名笏何省吾曰笏山起於東南環内而靣斯樓也矗矗又山之傑然者古字假借環還通用音亦相通故名余曰笏君家故物也取義於還猶還氊之義與雖然古者以適公所執笏書思對命備遺忘也大夫魚須士竹象魚須竹象皆笏名本制有等差按笏長二尺六寸中博三寸天子以球玉諸侯以象大夫以魚班飾竹士竹木豈以此為龍光哉龍訓寵龍光出小雅蓼蕭篇為龍為光玩此記文意只言古制大夫士笏有等差以為臣下之寵光下之世嵗時家宴積笏榻上唐崔琳每嵗家宴以一榻置笏重積其上臣主問答亦曰笏今甘棠猶謂此家寶也唐魏徴五世孫謩對文宗曰維故笏在帝曰此笏乃今之甘棠也為子若孫而知寶之則知得之難而守之又難策天子廷中進士第然後賜笏通籍陞朝銀緋金紫然後以象易槐得之難如段秀實朱泚欲僣位段秀實以象笏擊泚流血被靣如顧少連裴延齡方横少連曰秀實笏擊賊臣吾笏擊奸臣如孔道輔道輔為寜州推官真武像有蛇穿其前郡將帥其屬奠拜之道輔揚笏碎蛇首然後無負此笏不者倒持手板汗流沾衣桓温將移晉室王坦之欲於座害之坦之倒持手板豈不有辱此笏信夫守之難難或曰還笏有故實乎曰昔有諫立昭儀叩頭還笏丐歸田里帝欲立武昭儀褚遂良諌不納置笏殿前曰還陛下笏芳名姱音誇好也節焜燿史冊守之矣若但以昔之得兾今之還此特淺淺者誇詡庸孺耳一時富貴如槿如灰光禹孔光張禹軰不為三公邪省吾名崧甫文昌東石公之嗣東石之學之行之節鄉前修尚能言之正不以奮髙科登禁從為此笏榮也省吾學聖人學久處約而不移長處樂而不滛亦不在笏之還未還也余語省吾酌酒祝此山曰山亦有知日當料理又酌酒祝此笏曰笏如有知勃然而起是為還笏樓記年月則大德丁未孟陬正月音諏余名淵字天叟自號四如老人七十七醉作此筆孝節郭公祠堂記天下前代名人遺跡不得毁折此至元十三年間令甲也行臺楊監察某過莆廉訪商副使某案部俱諉博士郭廷偉重建廼祖孝子坊祠此大德元禩年也孟冬二公所教屬也人世有新故民彛無今昔孝之原情性闗風俗如此聖上之宅天衷位人極以此君倡臣和氣感機應興化厲賢鑠乎盛哉昔孝節公之葬母夫人而廬于墓也亦曰母之於子也常裕子之於母也裕猶不裕子貢心喪其師冢傍築室尚未忍離况母喪未期乎瑞露降慈烏馴明神知之殊類知之公不知也若國子生若邑大夫若守帥悉以氏名送官朝省知之公不知也公以大學生客于錢塘聞母喪徒跣奔歸一慟輙嘔血聚土為墳廬其旁甘露降于墓上烏鵲馴集紹興十三年郡上其事表其門閭表門閭傳國史復其身及子孫天子知之史官知之公不知也是心何來事亡若存誠至慮一唯知有母耳今博士君之敬其五世祖也亦曰自髙以上服簡情踈此陋儒耳目之學人而忘本非薄則誣小戴禮云顯揚先祖所以崇孝况知而不傳居子所恥乎廼白府縣而禁經踰相翔按周禮修閭氏有禁徑踰者註云行不由正路此經字盖徑字之誤也廼謀族尊而計徒庸功程陶埴桷楹陶作瓦噐埴粘土陶人埏埴以為噐桷椽也楹柱也扣囊共平聲事廢者興而華表矗如舊者新而堂宇翬如像嚴貌古典刑如昨舟行者弭擢輿行者憑式游者觀者皆顯者來下馬題詠鄉役於丁酉冬祭落於戊戍春宫室始成祭之曰落又募司鑰者而屋之而榖之榖我妄榖俾勿壊是心亦非外至氣體之流通學問之肫切自然而然也噫嘻孝節公之祠初不待記而顯然德輶如毛民鮮克舉如先生者後絶嗣前無鄰子孫而不論撰先世之美何以朂後之人博士君之名亦豈待記而重然精神氣貌議論風指有光慶胄家庭愉恱洞洞屬屬前乎此迫從王事祗畏簡書朝望夕思與雲俱至昉乎此有薦於朝辭牒歸養此豈慕人爵以為親榮哉昔齊聘曾子輿為卿而不就曰吾父老句食人之禄則憂人之事吾不忍逺親而為人役子輿所以為孝博士君之學子輿之學者如之何不書四如翁黄淵於是喜為公記且羡公之有聞孫也公諱義重字處仁行義年則鄉先達艾軒老筆炯炯此不書博士字景文滄邉其號前甲戍進士兩任清漳儒學教授堂顔則儒學提舉呉濤書年月日則辛丑孟春初吉仙遊縣學尊道堂記莆邑三仙遊為壯邑舊廟學直縣南百歩許學有尊道堂世變風移講肆馬隊周續之與學生講禮加以讐校所住公廨近於馬隊過者唶唶至元丙戍邑長官雖搆禮殿於講堂猶未皇也大德壬寅秋文學掾方平釋菜云初鄭註云釋菜禮輕也惟釋蘋藻而已無牲牢幣帛凡始立學釋奠先聖先師及行事必以幣正義云天子出征反釋奠于學以訊馘告注云釋菜奠帛禮先師也職思其憂亟謁之郡府佐孟某幕掾孔某檄縣起廢慮材計庸揆日攻位是年冬也癸卯春令尹王某來官官事事李賛府某又從㬰之逮良月輪奐美凡為間五楹廿有八深尺五十廣倍其三不侈不陋衿佩訢訢然曰是不可不記學耆宿徵記於天叟黄仲元叟謹記曰夫子之道日月萬古著在人心不以有堂而後尊士而自尊其道是即尊夫子也與夫子並世者尊吾道獨子貢一人耳去夫子未逺者尊吾道獨孟氏一人耳為子貢且難難况孟氏乎升斯堂者如子貢與孟氏而後夫子之道尊不者武叔子禽之徒此堂得以移之夷之相辛之學此堂得以攻之雖然此為學子言也若夫宰百里者皆以吾夫子學道之語而俾習弦歌此堂孰得而議之長庠序者皆如吾夫子學不厭而誨不倦此堂可得而譽之必如是而後夫子之道尊子曰尊五美斯可以從政矣宰百里者而記斯言又曰謙尊而光卑而不可踰長庠序者而記斯言又曰君子尊德性而道問學為學者而記斯言庻無負昔人命堂之意堂顔今孰書之僉事張公某也又孰立之郡侯史公某也令佐後期㑹先教化文學賢稱前文學掾方平也前於永陽修泮水愜輿誦今斆兹邑獲上信友又起學宫學宫學之宫舎也文翁修起學宫於成都俱可記年月日甲辰清明旦莆田縣廟學聖像記莆邑舊未有學儒𨽻郡博士弟子員逮學宫成天地輿薪矣學左為廟廟者貌也先聖先師之所宴娭先聖夫子先師顔曾思孟娭音依漢安世樂神來宴娭顔師古曰戲官吏師生朔望奠謁春秋薦幣唯謹至元癸巳教諭髙元子感夢之明月始繪泗水侯右方三十五人于廡之右單父侯左方之十五人于廡之左巳事舎菜頌禮威如按孔像唯家廟小影為真聖冑亦曰先君生無須眉天下王侯不以此損敬生並世者又曰修上趍下末僂後耳老萊子弟子出薪遇仲尼反以告曰有人於彼修上云云視若營四海不知誰氏子趍音促下短也上謂頭前末謂背膂耳却近後漢成都學始有石刻席地跪坐唐開元像先聖堂西東向先師則東北南向有神位而無像設下之世雍泮都邑偶塑轉異美髯長髭未審奚據從祀雖應禮圖歲深人古太史公亦謂鈞之未覩容貌不知有子果似聖人子羽果狀甚惡子羔果長不盈五尺不也然道貎天形非有縱目卭鼻四手八足之怪但生知者為聖學知者為賢耳形狀末也心之誠與洋乎如在心不誠與視而不見諸賢來於宋齊衞陳蔡秦楚之邦與魯君子學道洙泗之上立問坐答更唱迭和論語二十篇儒羮墻也遊斯廟者求諸心踐諸身有孝弟為仁崇德辯惑者不有三復白圭克伐怨欲不行者不有君子若人吾斯未能信者不有行不由徑舍瑟詠歸者不皆入或教不先承不謹侗好佚邇宵人非明正之徒為宵夜之行列子顛㝠富貴相鹽以利者勿入非裘㸃之於旅語禮記孔子射於瞿相之圃使公罔之裘序㸃揚觶而語裘曰㓜壯孝弟耆耋好禮不從流俗修身以俟死者不在此位也㸃曰好學不倦好禮不變旄期稱道不亂者不在此位也亦魯薛之令弟子辭也儀禮古者賔主投壺以弟子年稚者或相䙝狎故令魯薛戒令之曰毋幠毋敖無偝立毋踰言元子莆之良奥者當事自當爾何敢以闕牢禀辭講堂齋廬門序瓴磩音戚石也俱欲華好尚籍力於令長貳朂哉無斁月日不書四如集巻一欽定四庫全書四如集巻二宋黄仲元撰自得齋記自得二言何始乎始於放勲命契之辭也然猶有待於使然而後然也宇宙中間鳶飛魚躍蟲兮能天物之所自得者也昭文於琴莊子曰有成與虧故昭氏之鼔琴也無成與虧故昭氏之不鼔琴也柴桑於酒柴桑淵明所居採菊東籬見白衣送酒而喜謫仙於詩李白號謫仙李陽氷曰太白多天仙之詞馳騁屈宋鞭撻揚馬千載獨步惟公一人而巳人之自得者也扁斵輪梓削鐻鐻樂器形似夾鍾削木為之痀瘻累丸又精於伎者之自得也况有道者乎子思子無入而不自得此以人事言也子車子深造欲其自得此以天理言也天下無事外之理亦無理外之事素位而行觸事而與理俱左右逢原理熟而隨事見由上下察而極於無聲無臭之至由根於心而形四體不言而喻之妙之二子者所得有自來矣進而求之子淵子其未得也仰瞻鑚忽既得則欲罷不能如有所立卓爾上而求之吾夫子生知而猶志學其未得也發憤忘食既得則樂以忘憂不知老之將至豈但簞瓢陋巷疏食飲水而寓自得哉前二子者之言自得趣固不淺一聖一賢之不言自得味尤深長自之為言由巳而不屬乎人得之為言誠中而無待乎外希聖與賢正未易易下之世元凱晉士耳其序左氏傳謂將令學者優而柔之使自求之饜之飫之使自趣之若江河之浸膏澤之潤渙然氷釋怡然理順然後為得此豈惟讀左氏法凡讀六經四書皆然元凱惡足語此河東李侯以文獻之餘襲風聲之舊窮理之學常惺惺經世之志活潑潑蓋難與俗人言故命其書齋曰自得夫既自得之名之贅記之又贅然不記則無以見左右逢原之天素位而行之地又無以見所樂者何於是濡筆記之余即記虗已遊世之堂者名氏與年月日不書虚巳遊世之堂記員嶠號李侯名所居堂曰虚己遊世余髦矣不及登侯之門兒梓至自鐔津傳侯教曰歸語而翁為記數語余答梓曰斯堂斯名合内外之道廓乎大哉虛已者無為也遊世者無不為也己之所以虚者心心之所以虚者道猶之水以虚而明須眉可燭猶之鏡以虚而鑑肝膽亦見不知己之有我但見宰之者天巳之外皆人也巳生於人世不能不與世接既與世接不能皆靜而無動皆休而無作皆處而無出於是乎時與之遊焉然是遊也非奔車之上非塵垢之外彼為嬰兒此亦與之為嬰兒彼無町畦此亦與之無町畦為嬰兒喻無意無町畦喻無威儀皆謂其不小立圭角也而是非不亂於心利害不變於巳未嘗為種種者役役者好知之亂天下舎夫種種之民悅夫役役之佞雖人之合即天之合也孔孟之道不行學鄭列宋莊書者皆曰吾虚湛寥泊可以遊方之外不知之二子所謂虚者有仁義無嗜欲不將不迎以道集虚㤗宇定而發天光徳宇㤗然而定則其所發者天光耳非人耀又不知二子所謂遊者觀其所變非觀所見或出入六合九州或縱觀江海山林順人而不失已莫非與天者遊學是書者何嘗夢到莊列妙處侯無書不讀眇乎二書亦造其微謂莊即列也飬生主即虚己之道飬生主人問世皆莊内篇人間世即遊世之方惟至人乃能遊世而不避順人而不失己註本無我我何失焉唯虚己故能遊世雖遊世而實虚己故摭莊書四言以扁斯堂反而求之易大傳寂然不動感而遂通天下之故之二子且庋高閣梓其為余謝侯之屬可則書於堂顔之左不者雖帳下兒勿與之讀劉荆州作書與孫策示禰正平平曰將使策帳下兒讀之邪使張子布讀之邪侯倜名士𢎞字河東人前集賢侍讀學士今中大夫南劍路總管員嶠真逸其自號也嵗至大戊申月孟冬癸亥日庚子望莆四如老人黄淵彥安七十八筆篔音員竹名谷記莆之支邑曰游洋其西有山兩谷對峙俗號谷目境與人勝而陳氏族於斯西軒先生與老艾同一輩人邑庠祠之裔孫仲和名以節字屋後有竹一畝取文與可名竹之名自號篔谷兩為儒祭酒今兹再調鄞江學正此豈足為以節榮哉將之戍告别於叟叟贈言曰竹之類三十九而名亦夥篔簹其一也房千里竹室以氣為主白樂天飬竹以賢為異然皆不如衛詩之興君子去之二千餘載想其人而不可見而竹亦無知音者晉賢之遊溺於酒流於虚於竹秪辱獨二仲羊仲裘仲差强人意又不可得而友矣唐賢詠竹最多唯錦里翁淨香一聨最為絶唱杜少陵詠嚴鄭公宅竹詩雨洗姢姢浄風吹細細香竹之淨易吟也竹之香誰嗅哉大抵人生斯世同流合汙皆非豪傑之士唯特立獨行而㧞乎流俗然後可以對此君也王子猷曰何可一日無此君孰不種竹而比之以千户侯陋矣史貨殖傳渭川千畝竹其人與千户侯等孰不愛竹而比之以十萬丈夫鄙矣杜牧喚竹為軍中十萬丈夫坡仙云無竹令人俗士俗不可醫篔谷非俗士也知谷者愛谷者第以詞翰器之則俗矣竹惟淨故不俗以素衣而染緇塵乎陸士衡詩句竹惟香故不俗不流芳而遺臭乎其知竹者愛竹者當以此而觀篔谷谷家有留隂堂西軒賦之稚子解褐斑斑有文句絶王謝子弟生長見聞霜雪貿貿不改其度美哉斯堂伯夷之築叟敢以此贈君知谷者愛谷者如羊裘則持以出客蔣元卿舎下竹中開三逕有羊仲裘仲者與之同遊蔣詡字元卿不音否則不顧主人而去時屠維己也作噩酉也嵗余月芒種日韻鄉七十九翁黄彥安記昭武危西仲寄傲軒記靜寄東軒春醪獨撫此避俗翁停雲四言也嘯傲東軒下聊復得此生此避俗翁飲酒五言也避俗翁謂陶靖節停雲四言飲酒五言皆陶詩東坡嘗和之東軒翁疇昔琴書之所故時時寄傲於其間翁之寄以天翁之傲亦天倚南窻以寄傲審容膝之易安此又翁歸去來兮第一章也不知翁者賞識其文知翁者以退為高無有觧音害翁韻者翁辭三章俱寄傲者也停雲四言乎哉飲酒五言乎哉此翁胸中度世於道悟入悟入神閑意逺邈出宇宙未可與俗人言坡老和翁四言五言風味大畧相似及和翁辭自許為翁後身畢竟道着翁意落在何處此十字為一句後來坡以寄傲為軒翁千載人坡亦百世士也坡去翁幾何年叟去坡又幾何年揭天地以趨新負山岳而舎故宧于東嘉之嵗叟以歸去來為幸活于環泉之嵗叟以得此生為幸門無􅃇雨之車時誦停雲之句新吾大殊故吾六字一句以新故為字眼寄傲之樂其有乎爾後十年丁亥客至自樵曰族危氏不逺徵徴於天叟黄淵叟問所以記何曰記寄傲軒軒以寄傲名何曰先世聞家也今猶鐵鑪步拏川福地也今為小桃源矣禽戀􅃇林魚思故淵人兮能無情乎背山面溪架樓厰軒畧容卧起煙雲獻狀風月入懐差足觴詠樵漁寄此生不是傲當時叟曰子不誦避俗翁語乎寄非如子休所謂軒冕物之倘來寄也子休繕性萹曰軒冕在身非性所有物之倘來寄也傲非如退之所謂既傲翰林又傲相國也亦非視世直逆旅與夫林泉人物草木蟲魚託興以為寄亦非離人立於獨與夫談諧雜俗醒醉相笑以為傲倘觧翁韻唯我與爾或忱唐虞上或問魯中叟或結耦沮溺或多謝綺角子之寄此翁之寄或稱葛天民或乗藍輿入州或與田父飲或掉頭逺公社子之傲此翁之傲或仕則求吏不為嫌或隱則觧綬不為矯或無則扣門而謁食或有則雞黍以迎客子之寄傲此翁之寄傲雖然子車馬有行色韻處恐落翁後有兄可友有親可娛有田可粟有溪可漁有軒可吟有案可書在世無須言息其廬庻幾樂此翁之樂歟不爾畏途馳狂歸路夢迷子身客寄乎東西何時傲笑乎山溪廼記翁語以壯客歸客名公鎮字西仲鄉貢郎南仲之季在軒黄君之後也叙事精宻清妙命隱室記命隱室何處士林君讀書所也隱之名多矣其上聖隱其次賢隱談隱斯為下揚子雲曰聖言聖行不逢其時聖人隱也賢言賢行不逢其時賢人隱也談言談行不逢其時談者隱也不耀天隱未及於聖文中子曰仲長子光天隱者也無徃而不通矣子光字不耀王通時人季齋名隱殆庻乎賢或問樊英名隱子曰古之避言人也英字季齋明經書推步順帝徵不出隱壺山不求名曼倩東方朔人隱談者之流問東方朔子曰人隱者也詭迹混俗不求自别衆人非天非人非名而以命隱蓋不怨天不尤人而不求名之人也之人也伯休那韓康字伯休漢桓時人采藥名山賣於長安市口不二價君平那漢嚴君平隱於成都以卜為業日得百錢足自飬則閉肆下簾講老子伯休隱於醫君平隱於卜隱於醫者活人隱於卜者知天然而二子者不可得兼援引隱事類鑿出非宿學不能昔有河汾隱者以銅川夫人好藥始著方以芮城府君好隂陽始著歴銅川夫人通之母芮城府君通之兄也為芮城令儒固無不通也之人也殆若人與前說隱後說命以芮城引起自是用意不泛雖然學醫者人費談何容易視色而名不出家視毫毛而名不出門扁鵲答魏文侯曰長兄視色而名不出家仲兄視毫毛而名不出門今有斯人乎否太史公傳秦民淳于氏不與日者龜筴傳接或者疑之過矣三命是律五星是歴律歴猶可談也人為萬物靈雖天之高星辰之逺千嵗之日至人能測之律造於伶倫歴造於容成甲子始於大撓星象專於師曠迨軌革之書出管輅字公明漢魏時人善占術軌革之書乃其所著也前千萬年之已徃後千萬年之方來興廢盛衰治亂禍福皆於此乎占凡人初生年月日辰生勝衰旺窮通夀夭亦於此乎推太史公至軌革數叚専為命字立論此與林處士室占地步作文不可無此意謂有耶未必有謂無耶非果無聖人不言命賢者安乎命人不能皆聖賢也然後决於命惟决於命召之在前命之在後斯自取爾善言命者莫如易澤水困君子以致命遂志水在澤下坳堂爾所以困君子居之坳不平凹也莊云覆杯水於坳堂之上芥為之舟以莫之致者聽之命以所得為者遂其志不恐懼於險難不隕穫於窮厄從吾所好而巳故困而不失其所亨此吾處士名其室曰命隱之意引易以下纔結本文命隱之意記者誰韻鄉老人黄天叟淵也年月日不記灌畦記州東行不百步有進士家曰歐陽氏治其書室榜曰灌畦蓋當家事也來速予記凡四月餘眂即視字畦之齋縱横一席地經史筆研外無敗意物說畦之齋畦之所廣四尋有半深半說畦之地畦之蔬早韭晩菘可葅可湘說蔬或問菜味周顒曰春初早韭秋末晩菘淹菜為葅湘烹也畦之花春蘭秋菊可佩可觴說花夫婦持甕出汲老奚僕名剖竹走泉稚子掬水弄月說灌畦可入圗畵客時外來酒三行嗅花而去斯人也而有斯樂也結上數叚然吾聞勺水濡沫不如甘澤之流澍音注機舂潺湲不如天瓢之滴瀝人力所至不及則渴過則溓音粘泥黏也不如空中揮洒無有踈宻天有時以生有時以殺天有時以生陽一嘘而萬物生有時以殺隂一吸而萬物殺日出杲杲時田汚萊民菜色一草一木亦為燋巻枯槁天有時至枯槁句作一叚不属下文賜也桔橰子貢告漢隂丈人曰鑿木為杭前重後輕挈水若抽名為桔橰俯仰隨人幾何膏潤桔橰下二句說桔橰之勞當作一叚甫也連筒杜詩云連筒灌小園甫少貧客吳越齊趙客秦州負薪採橡自給南北羈遊不皇寓息連筒下二句說連筒之勞作一叚樂乎不也春膏脉脉堯之壤周之野惟夭惟條實苞實茂東阡西陌件件生意奚獨此畦之人之蔬之花十字為一句主人逌音猶然曰斯時也富者園池不復守貧者置圕儲糞之所無所吾灌吾畦猶有葱肆可業一叚梁呂僧珍出身甚微以販葱為業逮貴封侯兄子求官僧珍曰汝等自有常分但當速歸葱肆不聴其求有饑未及菱者有致書吾求薤者吾灌吾畦猶有菜根可咬二叚夏屋渠渠壊垣納車汚敗縻毁吾灌吾畦有馬逸踐吾葵否三叚魯漆室邑之女曰昔有客馬逸踐吾葵吾終嵗不飽葵井邑聚落旦暮吏來呌囂堕突吾灌吾畦有催租人敗吾菊否四叚天公憒憒殊不可曉吾致吾力無妨吾畦此四句結上四叚余對以易坎陽一隂二為雲為雨此二句說坎卦不接下句雷與雲薄於卦為屯天造草昧此一時也此四句說屯之時雨與雷交於卦為觧甲者皆坼此一時也此四句說觧之時屯必觧天之道子之畦吾將賀姑少俟灌此畦者臣夫名梓記此畦者四如居士愚丘記愚號也丘姓也姓同而號獨也愚之號類君子而非君子問何以故醉與狂與假混沌與學嬰兒與丘曰不然巧不如拙語不如黙明不如晦詐不如直人軒軒卭我也落落人役役卭舒舒人蹻蹻卭種種人晏晏卭劬劬種種謹慤貌淳厚也役役思㸃貌有為人也寧為舌不為齒舌柔齒剛老子曰齒敝舌存寧為萭不為規萭方規圎考工記曰可規可萭萭即矩字寧為鹿不為馬鹿是馬非秦書記趙高指鹿為馬寧為龜不為犧龜犧論俱見莊子吾為號吾曰愚也宜萬夫九鼎深巷四科司空城旦桎梏而坐諸嘉石役諸司空坐日滿役使司空贖過律云髠鉗輸邉晝夜防㓂虜夜築長城時吾誦仲尼居劍士語難勇士憤氣積於胷中言不流利也時吾作裘氏吟莊子曰鄭人緩也呻吟裘氏之地祗三年而緩為儒杖折委笄時吾衣魯縫掖青衿顦顇時吾為漢博士生匪鳶匪鮪于天于淵未離人世有此倒顛吾而號吾曰愚也宜蹉跎陶唐鞭撻日月推數步歴吾不如西州智士前漢方士洛下閎多智善推算歴數班固賛曰歴數則唐都洛下閎妙術通𤣥吾不如竺國澄公佛圗澄天竺人妙通𤣥術善誦神咒能役使鬼神腹旁有一孔夜光照室石勒聞其名召試其術澄取鉢盛水燒香咒之須㬰鉢中生青蓮花揲蓍布卦吾不如河東闗生闗朗字子明河東觧人也謂王彥曰請命蓍卦以百年為期於是揲蓍布卦遇夬之革嘆曰今大運不過二再傳改命至甲申二十四嵗戊申大亂禍始宫掖經世觀物吾不如伊川丈人一燈萬巻盲人觀棋縱浪大化喜懼不知吾而號吾曰愚也宜嗟嗞乎生之後不如生之初廼暇豫之吾吾不蘧蒢而戚施蘧蒢編竹為囷不能俯喻龜胷者戚施布囊不能仰喻駞背者陳氏曰好奉承之態似之甘擁腫之與居擁腫無知貌朴也太行王屋奔車覆車自鞭古心庻歸夷塗惟愚故道可載與俱然而通國靳儒不孰何予此吾所以專承曰愚叟試諧語昔有愚夫十襲石以為寳冕𤣥服以出客客見之而盧胡掩口而笑也主人猶忘為石十襲以帛十重封之荀子曰宋之愚人得燕石於梧䑓之側藏之以為大寳周客聞而觀焉主人齋七日端冕𤣥服以發寳匱客見之俛而揜口笑曰此燕石也與瓦甓等主人大怒藏之愈固子之愚毋若宋人然雖然叟懼其不果愚也矰弋上罻羅下矰弋機而在上兮罻羅張而在下兮見楚辭昔誦篇法重心駭室交徧謫詩室人交徧謫我謫責也或未免於投虎自衛也木石居鹿豕遊離人立獨羣吠所怪或亦難乎休隂息影也昔芳草今蕭艾芳草比君子賤草比小人楚辭賢者齊平也言與民齊民變俱俗流或不得以脩吾初服也前講肆後馬隊周續之與學生祖企謝景夷二人在城北講禮加以讐校所住公廨近於馬隊咈耳搔心怵廹西東或何暇而歸尋舊書也子之於愚且喜且笑竊不自料吾言而中悔前轍之不遂偭常度而遽改楚辭曰偭規矩而改錯偭背也愚不辱子子能辱愚奈何乎丘雖然佹詩不云乎弟子勉學天不忘聖人共手荀卿所作卿既為蘭陵令客有說春申君曰荀子賢而君借以百里之勢臣為君危之荀子去之趙既又使人請之荀子不還而遺之賦時幾將皆佹詩云子毋以愚為疑叟尚能為子歌之丘名某字臣甫莆良士叟無名族故與嵗月日不記愚丘之號不過如昔人稱短李迂辛耳李紳短形能詩辛太性迂嗜酒記者類於丘姓辭費且用回寗柳子為故實然回之愚著一如字似然似不然寗之愚著一則字時然而後然柳之愚其然豈其然叟此作上不及回中不及寗下不及柳不欲屋上架屋也客有問丘請代叟對如前云云二友亭記亭名二友何主人志也賔曰孟獻子之友樂正裘牧仲與李元禮之友荀淑陳寔與主人曰非也賓敢問主人曰木植物也木之有心者莫如松可冬可夏李膺與陳荀為交友同許州襄城人仲尼曰受命於地惟松栢獨也在冬夏青青木之有節者莫如竹宜風宜雪二陶愛松而不愛竹二陶元亮有三徑之松𢎞景愛松聲庭院皆植松二仲喜竹而不喜松二仲羊仲裘仲俱有其一而遺其一杜陵野老東西南北所至誅茅覔松分竹淨香一聨人道不到千年老意相期華皓成都若非故居來徃徃來入門而四松在步堞而萬竹踈竒可知已吾守莆客莆第之左小亭踈明僅墨尺許牎之北松槮槮音纎木長貌而有柱明堂之規符載論松根植黄泉枝摩青天可以柱明堂棟大厦左右鄉竹畟畟音尺進也而可等封君之榮封君榮即千户侯吾朝夕斯坐卧斯二美合并如宿素交吾是以名吾亭賓曰淇澳綠竹衛人以興武公時公九十有五德盛善至民不能忘徂徠之松魯邦以美僖侯祝侯黄髮兒齒何以使人稱願如此雖然俱一也而非二也我主人心立獨故畸於人侔於天節高世故貴不滛賤不移可冠劍而廷議可兵甲而環侍或處或逸或公或相無適而不與二友俱魯衛風斯下矣昔左史李公牧廬陵日手植松竹堂扁二友命郡人胡澹庵記之我主人政成化舒不減左史賔退士豈庵前一輩主人有命賔安敢辭遂筆答問為斯亭記主人族信氏名世昌號中隱東平人莆州尊也賔謂誰四如老叟黄淵也主人韻二友韻老叟亦韻此豈可與俗子道年月日至元甲午孟夏戊子也至元元世祖年號意足亭記天叟每誦司馬公花庵獨坐詩荒園才一畆意足巳為多語兒孫曰意足二言可命吾亭第不窺園三十載非舊種讀時也異日叟訪友人徳輔林兄開樽延坐亭上亭之前架蒲萄小盆池三植以菡蓞級石為䑓䑓之上與左右山皆竒石也有海棠南天竹有茶柳月季花亭之後架荼䕷東西則木香刺紅而那悉茗四繚其旁蘭松雜花百餘本竹與拒霜又在亭之南它果木不登數雖不丘壑如隱薜蘿吾徳輔可以適意矣徳輔曰斯亭名何亭為吾擇令名名之叟遂命曰意足徳輔曰曷謂之足叟曰士或以功名為足而未免浪泊之歎悔或以衣食為足而不知郭墦之羞訕或以林泉為足而又貽北山之嘲謝孔穉圭作北山移文以譏誚周顒假隱之三者皆未知所謂足也徳輔非汲汲於青紫印綬者非區區於肥甘輕暖者又非枯槁於飡霞煑石者坐斯亭也四時靜佳衆芳暄妍山石之􅒞音酧崒音突草木之葱倩迎風揖月課兒觴客洒然無累於外而充然有得於中此不為足又奚足徳輔又曰余深顧長慮而冀永年子孫孫子勿替引之斯亭若不得天叟記於顏間豈得方之東池之勝叟逌音猶然對柴桑翁柴桑靖節所居村名不云乎此中有真意欲辯巳忘言於是欣欣落筆徳輔名某唐忠義藴之裔孫望族也亭在少府聽平聲事之左世美堂之右廣深各六丈有竒繇大徳初迄甲辰冬始完天叟則四如老人黄仲元是日曷日日南至孝經說冬至有三義一曰隂極之至二陽氣始至三日行南至萬竹胡希道見思堂記嵗甲申夏六月莆黄淵天叟異姓兄可山陳文翁客溫陵胡君希道所以書抵叟吾主人文雅醖藉美無可㨂吾里如心陳公竒貴之今為相國尊客所居有玉槊萬玉槊竹也東坡云千株玉槊攙雲立堂顔見思字羡尺言匾字大也日坐其下使意也消願屬叟記其秋句叟愛友平山姚勉至自泉申主人之辭曰天地間何物最韻曰抱節君晉士雅愛此君自子猷諸賢始晋王徽之字子猷寄居空宅中便令種竹嘯詠曰何可一日無此君然其弊也不恭後三百年唐詞人俱喜吟詠少陵淨香一聨郤退餘子然未免求於聲色臭味間香山老坐東亭香山老白居易也香山有九老㑹以人觀物不以物觀物是時年壯氣鋭猶以遭不遭為幸不幸洎居洛第靜對寒碧吟醉醉吟浮雲富貴矣退省此老平生初以直道爭安危中不附離權勢終完節自高異日想像四等人物今皆歴歴踐言元微之劉夢得視之顙泚㣲之始峭直欲立名中見斥喪所守附宧貴得相晚節彌喪加亷節不餙夢得初附王叔文多中傷士類憲宗嗣位坐貶朗州乆召還作詩譏忿當路出播州後又召還作詩詆權近聞者益薄之褊心怨望晚年益偃蹇寡合雖然此猶唐士句奮百世上風百世下者誰句衛武公之詩三句賓筵一詩譬如新篁句得時張王勢欲騰騫懿戒二詩又如修林句禁持風雨猶欠料簡淇奥三詩則如逺根宿幹聲揚質亮老嵗月飽風霜此三叚敷演武公三詩言竹之美如此然後以美君子瞻嚮慕之切猗猗句盛美之極詩人工於興物如此君子成徳之名不可諼不能忘之至詩人深於愛賢如此此叚說詩人以竹稱美衛武公約上三詩之意後來者子曽子猶好他人不好余十四五時有晉士王子猷之雅而無晉士之弊年強仕慕香山白居易之節而得香山之趣今耆老誦武公之詩則師武公之徳叟吾同甲又同好敢溫前請叟讀已逌然曰此人有此韻煩吾兩山可山平山問信希道叟號韻鄉有圃種讀嵗寒老伴數竿自足彼美丈夫盈庭鸞鵠誰歟户外羊裘觧見上隣卜人各天方姢姢在目彼心我心我竹彼竹晉風流迂唐文章俗大學典刑老成淇奥鶴鳴子和君倡余讀努力華皓元身圭玉幽人之貞大過之獨黨印斯言持扣九曲兩山曰是即見思堂記當為叟報希道龕于壁此文始王子猷中白樂天終衛武公立三柱以形容愛竹之意復以自巳愛竹轉應三事末又諷詠以足其意劉氏復本堂記劉氏之堂以復本名何用簡名復乃祖知本闕之舊也人生乎祖一念之復祖其相去聲而子孫孫子書澤演迤方將未艾堂之東西有亭各二浩浩亭名者飬本然之氣怡怡亭名者全一本之貞小小亭名者心誠以事本初之元悠悠亭名者力久以充本體之實由身及家事天如親是本也根於方寸溥之萬有鉅無不包細無或遺邇而無間逺而不測其中庸所謂大本者乎雖然談何易易惟學問可以配浩浩惟孝友可以樂怡怡惟嚴恭可以翼小小惟純一可以致悠悠談何易易雖然在易之復初九一爻為徳之本造化以是復元氣之初人心由是復真性之初進而上之二臨三㤗皆初爻所生也天運復則人事復則君子之朋亦復而亨矣君子之亨則劉氏聲名赫奕又象乃祖可以為斯堂之光余記舊年後村舊為劉丞相第姚衖舊為陳僕射第相頡頏時二老夀俱八袠之上城市陵谷之後禁從家聲空有鐵爐步之名鐵爐步見韓文蓋傷地改而名存也實重烏衣巷之歎此歎後村之零落也烏衣巷王謝盛時故宅惟姚衖堂宇浩浩兒孫怡怡跼音局天蹐音脊地詩曰謂天蓋高不敢不局謂地蓋厚不敢不蹐畏心小小課子讀書尊禮賢士未嘗付吾道於悠悠以家觀家復劉氏者其在用簡乎落筆至此感慨又當何如至大庚戌小雪後記至大元武宗皇帝號尹氏萃貞堂後記尹氏鄭圃地名官族也良臣彥士也萃貞堂尹氏先塋孝享之地也名斯堂記斯堂者誰西疇野人施某名堂安慶郡博士謝某記堂也此復記何情無窮文亦無窮也然則堂所以命萃貞者於義何曰萃之義一貞之義四萃者聚也人之身父祖之身也隂精陽神二氣之聚斯為人若父若祖魂升魄降氣之變則散矣散者曷使之聚於是祠之至此釋萃字之義有其心信於禮無一毫而不中斯之謂正祭不欲數去聲又不欲疏春露而怵惕秋霜而悽愴或朔望或薦新以時思之斯之謂常天地有升降而貞者常觀日月有盈虧而貞者常明人世有新故而貞者常一夫如是然後可以言固此三叚觧釋貞字四義不者視時汚隆為已敬簡僾愾之心何自而生僾悒也愾太息豈先民報本反始之義哉亦豈尹氏翁季所望於來昆雲仍哉來者𤣥孫之子昆者來孫之子仍者昆孫之子雲者仍孫之子或曰萃之繇即爻字為有天下者設尹氏名斯堂何曰易不可為典要聖人有聖人用賢人有賢人用學者有學者用公卿大夫士農工賈隨所用而用之斯堂獨不可以萃貞名乎遂濡毫而記其義於後若夫尹氏之家乗堂之年月此不書是記也莆四如老人黄淵彥安七十九筆東野書房記叟曩客樵川富沙滙江芝山瑞安時傾囊置書歸里朱墨校讎唯謹丙子戊寅間兵蹂其半盗藏其半然後歎藏書之難廿餘年來新進小生以科舉不行而輟讀與刀筆相從事者不暇讀吟風月以為工者又他讀間知課兒燈火尋行數墨而不知其所以讀叟雖未離清浄業然聰明不及中年開巻如生掩巻旋忘廼又歎讀書之難或喜㩁訂訛缺穿穴叢𤨏騁韶妍釣聲譽而斵木不勝任製錦不中度不為行河之禹貢則為理財之周官惟讀錯故用錯叟髪種種不諧於時益重歎用書之難噫嘻藏而不善讀猶不藏也讀而不善用猶不讀也三山讞掾汪君學仕俱優有房庋音鬼閣也書萬巻朝夕彷徉其間慨然忻慼今古介博士凃音塗姓君囑叟記數語叟喜君之善藏又善讀且善用也故以其所感嘆樂為君道之前代元夫鉅人宅三事者書任人凖夫牧作三事三事三公也惟受用論語一句兩句用書正不在多此語又惟東野領㑹幸勿使他客見曰我軰學問止論語汪君名某新安人叟謂誰莆四如老人黄淵字天叟記已授凃君復之俾留東野壁間以為吾兒異日邂逅一笑話柄魚我亭記孟子曰萬物皆備於我則物物皆我性分之所有也以物觀物則物自物以道觀物則物即我魚雖天地間物𦕈然小哉而大易之信可及中孚彖曰信及豚魚中庸之至可察在淵或渚則知理之無定在潜伏孔昭則又獨之所當謹孰謂我自我而魚自魚莊惠二子亦豪快士惠曰子安知魚之樂莊曰安知我不知魚之樂莊子與惠子游於濠梁之上見鯈魚出遊二人問答惠固辯矣莊未為真知魚其設為吾夫子之言曰魚相造乎水人相造乎道然不過謂魚與人各自足而相忘耳聖賢之學不然東野汪君穿池飬魚盖悟詩易中庸之理而非惠莊灑落𤣥虗之誇但此我與我道而我難與俗言叟與野俱不相知以道觀我則野同乎我而非異乎我獨魚我之謂我而非我之謂我乎彼魚也獨庾氏之魚而非辛氏之魚乎庾氏穴池飬魚以木為凭欄登之者其聲堂堂每凭欄投餌魚必踴躍而出辛氏云云不投餌但聞䇿䇿之聲魚亦出是庾氏之魚可名堂堂辛氏之魚可名䇿䇿出宋齊丘化書遂筆以授魚我野寄聲曰賢者亦樂此乎叟又復曰倘與我共我将與魚我從而聽叟即記東野書房者年月不書南劒路新社稷壇記河東李侯以前集賢侍讀學士中大夫守南劒路總管府政成之明年喜溪山之如昨慨社稷之弗稱與侯之簉初救切倅也左傳僖子使助薳氏之簉程侯謀撤而新之程姓亦願庀其事計徒於己酉某月訖役於某月某日壇在郡西山之麓靣勢址壝丈尺崇殺去聲齋廬門垣一如禮法左右掖則公風雨雷而壇之尊祀典重農事也侯寓書徴莆黄淵記淵敬記曰社稷之示平聲各一而所配之神亦各一社與稷若二而實一也百昌皆生於土而土爰稼穡於糓為重糓非土不長土無糓則耗故稷與社等祭社必祭稷風雷天之號令雨其水澤也土非雷風奚其動奚其散糓非雨奚其潤奚其化嵗之上下係焉叙社稷與風雷雨相需通祀之意於是郡國得以通祭祭于北墉答隂義也祭日惟戊用剛辰也獨陽不生獨隂不成土糓得冲和之氣然後由貞而元亨利也竊甞怪下之世春秋祭外隂陽之或沴雨暘之不時高士泥閉縱之術齊民信巫覡之禱於社稷漫不省至謂箕畢之不神百里之不足震驚箕風星畢雨星百里震驚雷也應上三神之義吁陋矣農所依者二侯二侯所依者神土糓之神與天同功而能召風雷下雨澤者也不此神之告若何彌水旱順豐年哉我二侯之仁於民敬於神神亦體二侯之意不疚爾農且庥于民田更野叟樂嵗終身飽雖神之賜亦二侯之賜也而今而後語僚屬府史曰予二侯者非干譽以徼福也為爾後之人後之人繇上逮下以和召和庻證音徵咸若萬分一潦若旱有謁從欲非瀆非僣勿怠勿壊李侯名倜自號貟嶠真逸程侯名文沆號西樓南劍總管府判官淵號四如老叟年月日至大二年立冬乙巳將樂縣桃源橋記將樂南劍路支邑也邑十里南曰桃源溪古渡也溪有橋汀廣午道也東西行者利之嵗異月殊水磯横斷並溪之民或塗以茅庋音支以木䋲以筰音昨竹索夏潦秋霖茅朽木蠧筰亦觧坼音坼裂也涉者病焉今總管李侯士宏始下車惻然曰橋梁不修誰之過諉邑簿徐某前廣徳路同知吳某董其事堂僧覺徳首受役要由是善勝金明皆僧名等有輸財者捐粟者助工庸者絫石為址橢音惰器員而大而方之釃渠為洪導而四之不低不柞架梁其上左右埂音梗坑也丈六十有咫環築以石直欄横檻崇麗堅緻輿者行者如行九逵靡楮一萬萬餘而民不以為苦且勞句興役於大徳丁未十月竣事於至大戊申七月祭飲之日仕於此邑者邑之已仕未仕者田更野叟共祝橋夀余於是賀此橋之遭也不可不記記巳賦以詩曰穹壤間水有利有害其害横流其利沃溉川陂澤梁闗國之政昔人以此覘陳議鄭仁哉我侯說以使民相厥桃源通旅敬賓水既昏星也正土功乃興梁空以行不夙而成鎮蛟龍淵跨鼇背上天造地設蓬瀛蕩蕩萬口一詞我侯之徳侯曰當然牧守之職旄倪祝侯如傳植鰭音耆魚脊濟彼巨川舟之楫之誰能詩乎咏嘆以歌俾侯黄耉等橋之高聖墪順濟祖廟新建蕃釐殿記妃號累封前此有年矣宇宙趨新真人啓運祀秩百禮命申一再䕶國者功庇民者徳明著則神之誠不可掩也盛矣哉聖墪廟幾三百禩嵗月老正殿陋李君清叔承先志敬神揄龜筮卿士庻民協從由寢及殿易而新之鳩工於大徳巳亥祭落於癸卯臘月五六年間始克就難矣哉按舊記妃族林氏湄州故家有祠即姑射神人之處子也泉南楚越淮淛川峽海島在在奉甞即補陁大士之千億化身也而莆聖墪實源廟之祖墪以聖命之何妃馮浮槎現祥光徧夢於墩之父老遂祠之賜順濟始於何時妃䕶夕郎路公允廸使高麗舟國使李公振請于朝也廟前曰殿半以後曰寢乙殿居甲丙間建於何年自制幹李公富奉妃像正位序始殿曷名蕃釐地示音其稱媪釐者福也百順故蕃筆則法從去聲陳公讜立則李令尹茹存舊也殿之木焉須妃隂隲民之精爽不貳者曰山之西有木鉅甚工師求之果如神言盡售其材以歸殿之費焉出四方之善信樂施音試也殿之役誰助教役屬功則鄉之寓士耆宿奔走疏附則里之千夫百夫長也雖人也亦神使之也始者乗槎而宴娭於斯今兹指木而輪奐於斯吁亦異矣哉或曰神妙萬物御風乗雲變化無方奚必留瓊館於人間曰不然妃猶日也日必有次妃猶星也星必有舎他所謂神者以死生禍福驚動人唯妃生人福人未嘗以死與禍恐之故人人事妃愛敬如母中心鄉音向之然後於廟饗之廟言貌也其求諸神於彼乎於此乎廼有寝有殿有正殿神之報乎人猶親之愛其子孫故是饗是宜榖我士女降福而亦穰簡此殿之所以扁蕃釐於是大書特書若夫妃禦大菑捍大患應在祀典此不書清叔亷靜謙和而老於事廟東湄嶼移星轉漢有識者巳亦不書前殿觀瞻未稱清叔有志竟成將不一書某甲午冬嘗夢妃以記相諉忽焉十載而李君清叔奉祀之命來不敢以老醜辭故墨筆以印前夢書既系以詩曰穆穆天子前聖後聖上昭下漏靡神弗敬灑澤龍宮河圗輝映莆僻海陬臚歡拜命其一公家有齊季女生也賢哲嶽鍾凟聚殁也神靈雲飛電吐不識不知自成功所其二天回地游否泰消息殷墟周京化為黍麥大哉乾元坤順合徳斯廟耽耽千年血食其三福地仙居珠簾玉坐帝子天孫容衛右左木從西來神受人造駊騀音叵我嶙峋方壺翠﨩其四春秋嵗時謁欵穰穰上聲迎兮何至送兮何徃神而宇之其中㫚蠁忽響聴爾六祝去聲嘏爾景貺其五張天師正殿記昔有船訪蓬萊日候神人見跡甚巨漢武發船遣公孫卿求蓬萊神人卿言夜見一人長數丈就之不見見其跡甚巨類禽獸云喜以為仙者又有老翁拆葉為舟與客泛渭登旬抵家者陳季卿十年不歸一日値終南山翁折竹葉置寰瀛渭水中卿見一舟甚大登舟旬餘至江南謂無邪載之史及他書謂有邪知者蓋未盡信孰有駕鐵舸留靈跡如我仙師與平聲師以仙名分形散景通神變化豈塵凡所能測識舸雖焱音焰騰為虬為龍而步嶟留石可尺二許甚彰彰也易溪流而平崗驅黎民於境上農祈榖麥而雨應商禱䑺檣而風若盗賊不作呰音子癘不生此又有功於民者捍災禦患於祀典宜師之廟福清州峯頭玉蜍山之左始創於天禧初重搆於治平三前殿則首事於紹興二其賜額昭靈則又八禩也師之錫號保禧熈寧之十進封妙應顯祐惠應妙濟福順皆紹興三十年以後淳祐徳祐間也記是宮者進士陳良宧族黄顔榮也然前記謂按圗史而無所載未知何許時人後記書師之諱曰存或有所考與平聲抑以疑傳疑遂信而徵與平聲嘗聞翊聖真君降言於守真之子汝父遭逢於吾故令子孫受福正一真人亦逢聖代得道之後世世不絶竊意師非翊聖之裔即正一二十三代諸孫行音杭故親傳秘訣與道合真乗雲御風其來勃勃音拂其去縹縹入鐵透鐵入石透石有如飛鳴偶留指爪夫豈凝滯於物以人間冕服宮室為戀哉雖然此一福地與他葆祠不同黨非後寢前廟若何而栖神靈由是姚勉募編列新正殿敞閣室闢步廊僝功於至元乙酉祭落於丙戌碧牎朱栱聈聈音杳皇皇非前日之柱穿蜂溜燕舞帷塵矣洎丁亥春改塑神儀瑞氣徹天侍衛導從如朝通明無有有無恍然上界官府今登天矣余舊遊斯廟覽江山之竒羡蓬萊之樂裴回乆不忍去因記太史公曰嗟乎仙者非斯人而誰為之遂修辭紀實於麗牲之石而系以詩曰至人學道師赤松神姿逸氣心芙蓉手五明扇腰雌雄馮虚駕鐵超鴻濛玊距㾗深雕鏉音漱工巨跡千古鎮蜍峰狂颶怒濤鎻魚龍夜醒月凉水笙鏞騎吏無鞅鸞鶴從朝侍玊堂雲朶紅天樂隱隱聲徹空俗耳可聞不可逢𣺌視齊州等蠛蠓滄海有時揚塵風獨此瓊館留人封神仙之說非夢夢士民尸祝社稷同椒醑鞠􅎽曲跪瓜棗供余非紫陽山人翁若為詩之銘新宮汀州路重造府治定光吉祥寺記鄞江府治之東寺曰吉祥白衣菩薩伏虎禪師主賓眞相奉嘗于兹有年矣俗姓法名地產僧臘先後封號有銘塔者有狀事蹟者有碑記者有賛頌歌詠之者具載實録此不書第偈句九十五首各書贈以之中或隱語或名氏不可測知耳二師大抵以本尊本而心法勝以願為願而氣力大故覺道威靈豪出諸大士之右若貴賤若賢愚若小中大乗人遊我門繞我座禮我足皆傾府空藏去聲以侈其祠宇攻木礲石以紀其功徳至元丙子不幸竒刼寺熸音尖火滅于兵豈物巨細各有數師亦不得仞而有邪然壊固有數興亦有時郡侯黄公去疾諉僧寳興起廢未成而去同知薛公元稹亦諉之搆均慶院都元帥李公梅刺孫端請見堂老以性庀事由是大殿前後殿成天寳閣成三門兩廡言言嶷嶷上凌煙空性老戊戌年西歸屬䕶者西堂宏刻意專用力勤營度有序宏弟子慧鏡補見堂處質偉行㓗對師發誓了大莊嚴以次法輪藏殿羅漢堂毗盧觀音二閣寢殿坐禪亭丈室水火池一時壯觀寳相梵儀宛如本來靣目叙事明偹老學小心如此然宏之功居多抑師有相之道歟宣慰劉公廵部又於北坡架萬嵗亭以表嵩呼之祝逺邇走集唯見佛尊猗與盛哉莆四如居士黄淵耄矣􅖏音度户懶去乞水洗眼至大巳酉秋鏡介鏡道名介使也鄉友汀庠學正陳仲和前蓮邑典史方元善徵余記余恐當筆不過遲半載而速至再三余乃歎曰於乎道之盛師以誠動宮之侈師兮何心師與諸佛不生不滅鏡為龍象出勢力心下始大安隱去聲起戊戌迄庚戌拮据蓄租亦十三載甫就豈不難難居士甞聞佛法似一隻船祖師東來付兒孫大家把纜要到彼岸直待時節因緣燥性撑向須彌峯頂下觀三千大千世界鏡老駕舟不至須彌峰頂不歇且與後人作古居士又竊歎大浮屠辦堅固心如水穿石儒童菩薩直下傳燈㡬宫㡬人能如居士前所聞佛法否又能如鏡老光輝道塲放黑月成白月否居士雖喜為鏡老記亦重為斯文媿遂併書於記末鏡莆遊洋林司業之後自號明心法門尊足也記巳系之辭曰白衣隱去是空非空魔化為檀巋巋祠宮滿山泉石十里松風千萬億年庇䕃人封日月神通相百嵗翁覔偈四句贈之以中至大三年清明日莆四如居士黄淵記韻鄉記此鄉何鄉四逹皇皇無門無房四逹皇皇也莊云山潤川媚月湛霜明有天叟者遊處中央宇㤗定而發乎天光宇器宇也徳宇㤗然靜定則其所發者天光耳非人耀四如居士一日徑造主人叟杖藜應門子貢乗大車見原憲原憲華冠候履杖藜而應門顔色種噲曽子居衛緼袍無表顔色種噲註云刺錯也又盈虚不常之貌而眼如㸃漆晉杜佑眼如㸃漆妙處正在阿堵顧愷之曰傳神冩照正在阿堵謂眼也舉止寒澀若無甚技解音蟹然不言而四時之氣備晉書曰裒雖不言而四時之氣巳備坐良久沃三蕉葉東坡云吾少望酒杯而醉今亦能飲三蕉葉即蕉花之葉情浩浩笑云云飲罷薦茗商較一水兩水建安闘茶以水㾗耐久較勝負相去一水兩水居士曰昔叔度何如人並世者時月不見鄙吝復萌同郡人陳蕃周舉甞相謂曰云云或徃從之累日方還郭林宗莫議其將少間願聞此鄉之風叟曰春之朝縞花浄擢香入肌骨夏之日竹隂清閟門自可欵韓詩誰家多竹門可欵秋之月鮮鮮寒榮愈晩愈好冬之雪踈枝冷蘂怪怪竒竒此鄉之勝致也蓬茨盖屋桑樞牖室褐塞原憲居魯環堵之室茨以生草蓬户不完桑以歌為樞甕牖二室褐以為塞上漏下濕匡坐而弦門庭藩落皆着紙筆晋左思欲作三都賦搆思十年門庭藩落皆著紙筆遇得一句便書之一榻炷香人意幽逺堂上九十餘尊含飴弄孫飴未糖漢馬后曰含飴弄孫不能復闗政眉間漏出喜色伯仲如坡子瞻如潁子由夫婦如鴻梁如光孟此鄉之居室也架無多書古文六經外惟左氏語左丘明春秋傳䝉莊書莊子蒙人著南華真經馬遷史子雲𤣥淵明少陵詩昌黎柳州集不貯他物此鄉之簡素也湮罍沈鼎古器之遺遺欵墜刻古文之遺偶有流落人間者收於几按餘則無絃琴一陶淵明折脚鐺一古徳和尚向折脚鐺子煮飯吃老瓦盆一杜云田家瓦盆盛酒此鄉之器玩也暑被白練裙寒著百衲衣晉羊欣著白練裙唐裴休披百毳衲時捉蒲葵謝安扇擲塵尾塵麋屬尾能生風辟蝇蚋王衍揮玉柄麈尾善談老荘見晉史炊雕胡飯芝蔴也米黒宋玉玉賦炊雕胡之飯釀眞一酒東坡送菊苖虀山谷碾新茶薦以菊苖蘆菔鮓蘆菔菜名後漢更始傳洛陽宮女掘蘆菔根食之俗作蘿蔔白樂天齋劉禹錫作鮓以饋之此鄉之服食也或安山林内枕流漱石晋孫楚語枕流欲洗其耳漱石欲厲其齒不纓塵垢氛大鵬六月而有閒意荘子大鵬去以六月息者也蓋大鳥一去半嵗至天池而息或著富貴中一琴一鶴趙清獻入蜀旁無姬侍清規粹徳與雲俱潔或寓京師未嘗候公卿門人欲即之終不可即或浮湛音沉里閭同鷄豚社對田父飲坐深鄉黨敬韓詩云愿為同社人鷄豚晏春秋杜詩壮遊篇云坐深鄉黨敬日覺死生忙或遇儁人勝流飲酣論豪語古純孝貞烈從㬰尚友千載或恥狥財每生之失鵩賦云貪夫狥財品庻每生慷慨劇詆直欲不與同世胷中雖竟一紙識不肯讀人間非聖書李白不讀人間非聖書堯夫詩亦嘗有此語文雖未至小好大好韓云時時應事作俗語下筆令人慙及示人則以為好小慙以為小好大慙以為大好古氣可叅彖繫詩雖不能天然可愛口中時有稷契軰語碩膚几几之似周公威儀抑抑之似衛武侃如誾如襜如翼如似夫子手之舞之足之蹈之似孟軻陋巷簞瓢不改其樂似囘春莫舞雩浴沂詠歸似㸃道學自修盛德至善似參簡文温理似伋不屈其志不累其身夷惠之閒似蜀賢人或問李仲元揚子曰不屈其志不累其身在夷恵可否之間奚名之不彰也鼔有虞琴賡文王操優游高明似唐儒生韓文云有儒一生魁然其形抱琴而來鼔有虞之南方賡之以文王宣父之操優游夷愉廣厚高明追三代之遺音此鄉之老成人也居士曰入其國其教可知其為人也温柔敦厚深於詩疏通知逺深於書廣博易良深於樂恭儉莊敬深於禮見禮記經觧載孔子之言此鄉此人之謂與雖然願聞先生之風叟曰良如金玉重如丘山儀如鸞鳳氣如芝蘭知居士之所以為居士者此則知叟之所以為叟者亦此居士曰不知叟之為居士兮不知居士之為叟與相視一笑乃相與忘言乎此鄉之天退而書為韻鄉記天叟名淵與居士同姓同時人四如集巻二欽定四庫全書四如集巻三宋黄仲元撰䝉
