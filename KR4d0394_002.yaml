front:
  text: 有宋福建莆陽黃仲元四如先生文藁卷之二
  hash: sha256:7c6ac0713ebb69670968eeed49de237f6bfd2df1863c8f63b4a88a53d0f9f186
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0394_SBCK_002-1a}
body:
  text: 蒙古字學題名記序蒙古字學者何上之人所以逹書名于四方也是學也以韻起字非以字起韻韻耳學字眼學解二學字韻有經諱字有子母正未易精也學之所何莆地𥚹小以舊廣文館為之禮殿頖泮字宫居其左可以觀爼豆可以邇弦誦肅如也學之齋何齋有四曰同文者今天下書同文也曰正心者心正則筆正也曰升俊者升於學曰俊士也曰興賢者考其藝而興賢者也孰書之又孰名之翰林直學士雲溪張公也孰董之博士黃夢舉則行甫也學其學者誰國之貴遊子弟與秀才之能為士者餘五十員學是學者復其身設科為最優藏於斯修於斯學記曰藏焉修焉時教必有正業母茍免學是學者必以時術業然後專用而志凝而神母自欺口試宜熟墨試宜精日課宜密月課宜最皆説字學之要法尚書御史實繇兹選漢蕭何草律著法曰試以六體課最者以為尚書御史徴令而比試也之勸戒而紏之必有籍雖然字藝也學道也無藝無道無道無藝古人小學教以六書形聲假借一一皆理六經中有竒字有俗字有讀如某字有平音有側音又讀如某音而一字或該𢾗義君子之道孰先孰後藝云乎哉此説字學皆道裘點之語語也魯薛之令令也裘點之旅語魯薛之令弟子詳見莆田廟學記告而諸生字字從子謂字之字從子也學字從子學之字亦從子也事父母則為人子必孝侍先生則為弟子必恭循天理則為君子必義孝者恭者義者皆籍非斯人者勿籍此二句應上必有籍句題漫翁林春山草韻序歲辛已冬十月漫翁草韻成漢黃門令史史斿作急就章解散隸體粗書之謂之行草出示黃淵天叟開卷詭韻書作佹然蔚然似清臞似峭徑實精密實妙巧盤蹙回幹字字中度叟曰何不書急就司馬相如亦作急就章韻即廣韻中一東等韻計二百有六何不作文選文選周河潔所集公孫龍口呿而不合舌舉而不下乃逸而走翁曰隨人作計恐終後人叟又試翁平上去入字凡若干與若干韻翁應聲答韻二百有六字一萬七百有竒世間萬書橫寫竪寫詞人墨客長歌短歌盡在箇裏叟服翁敏口呿音﨑而退又一年翁序引成來徵叟文諾未上藁又一年翁索叟逋不還曰逋叟乃語翁書六藝之一形聲六書之一藝也六書一象形二會意三諧聲四指事五假借六轉注有道焉習之童丱皆能不習老宿亦難俗之趨科斗散軼易為篆隸蒼頡觀鳥迹而成字周史籕變科斗為大篆李斯取籕省文為小篆秦事多用篆難成程邈徴中改籕文省為隸字草書之變乃始秦末一假氣之殊風土不同操反聲音亦異切韻之學來自西北一假世有秦有周而字書不能少異乎秦地有東西有南北而韻學不能不祖西北一假漢以來至于今皆然前乎此識古文惟一楊雄楊雄作訓篡嗣續蒼頡中重之字凡八十九章後人大類矇瞍然一法通萬法變草雖便急速視壁藏猶倣佛萬分之一一魯共假王壞孔子舊宅得壁中尚書論語孝經山堂皆科斗文字前乎此識古韻惟一韓愈後人如調啞鍾然一音通百音叶韻雖約以四聲視傍韻四聲平上去入皆可出入一假翁雖後千年生於草書猶可以想禽獸蟲魚草木之群態與雷霆風雨山雲之萬狀而意在筆前筆隨興到説草字於韻書猶得因翕闢清濁之異翕闢如開口合口撮唇開唇躘舌垂舌等十四聲是清濁四聲各有輕清重濁縱橫經緯之妙别字義訓讀之名字義訓讀即訓詁杜林有蒼頡訓詁李斯三倉訓詁而醉後入吟吟時入腔説用韻草韻之所以作與此句總𬋩昔曹景宗不解書又不喜問卒以意造晉帖操多作摻百寫類七時師惟不曉音故不識字當走筆時波戈點畫豈能一如古法鍾繇弟子宋翌每畫一波三折筆作一戈如百鈎拏作一點如高峯墜石作一牽如百歲枯藤作一放縱如驚蛇入草草韻所以作與一假叟又嘗考漢𥘉蕭何草書著其法日太史試學童能諷誦也書九千字以上乃得為史是時未有韻書所諷者何抑蒼頡爰歷博學章歟又試六體六體即古文竒字篆書隸書繆書蟲書課最者以為尚書御史史書令史乃皆古文竒字古文即蒼頡所作繆書即摹印漢興諸草書不知作者姓名至章帝有杜伯度崔璩崔實稱工張伯英轉精巧張芝晉人工草書號書聖篆隸繆蟲古文竒字篆隸繆蟲即六體又不教以草書何也或秦草未落人間與翁此書與篆隸韻並行恐與漢𥘉不合翁曰第書之以俟後身張芝魏張芝善草書嘗臨池學書池水盡黑時稱曰張芝筆叟乃筆翁問答于集端峕癸未臯月端午爾雅五月為臯鄭雲我存藁序唐人語言竗天下者莫若韓柳氏韓以李漢一序傳柳以劉賔客禹錫一序傳二序之所以傳者序乎文也文者天地之正氣亦天地之竒氣天地間惟正人能養天地之正氣故其文正韓氏似之惟竒人能發天地之竒氣故其文竒柳氏似之柳之醇正固不及韓柳之竒崛亦韓所不及天對文義聲牙難讀山水諸記出語崔嵬似宭音昆居也邊幅若假大秀尉實逸事狀老史筆當避三舍晉問峭拔高妙敻出魏晉南澗田家等詩絶有泉明風味以上皆柳文回視淮西碑中丞張巡官中丞傅後敘鰐魚文毛頴傳南溪秋懷以上韓文前後差相頡音纈頏音杭其與韋中立書論作文源委一一有所自來柳殆如答李翔與誨館下諸生時韓政未可少柳而多韓韓亦正患不能竒柳亦正未易步趍也公文酷似柳故甚取柳以韓不及柳之竒也吾友雲我芳年韶妍凌霄一武譎墮人間嘆滄海之為桑田醉六經而營四海於易獨論筮變占以測天機之乘除於史專論漢蜀晉以閲人世之新故於人則論箕子子車以明道統之絶續韻語掀鼉倒鯨散上聲語峭崖怪石對語爭氷擲戟𥿄上皆見音現光怪前無俗人號文章家余嘗以雲喻雲之文或如玉葉或如氷紋或如車蓋或如魚鱗千態層層萬狀紛紛不能皆長空萬里一匹如練也而行者行止者止去自去留自留此雲之所以為雲而雲我之所以為文也未知雲我悟入得之韓歟得之柳歟正乎竒哉竒乎正哉豫猶省童丱時君家世父伯父日世父方叔以書贄迂齋樓公問古文法樓復書曰學古文難識古文滋難子讀世本國語戰國䇿否又讀易爻辭書盤誥禮檀弓內則否方叔早年文聲儠儠音獵説文長貌氣吞學館惜其人與可傳者不得而見見方叔猶子雲我亦竒人也文惡乎而不竒韓柳而上更有人在雲我文豪未已方將余無一毫可論序何可傳然雲我之文傳余之序亦傳余之序傳雲我之文必傳載之末年附之青雲又一竒事余名淵天叟字雲我中外表序敢辭鄭雲我孔子年譜敘夫子儒之祖也儒而不知譜其祖恐如晉公之不知以并官氏對矣夫子生於魯襄二十二年而公榖書於前一年年已非月亦訛左氏又不書三家胥失之譜夫子惟司馬遷之史徴世家年表多相乖忤然於魯書夫子本末最詳深矣乎惜乎史遷亦未修之史也後乎此編年有書東家雜記有書今鄭君又有譜是譜也首以聊大夫二事壓卷前書之所未有謂儀封人請見為由魯適衛時謂魯公問政及答季康子數問皆歸魯以來事此見又確謂夫子未嘗師郯子謂行乎季孫三月不違斯言非知夫子者此論又高雖然吾十有五而志于學一章此吾夫子自作行狀以㒒觀之留而殿在後曰殿於卷之左方鄭君曰何如講春秋序談經難談春秋尤難高妙者誕幽深者晦新竒者巧皆非也記經解公羊榖梁春秋石經各有傳記左氏經杜預顔師古注謂之經解雖非孔子語屬辭比事直勘得破孟子事文義三語即孟子其事則齊桓晉文三語一大斷案汗漫如莊周只把道名分説最直截馬遷謂子夏之徒不能贊一辭不待贊也諸儒之説出其辭費矣費則差差則害道徐曠發題曠字文逺唐高祖幸國學文遠發春秋題論難風生隨方占對莫能屈偏舉先儒異論分别是非乃出已意折衷不知合乎夫子也否孫莘老與一時名勝為經社雖不主一人之臆説其間卓然獨見者為誰胡旦編年先經後傳柳仲塗欲贈一劔意尊經也程伊川𥘉令門人劉質夫作傳後來却又親筆未知何以窺聖人用心胡文定潛心三十年而傳始成夏時冠周月之論至今可疑朱晦庵從諸先生長者聞春秋義例終不敢措辭獨於大論大法為有感焉陳止齋欲著後傳於諸生中擇能誦者一人自隨似不草草謂書王存周正未免又落科􅍫林艾軒主春秋無褒然大虛即六經若何而求春秋鄭夾漈曰春秋者先後倫理之書而謂春秋意出魯史非出於仲尼殊不可曉信矣春秋未易談也某老矣無聞舊讀遺忘兹辱朋友願相磋磨仰觀天道俯察人事欲以春秋溫習何如又嘗聞網山麥斜開福清林清之學可號網山有網山集麥斜仙逰僧岩名講衆以春秋請山曰經未可遽言當自傳始舍經讀傳恐不就綱領處看敢質諸同志曰可淵時乎此當繹所聞以求是正通志序代憲使孫澤山川出雲開必先也屋壁科斗藏有待也曷先乎人先時而巳生曷待乎書待時而後出宇宙趍新主上右文崇儒以道化風四方東宫濬哲仁孝以好學聞天下氣數清明之會光嶽賢哲之盛書於是時與人相值時乎人也莆夾漈鄭先生著二十略外取歷代史稡音卒為一書命曰通志某舊守莆求而未獲今兹省椽王某奉命求書郡國是志與在數中鹽使方公出所寫本以授書于帥府憲臺喜劇敦請博古之士鄭鉞陳子修刋謬正訛某適弭節音彌左氏左執鞭弭弓不以骨節曰弭八閩從臾音縱甬兹事晦者明隱者彰亦此書之當出歟書乎書乎昔炬於咸陽文獻通考曰秦皇馭宇吞滅諸侯先王墳籍掃地皆盡此炬於咸陽也咸陽秦都至漢而後置寫書之官孝武世建藏書之䇿置寫書之官下及諸子傳説皆充祕府覆於底柱唐平隋王世充得隋舊書八千餘卷太府卿宋遵貴監運東都浮州泝河以致京師經砥柱舟覆盡亡其書至唐而後完庋音鬼書之目通考曰經史子集而藏書之盛莫盛於開元其著録者五萬三千九百一十五卷而唐之學者自為書者又二萬八千四百六十九卷則遺書之出信有時邪時乎時今其時乎人乎人上而甲觀次而翰林集賢國史院又次而行省帥憲二府非人孰能致之夾漈先生多子長司馬遷之愛聮比詮次於前鄭陳二士以更生即劉向之才校讎緝綴於後某於是賀此書之遭且知二士用心之苦遂書于集之右方年月日某官孫澤敘忍經輯要後敘忍之義二忍於我則律已之嚴不忍則忿不能懲欲不能窒矣忍於物則待人之恕不忍則疾之已甚亂也克已復禮忍於我也犯而不校忍於物也顔氏之子蓋兩得之子畏匡則曰其如豫何壤也夷踞則以杖叩脛來幾日見長者則責以餔啜謂從者為竊則於業屨不怒孔孟於此或忍或不忍自有權度下之世此義不明避兄離母者豈為能充其類乎簞豆不得見於色者又不若好名之人也無它矢人豈不仁於函人惟無是非之心故無惻隱之心此忍經輯要所以為世戒也深且切矣其餘夷白鄭叟詳言之李氏家集敘河東貟嶠李侯倜之大父某父某國𥘉之勞臣也然亦仁知人也度别分也合之機乘事勢之會識權變之宜使玄黃者簞壼者侯服以附厥角稽首此豈孱夫弱子所能了在韓村則一邑之旄倪活在交城則三寺之黔黎活參陪行省轉輸蜀道則四川之兵民活是心所以不忍者何惻懚之心也它謀臣䇿士懷雲起龍驤晉王濬拜龍驤將軍伐吳之想二父尚可為而不為未可已而中已盡蹇之節有豫之戒商羊乎家居嘯詠乎犀浦李所居之地水名上之人難強以仕則暗合於道所養可知矣天嗇之齡或僅止下夀五十為下夀或未登五十羅江北去之異又其昭明焄蒿之著也二父之勞之仁之智如此為子若孫論撰先祖德善功烈慶賞聲名於記有之侯所以自狀其大父行義年而請名於當世通顯者侯之父則宋某也銘二父姚某也趙某也傳二父者劉某序犀浦遐觀者劉某也具見集中侯若曰人生東西南北不常味人善於齒牙者極不過數十年歇矣銘藏諸幽集傳諸逺庶不沒沒同煙雲變滅然後可以成二父之令名侯之思深矣侯之孝賢矣侯前集賢侍讀學士今中大夫南劔路總管莆四如老叟黃淵覽侯斯文欽誦舊德張中丞傳後敘張中丞張巡也李翰為傳韓愈為後序以輔其闕文載韓集假太尉逸事狀太尉假逸為涇州刺史柳子厚為之事狀文見柳集筆法亦不是過侯差可與韓吏部柳貟外比肩矣於是為侯序於集之右方時至大已酉良月十月曰良月見左氏𥘉吉姚野庵詩解敘心活動物也詩亦活動物也豈可以言語求哉惟不説者為上夫子絃歌而取三百十有一篇斷之以思無邪一語即詩論詩它無文字洙泗言詩特子貢子夏見於魯論耳齊魯韓毛四家出魯申培公齊袁固生燕大傅韓嬰趙博士毛公傳興而經廢矣序文不知果誰所作毛萇於序猶無所與鄭康成惟序是信叔世講師又出入毛鄭間眇跛相迓笑者孩之雖然語去聲𥘉學者不為詁釋彼豈知或大或小或博或約或顯或晦或抑或揚之妙此野庵詩解所以作也是解也參之李迂仲訂之張敬夫序之可者從之否則正之謂風雅頌皆始於文王謂風關雎鵲巢乃應其聲謂二雅聲有大小非政有大小謂王風乃王城之聲謂國風無變風二雅無變雅談詩只消如此平易野庵姚姓某名某字玉融之韶溪人表兄陳可山序昔人以山號者多然俱不過因其居焉名無擇焉近世有曰此山曰亦山曰自山於名擇矣或所居非山而名軒與庭又皆取可之義今吾力行新築一室扁以可山雖因其居名義亦兩得之吾仲弼古弼字序謂可山取退之盤谷序語而首尾以不一到為嘆如退之新修滕王閣記止五百五字篇終寄不盡意於言外也吾力行乃又求一語於余余非子由豈解作賦使坡兄歎服然不盡之意余尚能為可山言之可止可仕吾仲弼謂善學者學孔子不知子謂仁者可以久處約可以長處樂則止而約仕而樂惟體仁而盡性者安之何者山水外物之可樂者爾非真樂也真樂之所寓而巳來者為其景而用其樂可山蓋用其景以寓其樂者也用其樂者山水之可樂者盡則寂寥之態生非山水能使人寂寥也其所以樂山水者偽故爾寓其樂者山水之樂在性之樂亦在性之樂與外物之可樂者相為感發適然有契則好樂之所形在我而不在彼也然則可山之寓其樂於山其得夫子之仁歟語曰仁者樂山可山仁者也故自山而觀之峩峩其高者皆􅎍中之故物反而求之巍巍其中者亦雄峙之形著寂然不動者俱乎其靜也屹然獨立者同乎其夀也禽鳥之和鳴松柏之茂恱又與之均乎生息也仁根於性山觸於目四時有以契吾可山之樂則以我之可對彼之可而樂之自不能巳也惟吾可山不知山之為仁仁之為山故時之可止於此山而處約可也時之可仕於此山而處樂亦可也真孔子之所謂無可無不可此可山之所以名可顔回善學孔子者用行舍藏夫子亦惟謂顔子而可而農山之顚景山之趾似不容屑屑乎其遊者回之志願至此呈露蓋亦自其心三月不違仁者得之耳吾仲弼勉可山以學孔子之可余獨許吾可山以顔子之仁顔子之仁師吾夫子之仁也故有問吾可山於余者余必以是對雖未登可山之山而山已在仁中矣雖然可山之下有溪焉則水亦知者樂也吾可山何不以適類於余而名是溪曰可溪也蓋吾可山願有仁之名不願有知之名此溪所以因其居曰䂬溪而不敢以名可若夫見仁謂之仁見智謂之智可山自領會於􅎍次難與俗人言也昔老泉作木假山記猶謂魁岸踞肆意氣端重莊栗刻峭凛乎不可犯而岌然決無阿附意其可敬也夫其可以有所感也夫則吾於可山之山其不曰可山其可敬也夫其可以有所感也夫可山其必印可是年重陽後一日為兄可山再序送歐陽臣夫序斯文於宇宙間前水後水古今相續何嘗一息頃不行哉堯舜禹湯文武周公不作與斯文者吾夫子當在人世時困悴無聊嘗十八九雖繩樞甕牗中道必行逮去人間久天下像而祠之如前昨日道之行如前昨日人事覆却萬方州縣學廢亦嘗十八九春秋祠遂俱廢而逢掖者道吾夫子仁義忠信如取諸左右材父兄猶以吾夫子書詔子弟矧坐講肆於馬隊時邪學不學祠不祠不論夫子之道水之在地中也六學缺伏機發新豐坑儒處縣名絶儒履迹此時猶有挾經為博士者秦始皇於坑谷為伏機諸生至因發機填之坑六藝從此缺陳涉為王魯諸儒持孔子禮器往歸之於是孔甲為涉博士金甲排蕩青襟憔悴誰復知爼豆事衡山聞讀書聲便有西河風味杜工部題衡山縣文宣廟新學詩旄頭慧紫微無復爼豆事金甲相排蕩青襟一憔悴又云耳聞讀書聲殺伐災髣佛南紀改波闌西河共風味史記子夏居西河教授為魏文侯師共風味者言人樂其教也人以為夫子之道不行廢興絶續存乎人如何爾遊洋舊學在縣之震東方學幾圯獨吾夫子祠在風雨所逼丁丑夏燬于盜董學者熙熙來壤壤往縱掃地而奠夫子猶不歆止假無官官之事無事事之心夫子臨而炙之乎求夫子顧非寢宫偶像非殿廬無以栖神明求斯文顧非庠序圗書非齋廡無以寓絃歌又非必肖堯顙禹要即腰字臯陶頂子産肩竒竒怪怪使人號為聖且異然後為吾夫子又非必學老子浮圖法金碧綺繡光炯凌亂張皇尊嚴然後為其道行邑必有學學必有廟廢者必興絶者必續然後為職思其居職思其憂二句出詩唐風遊洋士汪汪也又毋曰十室之邑不如吾夫子之好學此事姑少須君四門裔孫拔君子林居諸生上蓋有志斯文者此行朋儕觴之詩之或授首簡俾余莊之余故勉之異時立石廟門又當為君書之卯年辰月戍日東里四如居士黃仲元敘送術者龜峯序龜峯一日叩音口擊也戶訪叟劇談周禮云凡四方之賔客叩關輾音展然笑曰天下惟儒者為知五行非儒不知也人者五行之端禮運六言禮運言人者天地之心也五行之端也食味别聲𬒳色而生者也老宿或道不出木神則仁火神則禮東方春木於人五常仁也南方夏火禮也出漢書天文志正義中語俗師有不經眼數七數八誰不讀呂令問之獨陽不生獨隂不成則昧其來處天時地利誰不誦軻書詰之一畫為孤無畫為虗則茫然莫對五勝生一五壯終九不知祖於淮南子甲丙戊庚壬子為之夲不知原於管夷吾水準木觸火化金禁土吐甲已九丁壬六丙辛七戊癸五已亥四此皆出於漢諸儒之口言天者求之氣言地者求之位俱不離勝復去化出入升降之竗素問一書最為精密謂談五行非儒家事惡可乎叟亦口呿徐發一難五行化真前修嘗言之已六甲納音海中天上此為何義或曰一三五七九其數或曰一二三四五其聲峯將何從峯白此即十二律還相為宫也叟唯唯又送一難九疇一曰水以下箕子文也此千萬世五行之本領儒家之嗣適七篇見知聞知之論言太公望散宜生而不及箕子者何峯曰夫子定書洪範專為武王箕子設七篇於是乎略叟起曰峯儒而博學者它人不知峯者也峯獨五行乎哉峯曰叟知音者吾今賀吾之遭矣序贈吳丹陽丹陽吳兄某富沙人精於課易扣之則曰易占卜之書昔人以蔭叢蓍千齡蔡卜之占之余用錢卜重交單拆蓋出儀禮疏非講師説且簡易也課外工拆字扣之又曰昔人謂日月為易此拆字之祖日月以隂陽論余以五行論字外工星數扣之又曰易於七十二候始中終卦俱與經宿合談易而不知星辰之逺可坐而致惡惡可然吾夫子引易不恆其德或承之羞曰不占而已矣易非專用占也蜀趙賔以箕子為荄茲賔為易論易文以為箕子明夷隂陽氣亡箕子荄兹者萬物方荄兹也荄兹言其根荄方兹盛也賔妄説箕子字於字何義楊雄太玄參太𥘉曆論休咎而出處語默之義則未之知末矣丹陽客莆將歸寓士交贐以詩余不能詩且不能易唯大書一時字於卷之左時即易也數也年月日大德丙午秋社戊申四如老叟黃淵七十六歲作贈楊愚谷序愚鄙人之稱非聰明者所宜谷山人之居非市㕓者所宜以山人而隱市㕓叟知子有不獲已者矣以聰明而學鄙人叟於子又有不獲已者矣昔猶有續命田今也磽瘠幾何昔猶有止啼錢今也分釐亡有山雖深無樹可以挂許由之瓢許由人遺一瓢挂之樹上風吹瀝瀝有聲以為煩去性雖逹無帳可以讀玉充之書蔡雍人疑其得異書搜其帳中果得王充論衡子所以有不獲巳而又不獲巳者也二不獲巳而資人以果其腹子又大不獲已者矣遊成都市日得百錢君平賣卜成都日得百錢足百則閉戶下簾讀老子子之計固未為左人世逼仄有卜賣天津橋者天聖末處士錢知微至洛遂榜天津橋柱賣卜一卦帛十匹子之術胡為而神谷曰愚不能皆願中也十不失六七爾叟曰谷不愚矣但自信其學勿視人而二三何門不可拽裾鄒陽既出獄而上客文辦著名長𥚑曳王門送林理齋序友人理齋林兄謁叟有行色叟叩奚之曰之清源叟曰吉一而已動可不愼乎叟為熏沐命筮遇蒙坎下艮上之旅艮下離上蓋蒙二三四爻俱變也筮法占本卦及之卦繇辭蒙以內卦為主其繇曰蒙亨童蒙求我利貞旅以外卦為主其繇曰旅小亨旅貞吉蒙有亨之理所以亨者我發之也然必求者之意專然後應者之意亦專旅寡助之至所以亨者處之有道也時非我所能為義者我所當盡雖然決疑者蒙不貞何以筮人方致精誠以求於我我當視可否以應乎彼與子言孝與臣言忠然後貞嚴君平賣卜成都依龜筮為言與子言依于孝與臣言依于忠逆境者旅不貞何以安高亢而與物無偶則絶物非暗而所比匪人則失巳或可為主或不可主可久則久可速則速然後貞孟子之去齊滕夫子之客宋衛善用易者也用即理理即用亨者其用貞者其理果貞矣蒙以亨乎人旅以亨乎我有不動動斯吉遂書以贈其行郡人韻鄉黃淵天叟春臺易圖敘理者太虗之實義𢾗者太虗之定分未形之𥘉因理而有𢾗因𢾗而有象既形之後因象而推𢾗因𢾗以推理論理遺𢾗惡惡可此朱文公啓蒙所以作也文公易得於康節邵先生為多春臺黃君之圖又啓蒙之義疏辨析精密神智盡在是矣譬如枝頭樹底一一見花活處不止簷頭看賣桃杏豈心猛氣粗者所能了了然竊有疑戴九履一之象圓五行生成之象方安知邵不以九為圖十為書乎圖書自圖書大衍自大衍以圖書而合大衍拘矣天地定位此八卦立圖帝出乎震此八卦舒圖或以前為羲後為文失之邵觀物吟乾遇巽時地逄雷處天根月窟來往都春此解先天圓圖大易吟否泰咸損恆益既未四象相友成六十四此解先天方圖不止乾一坤八也𢾗往者順知來者逆謂天地山澤風雷水火此已往之象知來者逆謂曰雷曰日曰兊而乾以君之曰風曰雨曰艮而坤以藏之此方來之事以左為順以右為逆然乎不也九十九者蓍之體𢾗用四十九者以其圜而神也或以五行言之何哉歲月易邁義理無盡長江浩溔音查浩溔水無際也欲遡從之邈不可即何時一樽與吾春臺細論此事為快敬書右方以答來辱大德丁未清明莆四如老人黃某七十七筆也忍經敘臯陶明刑而曰好生之德洽于民心孟侯義殺而曰若保赤子惟民其康乂蓋刑者君子之盡心有當忍者有所不忍者當忍者豈仁人之得已不忍者乃仁人之本意我廉使懶齋孫公職司風憲於哀矜庶戮之時寓慈祥惻怛之實比出忍經示寮寀椽史與閩惟多士意在言外刑故無小是當忍者罪疑惟輕所不忍也不孝不友刑無赦是當忍者無或劓刵人所不忍也孟侯臯陶之心即我公之心此忍經之所以作歟吁陽氣噓而靡草死於夏靡草草之枝葉靡細者生於至隂故孟夏陽月隂盛則死雨露之中乃有至忍隂氣吸而荔挺出於冬荔挺香草也凡物之氣感陽者香仲冬之月陽方長矣故出霜雪之後有所不忍天道且然况人其代天工者乎曰辟勿辟曰宥勿宥隂陽生殺時措之宜孰知我公之用心莆後學四如黃淵敢僣為公敘於篇端題宋蜀翁北遊詩卷後僕莆士也壯年客遊江浙雖吳門姑蘇京口毗陵苕音迢霅音二水噤吳興亦不能買舟縱觀况淮以北乎猶記樞相陸實翁酒邊談維揚事悲歌慷慨令人淚墮言之夢矣大德壬寅郡博士宋蜀翁來踰期月示僕北遊詩卷然後知閲人世之險與求功名之難遇欣感戚或笑或吁寄興深逺似沖淡實壯烈而京師桂玉之地借書溫故豈易易得日日楊花家家芍藥春夏之景自佳狂颷早雪莆簾土炕北南之氣或異惜僕老矣前乎此不能奔車從蜀翁後然召伯之坊猶昨九鼓之石亡恙此又僕畜眼之未見暇日蜀翁黨緝御劇話不猶勝於登峰造極也詩卷妄意朱筆數聮幸母曰此老僣且繆小寒已已日韻鄉四如居士黃淵書于卷之左方題黃耕叟存藁時文小技耳然試之中否係乎文之工拙吾宗耕叟賦瀏亮論朗暢䇿明整而前軍尤萃其良不試則巳試則願中政未可以技小之雖然文謂之時與其高下時之春麗澤百篇一變也時之夏精騎再變也時之秋濯錦三變也逮秋而冬變之極則為已效體矣天運回旋冬轉而春安知不復變而為麗澤百篇乎變而麗澤百篇猶有老成人端章甫氣象變而為唐明水披沙揀金則如囊沙背水非老將不能吾耕叟燈窗課兒試拾一二篇何如庶異時可籍此為行卷跋方石巖正通庸言石巖此書中庸之義疏也以正通合庸而並言者何君子之道唯中故庸天下之理唯正故通中者其體正者其用庸則有常通則無弊但曰正通而不言庸恐不知言者以為竒但言庸而不曰正通恐不知言者以為俗所以合正通與庸而並言也或曰是言也又加中庸二章者何叟曰言豈若是其規規然巖書末章評史最有深意春秋一經猶權於衡故百世以俟聖人而不惑馬遷好竒是非多謬况遷而下叟喜巖之善於立言也不顯言之而微言之知者自知不知者自不知吁無黨無偏者蕩蕩平平之道詖淫邪遁者蔽陷離窮之失甚矣言之未易立也亦甚矣言之未易知也巖善於立言叟何足以知之劉畏獨答問前進士劉姓肩吾名畏獨其號也閩人韻鄉黃淵天叟字莆人有筆硯之雅一日韻鄉問畏獨之説於畏獨畏獨曰愼獨二字自中庸大學始愼者畏也獨者我也中庸言見隱顯微於愼獨之先示之以當畏大學言視指其嚴於愼獨之後甚之以可畏韻鄉曰所當畏所可畏者何畏獨曰理是已理即天之所賦於我者也無物不有無時不在天下之至當畏與至可畏者莫如理我之為我毫釐或悖乎理則不足以言人故吾夫子曰畏天命輿思之學其有自來乎韻鄉曰是獨也人人之所謂獨必曰君子愼其獨者何畏獨曰小人不知畏天命故中慙者掩其不善自肆者無所忌憚君子知天之所以與我者甚重故內省不疚於潛雖伏矣之地誠母自欺於惡惡好好之時韻鄉曰暗室屋漏慎則慎矣造次顛沛則如之何畏獨曰易天命之書也素履獨行中行獨復若指所居之地言日用之常而下係三言九卦正教學易者以處憂患德吾德也夫豈易自易我自我哉九卦隂陽自乾坤來乾至健而恆易以知險坤至順而恆簡以知阻物有情偽吾無作為吾惟知間邪存誠而已吾惟知終日乾乾夕惕若而已吾惟知敬以直內而已吾惟知括囊無咎無譽而巳善觀人情世變者莫如詩善言天命者亦莫如詩平居暇日上帝臨女小心翼翼如護元氣而及爾出王及爾遊衍無曰不顯莫豫云覯不愧于人不畏于天局高蹐厚臨深履薄如集于木如臨于谷多於變雅見之亦謂窮通之序如寒如暑世故之來如風如雨明理逹變者一付之自然而仁人事天孝子誠身如執玉如奉盈如弗勝如將失之則不順逆異其境哀樂二其心也韻鄉曰言愼獨必言中庸大學吾畏獨又言詩言易者何畏獨曰恐懼憂患人不能無大學曰不可使吾心之不正貧賤患難或所不免中庸曰不可失吾身之正鵠曰心曰身即畏吾獨詩也易也大學也中庸也無二理也韻鄉曰畏塗者畏塗者十殺一人則父子兄弟相戒出莊子父子兄弟相戒而後出袵席之上至可畏也人不知戒獨行不愧影獨寢不愧衾此事大難君子必慎其獨畏獨憮然曰我輩讀書理會何事命之矣遂筆其語為畏獨答問有宋福建莆陽黃仲元四如先生文藁卷二吳大綸寫
