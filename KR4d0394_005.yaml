front:
  text: 有宋福建莆陽黃仲元四如先生文藁卷全
  hash: sha256:2ab6c3aea5f263f0421b7601e84f1a695832ea80f4e1bbd283df81295e08d30d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0394_SBCK_005-1a}
body:
  text: 上江古心先生書古者士之摰雉若見於師以菜為摰曷為或以雉或以菜雉言介也菜言潔也士不介不潔不敢見然士之見於周公者十人三十人百餘人千餘人何多周公於十人三十人百餘人千餘人中僅得三士何少周之士俱自好亦遊大人以成名乎公好士如不及亦為之厚薄貌乎舍三士他無人乎漢不古摯禮廢掃門者艱於一見不嫁者禮之上賔魏勃掃曹相國門以求見蒯通見曹相國曰婦有夫死三日嫁者有幽居不嫁者求婦何取曰不嫁者通曰求臣亦猶是東郭先生梁石君齊隱居不嫁願禮之相國皆以為上賔宰天下士者必有所擇唐之士摰以文貴之甚賤之甚以古文倡者光範之伏其氣餒釋言之辨其辭費芻米㒒賃之急其得小不免為今之人我朝諸賢犖犖音落可外文字猶用片言摯於王公矧碌碌者疇能自異然則某固願聞名於將命者何也古心先生一代不數人百年能幾見者也某生長東南非不知有伯淳范祖禹謂顔子不二過惟伯淳能之時陳瑩中不識伯淳作責沈文以自責雲山塹隔伏謁無路今詣康廬登龍門矣然與其相羊於某丘某水先生舊所釣遊之處使人意遐而清不若侍坐於書冊琴瑟之前得見宗廟百官之富崑崙在望滄海在前而猶不即猶空此生如獲一見相國矣將與四方竒士交譽盛德歟某言呐音訥辭柮音咄政不能譽縱譽之一把泰山不加益國憂如髮士低如鼠李斯少時見厠中鼠食不潔近六人數驚倉中鼠居大廡不見人大憂嘆曰人之賢不肖如鼠矣時人之耳目在先生公論之標表在先生世道之輕重天下之安危在先生九州四海孰不期先生之再提一筆入福蒼生也大臣身在江湖心在魏闕一處一出與隂陽相為消長亦必有道又非兒童走卒之所能知前修偉人魏野一詩獨勸子明王旦字以退明允一書獨愛富公以德某也始見安敢輕浮作此躁語將謂孫家同榜子弟當以禮拜沂公歟寒門落落望雲霄閥如梯天政不敢自陳家世事分於相國也將謂文潜客於少公文潜張菜也少公頴濵也文潜淮隂人與朝秦黃吳四先生並從東坡逰張初遊學於陳學官轍愛之因軾亦深知而稱其一唱三嘆亦當與眺秦黃學士師事長公歟眺𥙷之秦觀黃廷堅東坡長公憔悴視姬姜自覺形穢政不敢居參門館下士於相國也否則以所業徹於相國歟某生為人又為丈夫固不可與空生物穢天壤間然書可成也仲塗十年一書不遽語之門人程易傳最晚出且謂說得七分史可修也唐鑑多有好處亟戒開封毁板新唐書經歐宋名筆猶無一毫前漢義理微密工夫浩大二事俱難草草文可工也語言妙天下者讀同列一疏乃遂不復自為人目為夫子者作六經閣記終不可主公意詩可學也建安黃初暨晚唐幾千百家獨子美不可擬議江西宗派吕居仁以歌詩至豫章大出而學者同作共和録其名曰江西宗派以其源流皆出豫章也陳無已以下凡十四人傳衣付鉢范質舉進士主文和疑曰屈君十三欲傳老夫衣鉢也不如西湖處士以水影月香一聮行世茍焉引筆行墨髣茀聲嗽恐非當行家非不欲為之不敢易為也就為之如北方竫人見者齒矧山海經云東海之外有小人名曰竫人列子書今之世惟古心先生傳逺之書名世之史金石之文絃歌之詩與易詩書禮樂春秋等不知可與陳無已盡言否某願執經焉又否則見相國當談政事不談文學歟某謂六經四書言言是理言言是用一部論語趙普後先可事兩朝正心誠意四字朱子中塗可持告君彼行河之禹貢復讎之春秋傷財害民之國服為息國服謂生民於國所服之間農圃類也息者保之使生息也出周禮泉府王安石謬引注疏以息為利息而行青苗之法惟讀錯故用錯讀書正要有用書亦正未易讀冠仕冠棄壯仕壯棄某則不敢一行試吏成公吕氏之官針西山真氏之政經一一可以為訓若臨大事當于六一翁處學來今之世惟古心先生清忠粹德豐功盛烈載旗常銘鼎彛與皋伊傅吕周召並不知可與蘇子言容平生本末否某願問為邦焉然則某之來無所摰而敢見乎曰不介不潔不敢見某於道之秋毫百未得一然某之學傳於先君子績先君子傳于瓜山潘柄復齊陳宓復齊瓜山親傳文公勉齊之學者也學孰大立身行已為大時若命謀位與材㑹不憂不通顯欲得汗青一幅芬芳百世則實難難故脫凡近志高明陋希世友千古居於家凛凛乎如處女之在閨處於鄉兢兢乎如懷千金之璧而行不待謁刺飾游聲人故識靣者少不作一皺眉事亦不受人指點以廷對見君父第一步直透剛腸所欲言者一落千丈無戚容以一命之士皆可行志求為步兵而歸粗冗淹速不屑意人或朝得軒裳暮馳奔車之上乃獨退然􅖏戶與孔門冠童者遊􅖏徒古切塞也人或倚一郡為北道主人鄧晨為常山守王郎反光武走信都晨請從光武曰從我不如以一郡為北道主人乃歸邵竊竊焉爼豆從事之列乃獨謝以為煩願從子弟尋劉公父子讀書處則某之所存亦少異乎人也昔黃叔度之賢無一見於外而林宗重之李仲元蜀人不持一字於楊雄之門而法言書之淆之不濁者其志潔林宗逰汝南往從憲纍方還曰叔度汪汪千頃陂澄之不清淆之不濁不可量也不屈不纍其行介故可重可書今有人焉氏名與二子同志行與二子同古崖既取之於驪黃牝牡之外矣古心先生天眼一盻儻歆然曰若士也為子必孝為臣必忠必不讀父書而敗趙括必不游師門而叛必不兩來張師德必不三變商君帝王伯商君始說孝公以帝道不聽又以王道不入終以伯道公與語不自知膝之前席也進而教之又幸也仰惟古心先生之心先知覺後知先覺覺後覺之心也巳欲立而立人巳欲逹而逹人之心也此心流行天地並生物我同體相國之門未有一人不為道周德全之士豈但薦藉華寵其身哉某故願先生輔之翼之振德之某之挈挈而來也思拜羽儀如渴如飢五步十步盤紆樊中修摰師門又何遲也若曰子來幾日然後求見長者則克之罪大若曰彼亦人耳傲將何求則愈之過小恃此無恐先生儻與其介也潔也某敢不立雪以請惟先生亮之有宋莆陽黃四如先生考終東里黃族祭文則陽四七維公初度綵闈洗腆致用清酤豈伊異人耋少和儒公於是時蒸衎樂胥促席鳴儔咏猶斯舞油油三爵燦燦霞炬筵空坐散醉極而窹謂公徥福百齡未暮後騎勿驅前山可數暢月生明陽回一縷訝公不庭鼾睡卓午翼旦候公琅琅耳語謂公介疾猶可以愈熒枯糟沉何奪之遽全歸胡慚示别有𥙿所不粹者井蛇樹鼠公真至人逹於死生晝夜之故鳴呼公之學問不守訓詁公之詞章自諧律呂五韺六䪫九易十鼓弗圖末僞見此竒古後孔而生曷探其緒茫茫堪輿能言幾許於乎鄉失典刑族無長錐八壼水繞孰斯文主品樹隂成誰讀書祖瑣瑣林林百千何𥙷公像在前魂兮來雨盞斚序行殽核維旅公寧不來我涕如雨噫嘻嗟咨有宋莆陽黃四如先生窆穸東里族祭文方春和時鳥鳴花香念茲不見使我惻愴翁逰化城無何有鄉濶視八極俗物茫茫遐想疇昔鳩枝襄羊或哦一聮或酬一觴遺韻如存俾也可忘白日千年埋玉隴岡雲樹窈深回首坊堂東過腹痛諒母我傷惟翁德厚奕葉流光一杯黃壤發為詞章風水惟真子孫其昌依依活酹蘅若薦芳精靈不昧庶其願享訖鍳此忱視翁不忘嗚呼黃四如先生并二先生升侑鄉賢興化郡學祝文鄉賢祠于學者惟忠惟孝以德以文表表在人耳目者可得而仰也邇者薦紳之士議以烏山宋先生四如黃先生石崖方先生升侑斯堂同時位置尸祝而爼豆之某職教于茲敢不以告明薦馨香伏惟尚饗黃四如先生升侑鄉賢興化郡學東里孫子祝文鄉先生祠于學古也以吾祖道脉之傳經學之邃蔚為儒宗邇者庠序建言謂宜爼豆於諸賢之列聿新繪事㳙吉妥靈殷薦苾芬有宋莆陽黃四如先生事述見文獻通考黃仲元字善甫號四如績之子也少刻志讀濂洛關閩及父績所傳潘陳二師之書抄拾唐宋名人之文凡二百四十二家文學為人推重第咸淳進士前後五除官最後除國子監簿皆不赴宋亡後更其名曰淵字天叟又併改四如之號而以韻鄉聲翁彥安為稱怡然窮居深入理奧學文必檀弓榖梁學詩必三百篇陶韋桞州推廣先志凡其口講心授莫非仰止傳習之懿而尤嚴東湖之祠晨必謁朔望必參二仲釋菜暇則課守者灑掃風雨則視其蓋障雖老不少廢年八十二卒仲元說經間與先賢異同其為文亦類艱深至于竒古處殆不可句云有四書講稿等書藏于家出名公事述卷有宋莆陽黃四如先生卋次見三修黃氏族譜萬百十七朝奉郎國子監簿四如先生諱仲元字善甫幼名犀兒號四如居士後改名淵字天叟號韻鄉聱翁晚年又號彥安十三貢士房千百三學正獨不懼翁之次子也以宋紹定四年辛卯十月二十有八日已時生年十二攻舉子業鄉校屢占魁亞淳祐十二年壬子預薦書明年癸丑寶祐改元省試報罷咸淳七年辛未中省闈第五廷對以直言忤時宰置名張鎮孫榜第五甲賜同進士出身拜迪功郎監瑞安府比較務需次食貧如心陳文龍之號因貽書常齊延先生于二劉祠堂一月兩講為學者師九年癸酉捧檄考類試歸過鐔津古崖江公萬頃萬里之弟時守劔州留郡齊載之匯江未幾古心先生江萬里招致芝山十年甲戌請假歸省明年乙亥德祐改元先生始之官守相陳山泉屈致幕下有強民挾貴不禮稅官者又有頑佃二十年不歸田主之租者又有妄首富家造麯者先生一見悉為剖决山泉深喜得人無何山泉罷去以書别先生曰君來我去彼此無福又明年丙子春端明陸公君實秀夫至自平江偶與先生同邸極加器重三月杭陷先生遂辭歸五月陸公趣先生赴行都充益王府撰述官兼處置使司幹辦公事是月端宗即位改元景炎遷刑工部架閣以通直郎升武學諭不兼旬得五京薦處置使楊公刑部侍郎應公祭酒許公少傅張公其一即陸公也遂轉朝奉郎國子監簿兼福建路招捕使司都參議官先生雖受知諸公屢膺超擢然未嘗供一日聀未嘗食升斗之祿曰斯時而祿耻也及陸公拜樞使命撫諭使毛公邀先生同舟將有異除先生力以母老辭既易代先生遂更其名字隱居教授泊如也元皇慶元年壬子十一月八日丑時卒享年八十有二葬尊賢里吳車南山之原按先生夀藏自志云乙巳臘月營一貉之丘于篠塘而舊譜皆謂葬吳車南山意者初營夀藏在篠塘既卒而葬乃改營于吳車南山耳先生少刻意讀周程張朱呂真魏及父獨不懼翁先生所傳潘陳二師之書翁集四書為近思本録先生日夕刪𥙷翁有詩曰深為助我喜敢作譽兒癡復以以其餘力手抄唐宋名人文自韓柳歐曽外凡二百四十二家逮聚徒發䇿以周元公問行義多大成集所不載翁代季子仲固答且謂非吾兒不能問非老父不能對烏山方澄孫莆人守樵川一見稱賞館于樵川烏山殁先生家居不殖生産歲輟學職俸及束修以事如母孝敬兼盡嘗寄食富沙樗翁三薦于湖齊劉公先生不往謁劉公語人曰此兄當于古君子中求之窮居怡然深入理奧文必檀弓榖梁詩必三百篇陶韋栁州下此弗論也獨不懼翁于潘陳二師生為仰止之講殁有東湖之祀及卒先生推廣先志凡其見於修巳教人者無非仰止之懿而於東湖之崇奉尤拳拳焉族伯千三十通判殁所居㕔事先生與諸弟姪得之因倡率創以為祠以祀吾御史府君而下之祖即今東里黃氏思敬堂詳見所作思敬堂記及碑隂記嘗著檮杌集識此邦之仕於朝者與士而求仕及他州士夫仕於此邦者景炎二年丁丑屠城之變此集與前後告身俱亡又著學記農談未及修春秋說止閔公未及續嘗夢宣尼遺之雙筆又欲修史而未果大槩見文集夢筆記其著述巳成而行於世者惟經史辨疑四如講稿及文稿詳見先生自志夀藏吳司業源所著名公事述宋學士濂等所作文集序俱載詩文內編經史辨疑今亦亡配丁氏懷安尉斗軒先生南一之女也以弟萬百三十一仲㑹季子梓為後羅源縣尹先生今祀於郡學鄉賢祠
