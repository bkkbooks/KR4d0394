  - {type: variant, offset: 0, length: 184, content: 有宋福建莆陽黃仲元四如先生文藁前序莆前一輩四如黃先生爲名進士爲經學老師爲詞章大家數異時艾軒翁以經學鳴遭際阜陵致身法從莆士之談性理者率皆其徒二劉後人則有若樗庵翁以詞章著穆陵脊之厚當兩制躋文昌莆士之工詞章者多師之若四如翁則瓜山先生之嫡孫行家庭師友究之經學䆳矣演迤而爲詞章汪洋大肆若記序若碑銘若題跋蒼然之光淵然之色未嘗求合於古也而制雅未嘗務去陳言也而意新未嘗求異於人之說也而, WYG: ''}
