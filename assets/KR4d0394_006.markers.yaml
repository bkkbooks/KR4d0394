  - {type: variant, offset: 478, length: 437, content: 先生文藁後跋曩僕客授莆陽獲從監簿四如先生黃公游嘗熟其議論凡天地萬物萬事之理古今治亂興亡之變若江漢之滔滔莫詰其極而其文閎深髙古精義入神好作一字二字或三字四字句勢迫曲禮檀弓不造不止蓋其學上接艾軒樂軒網山諸老之傳言言根據字字淵源汪洋奇崛自成一家近世作者誠罕及也爰擢髙官轍所至如吾郷古心江公廬陵須溪劉公皆一時文章宗伯莫不傾盖願納交焉則其他名勝從可知已更代以來􅖏戸掃讀教授郷里立雪講下者率多奇才今三歲大比巍疊出有自來也嗚呼貞元朝士不可復得矣以公之學雖不及見用於當時而隻字片言流落人間者真足以淑後進而範将来其功豈尋常誇一時沽一名者之可擬哉僕朅来延平甫一載公之子子材適赴汀幕而其孫喬年又来爲延平録邂逅道舊且出公生平所著文若干卷俾㒒叙其顚末㒒非才何足以當之追惟别公幾三十年而㒒亦老矣思芹泮之嬉㳺懷詠觴之酬酢風廊燈火共話短長猶一日也壺山在眼獨無情乎姑勉叙疇昔交情之舊書其後若夫公之高風雅操與夫雄文巨冊自有燕許大筆發揚編首且將鋟梓上之太史氏備采錄云至治癸亥秋九後學廬山曹謹䟦有宋莆陽黃四如先生文, WYG: ''}
