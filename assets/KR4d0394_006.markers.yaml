  - {type: variant, offset: 15, length: 4, content: 記後䟦夢, WYG: 入福蒼生也大臣身在江湖心在魏闕一處一出與隂陽相為消長亦必有道又非兒童走卒之所能知前修偉人魏野一詩獨勸子明王旦字以退明允一書獨愛富公以徳某也始見安敢輕浮作此躁語将謂孫家同榜子弟當以禮拜沂公歟寒門落落望雲霄閥如梯天政不敢自陳家世事分於相國也將謂文潜客於少公文潜張耒也少公潁濵也文潜淮隂人與晁秦黃號四先生並從東坡逰張初游學於陳學官轍愛之因從軾從軾亦闕而稱其一唱三嘆亦當與晁秦黃學士師事長公歟晁補之秦觀黃庭堅東坡長公顦顇視姬姜自覺形穢政不敢居叅門館下士於相國也否則以所業徹於相國歟某生為人又為丈夫固不可與空生物穢天壤間然書可成也仲塗十年一闕不遽語之門人程易傳最晩出且謂說得七分史闕修也唐鑑多有好處亟戒開封毁板新唐書經歐宋名}
