  - {type: variant, offset: 155, length: 1, content: 極, WYG: 禹貢復讐之春秋傷財害民之國服爲息國服謂生民於國所服之閑農圃類也息者保之使生息也出周禮泉府王安石謬引注疏以息爲利息而行青苗之法惟讀錯故用錯讀書正要有用書亦正未易讀冠仕冠棄壯仕壯棄某則不敢一行試吏成公呂氏之官箴西山眞氏之政經一一可以爲訓若臨大事當於六一翁處學來今之世惟古心先生清忠粹徳豐功盛烈載旂常銘鼎彛與臯伊傅呂周召並不知可與蘇子言容平生本末否某願問爲邦焉然則某之來無所摯而敢見乎曰不介不潔不敢見某於道之秋毫百未得一然某之學傳於先君子績先君子傳於𤓰山潘柄復齋陳宓復齋𤓰山親傳文公勉齋之學者也學孰大立身行已爲大時若命謀位與材㑹不憂不}
