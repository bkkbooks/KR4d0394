  - {type: variant, offset: 1049, length: 2191, content: 文堇堇未滿百篇傳人傳書此檐甚重䆠學它鄕巾篋自隨今又十年餘矣朝夕思所以傳而困於力山城公假督兒繕冩亟遣鏤板不惟思所以傳者逺而又欲廣其傳異時携書歸里搜訪裒稡當爲續集與四書講藁經史辨疑並行庶人與書俱傳而未艾也翁名仲广善甫字取堯夫善人吟以四如自號舉辛未進士第景炎徳祐後名淵字天叟號韻鄕聱翁彦安又晚年别號云時至治癸亥立秋日男將仕郎汀州路總管府知事黃梓百拜謹識有宋莆陽黃四如先生文藁後序夫文以氣爲主氣以理爲主理何在聚於書氣無形麗於理主之者誰歟曰心也文者心之聲也不至乎此則奴乎彼矣天地間惟氣與理亘萬古而長存凡天地隂陽四時之運日月星辰河漢之光此氣也其所以妙變化而神出入現光怪而發精華者非自然之理乎一以貫之文其形而下之噐乎孔子元氣也文章可得而聞者賛易刪詩定書修春秋而已曰作則未也文歟理歟孟子英氣也自謂我知言我善養吾浩然之氣觀其七篇浩博而豪肆文歟氣歟後之立言君子舍孔孟奚主哉莆陽自艾軒後以文鳴世者不少以理爲文者吾得一人焉黃四如先生是已先生抱道藏噐戴仁履義不偶於人而逹於天立言以垂後肆筆而成文此風行水上之文也惟其心孔孟救時之心學孔孟明道之學由體逹用著書滿家嘗誦其諸書講義詳明似經觧記筆森嚴似檀弓銘筆竒崛似三傳皆充其剛大配義之氣而見於嬉笑怒罵之間特緒餘耳徒文乎哉余以年家子不及拜公牀下從書疇先生借一帙得寓目焉他日編帙彚成獲見其大全又一快也非敢曰觀止此矣他不敢請敬識大槩附于卷末大明後學三山陳光庭拜書有宋莆陽黃四如先生文藁後序黃仲元字善甫號四如莆田人唐御史滔之後父績師陳宓潘柄氏爲性命道德之學雖布衣而名重東南著四書遺說近思録義類及讀畧續畧新畧傳習問荅畧凡數百卷仲元少刻志讀濂洛關閩及父績所傳潘陳二師之書手抄唐宋名人之文若韓柳歐魯外凡二百四十二家以文學盛爲一時諸老所推重至謂當於古君子中求之第宋咸淳進士前後五除官最後調國子監簿皆不赴宋亡後更其名曰淵字曰天叟又併改其四如之號而以韻郷贅翁彦安爲稱亦可槩見其志云怡然窮居深入理奥文必檀弓榖梁詩必三百篇陶韋柳州皆以向上自處自績北靣潘陳生爲仰止之講没有東湖之祠績卒而仲元推廣先志凡其口講心授莫非傳習仰止之懿而尤嚴東湖之崇晨必謁朔望必參二仲必釋菜暇則課守者洒掃風雨則視其盖障惟恐有穿漏可謂善繼善志而白首父師不忘矣年八十二卒所著有經史辯疑四書講藁文藁然仲元說經四書間與先賢異同其爲文亦類以艱深至於竒古絶處讀者殆不可句云四書講藁等書藏于家大明洪武某年月太子賔客詔充國子司業奉訓大夫莆陽呉源編有宋莆陽黃四如先生文集後識吾東里文獻之傳肇唐乾寧吾御史公稽之藝文志舊載泉山秀句集三十卷巳不存迨宋紹興狀元考功公所刻者惟今黃御史集十卷耳考功公所著知稼翁集序於洪景盧者皆無由見至宋慶元之間九世祖獨不懼公所著四書遺說近思録義類讀畧續畧新畧傳習問答畧凡數百卷咸淳之間八世祖四如公所著有經史辯疑四書講藁等書藏之家者今皆多逸失傳者惟此記序銘說所刻百餘篇而已嗚呼傳集之難若是哉仰獻追逺得無興深長之思乎鉞敬甫竊念東里樓下房祖始十三貢士公至監簿四如公爲七世公之子羅源尹子材公嫡孫喬年公爲樓下伯房仲孫昌年公爲樓下仲房泝流而源今去元大德二百四十禩則四如公實二伯仲房道學祖思吾道學祖不可得得見者惟兹一二遺文而已兹集始刻汀幕公癸酉秋希英弟令上海刻之官齋間多魚魯鉞敬甫續家譜時繙録兹文薫盥而讀之竊爲訂其訛􅍝釋其音義稽其故實第孱才末識齒敝神短訂弗精釋弗詳稽者十遺八九欲再梓以傳未能也重怏怏不克逺紹之慮歲乙酉兒文炳文蔚應郷闈黙慶以卒業辛卯夏文炳兒釋服上禮部廼出手稿授之曰黙若祐道學祖而當爲聞孫異日有禄俸之入當無負吾志嘗憶吾四如公記思敬堂曰吾家有顯融者良奥者脩之庀之猶今之年庻俾勿壊又誌壽藏曰黃在軒嘗許予文艾夜之太白殘年之卷施子材異時當爲余彚稡遺文以成余志余旣落落籍甚私於而有厚望文炳跪而受曰敢不服􅈾以壽先德謹誌之以竢大明嘉靖十年四月八日八代孫鉞敬甫頓首百拜識吾諸孫東松地官旣善繼吾師承德郎木齋翁志新梓九世祖四如公文集以書㝡便道過家掃祭公墓尊賢里嶺口廷宣方患眼疾不能偕行念公去後二百三十年有孫文炳克世其家振揚遺落此家慶也因而有作用見慰喜之私烏石山之前世家稱東黃品樹枝以繁印池流且長述者惇叙㕔作者思敬堂追逺跨隆棟無謀掣道傍圭田薦宏敞私第捐安詳憲憲旣在上言言亦在廊後人非木石家􅒑如琳琅艾軒尾蹊徑考亭闖門牆紹聞獨不懼仰止耿相將父子崇道德秦漢無文章註䟽採國史學殖鋤天荒綫緒者誰子九代生賢郎挺身甲科顯出門郎官揚得無念爾祖端可肩平當迢迢魚鳥跡惻惻蟲䑕傷躋之翼經史勝於陳衣裳茂草鞠周道枯藤掛斜陽手持日星文歩出狐兎場下書化冥貨掃地傾椒漿疾予聞蘇息觀駭走傍徨賢賢而親親作法永不忘嘉靖壬寅歲六月六日賜進士出身奉議大夫廣東按察司僉事裔孫東村廷宣頓首書跋右莆陽黃仲元四如先生文稿四卷明嘉靖刻本乃四明范氏天一閣故物今歸北平圖書館考仲元擢咸淳辛未進士與陸秀夫交善德祐之變秀夫趣仲元赴行都充益王府撰述官及兼福建路招捕使司都參議官等職皆辭不就宋社旣屋歸隱山林以濓洛關閩之說教於學者其子汀州路總管府知事梓分輯記序墓銘字訓之屬爲五卷刊之然遺文流落於外者尙多其曾孫至又裒爲十卷再刊之嘉靖辛卯八代孫鉞及其子文炳等又輯刻爲四卷卽此本也蓋至是其集凡三付剞劂矣今五卷本十卷本均佚傳世者當以此爲最古最備之本四庫全書本卷數與此本同惟割裂第一卷自得齋記以下至韻鄕記爲第二卷又合卷二卷三兩卷爲第三卷爲異耳仲元別著四如講稿六卷有嘉靖丙午刻本版式與此本略同他日當別謀印之海寧趙萬里, WYG: ''}
