  - {type: variant, offset: 13, length: 1, content: 夢, WYG: 書古者士之摯雉若見於師以菜為摯曷為或以雉或以菜雉言介也菜言㓗也士不介不㓗不敢見然士之見於周公者十人三十人百餘人千餘人何多周公於十人三十人百餘人千餘人中僅得三士何少周之士俱自好亦游大人以成名乎公好士如不及亦為之厚薄貌乎舍三士他無人乎漢不古摯禮廢掃門者艱於一見不嫁者禮之上賔魏勃掃曹相國門以求見蒯通見曹相國曰婦有夫死三日嫁者有幽居不嫁者求婦何取曰不嫁者通曰求臣亦猶是東郭先生梁石君齊隱居不嫁願禮之相國皆以為上賔宰天下士者必有所擇唐之士摯以文貴之甚賤之甚以古文倡者光範之伏其氣餒釋言之辨其辭費芻米僕賃之急其得小不免為今之人我朝諸賢犖犖音落可外文字猶用片言摯於王公矧碌碌者疇能自異然則某固願聞名於將命者何也古心先生一代不數人百年能幾見者也某生長東南非不知有伯淳范祖禹謂顔子不貳過惟伯淳能之時陳瑩中不識伯淳作責沈文以自責雲山塹隔伏謁無路今詣康廬登龍門矣然與其相羊於某丘某水先生舊所釣游之處使人意遐而清不若侍坐於書册琴瑟之前得見宗廟百官之富崑崙在望滄海在前而猶不即猶空此生如獲一見相國矣將與四方竒士交譽盛德歟某言呐音訥辭柮音咄政不能譽縱譽之一把泰山不加益國憂如􅄠士低如䑕李斯少時見厠中䑕食不絜近人人數驚倉中䑕居大廡不見人大憂嘆曰人之賢不肖如䑕矣時人之耳目在先生公論之標表在先生世道之輕重天下之安危在先生九州四海孰不期先生之再提一}
