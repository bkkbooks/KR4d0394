  - {type: variant, offset: 2720, length: 1392, content: 唐宋名人之文凡二百四十二家文學爲人推重第咸淳進士前後五除官最後除國子監簿皆不赴宋亡後更其名曰淵字天叟又併改四如之號而以韻鄉聲翁彦安爲稱怡然窮居深入理奥學文必檀弓榖梁學詩必三百篇陶韋桞州推廣先志凡其口講心授莫非仰止傳習之懿而尤嚴東湖之祠晨必謁朔望必參二仲釋菜暇則課守者洒掃風雨則視其盖障雖老不少廢年八十二卒仲元說經間與先賢異同其爲文亦類艱深至扵竒古處殆不可句云有四書講稿䓁書藏于家出名公事述卷有宋莆陽黄四如先生卋次見三脩黄氏族譜萬百十七朝奉郎國子監簿四如先生諱仲元字善甫㓜名犀児號四如居士後改名淵字天叟號韻鄉聱翁晚年又號彦安十三貢士房千百三學正獨不懼翁之次子也以宋紹定四年辛卯十月二十有八日已時生年十二攻舉子業鄉校屡占魁亞淳祐十二年壬子預薦書明年癸丑寳祐改元省試報罷咸淳七年辛未中省闈第五廷對以直言忤時宰寘名張鎮孫榜第五甲賜同進士出身拜迪功郎監瑞安府比較務需次食貧如心陳文龍之號因貽書常齋延先生扵二劉祠堂一月兩講爲學者師九年癸酉捧檄考類試歸過鐔津古崖江公萬頃萬里之弟時守劔州留郡齋載之匯江未幾古心先生江萬里招致芝山十年甲戌請假歸省明年乙亥德祐改元先生始之官守相陳山泉屈致幕下有強民挾貴不禮稅官者又有頑佃二十年不歸田主之租者又有妄首富家造麯者先生一見悉爲剖决山泉深喜得人無何山泉罷去以書别先生曰君来我去彼此無福又明年丙子春端明陸公君實秀夫至自平江偶與先生同邸極加噐重三月杭䧟先生遂辭歸五月陸公趣先生赴行都充益王府撰述官兼處置使司幹辦公事是月端宗即位改元景炎遷刑工部架閣以通直郎陞武學諭不兼旬得五京薦處置使楊公刑部侍郎應公祭酒許公少傅張公其一即陸公也遂轉朝奉郎國子監簿兼福建路招捕使司都參議官先生雖受知諸公屡膺超擢然未嘗供一日聀未嘗食升斗之禄曰斯時而禄耻也及陸公拜樞使命撫諭使毛公邀先生同舟將有異除先生力以母老辭旣易代先生遂更其名字隱居教授泊如也元皇慶元年壬子十一月八日丑時卒享年八十有二葬尊賢里吳車南山之原按先生夀藏自誌云乙巳臘月营一貉之丘扵篠塘而舊譜皆謂葬吳車南山意者初營夀藏在篠塘旣卒而葬乃改營扵吳車南山耳先生少刻意讀周程張朱呂真魏及父獨不懼翁先生所傳潘陳二師之書翁集四書爲近思本錄先生日夕刪𥙷翁有詩曰深爲助我喜敢作譽児癡復以以其餘力手抄唐宋名人文自韓柳歐曽外凢二百四十二家逮聚徒發䇿以周元公問行義多大成集所不載翁代季子仲固答且謂非吾児不能問非老父不能對烏山方澄孫莆人守樵川一見稱賞舘扵樵川烏山殁先生家居不殖生産歲輟學職俸及束脩以事如母孝敬兼盡嘗寄食富沙樗翁三薦扵湖齋劉公先生不徃謁劉公語人曰此兄當扵古君子中求之窮居怡然深入理奥文必檀弓榖梁詩必三百篇陶韋栁州下此弗論也獨不懼翁扵潘陳二師生爲仰止之講殁有東湖之祀及卒先生推廣先志凢其見於脩巳教人者無非仰止之懿而於東湖之崇奉尤拳拳焉族伯千三十通判殁所居㕔事先生與諸弟姪得之因倡率剏以爲祠以祀吾御史府君而下之祖即今東里黄氏思敬堂詳見所作思敬堂記及碑隂記嘗著檮杌集識此邦之仕於朝者與士而求仕及他州士夫仕於此邦者景炎二年丁丑屠城之變此集與前後告身俱亡又著學記農談未及脩春秋說止閔公未及續嘗夣宣尼遺之䨇筆又欲脩史而未果大槩見文集夣筆記其著述巳成而行於世者惟經史辨疑四如講稿及文稿詳見先生自誌夀藏吳司業源所著名公事述宋學士濂等所作文集序俱載詩文内編經史辨疑今亦亡配丁氏懐安尉斗軒先生南一之女也以弟萬百三十一仲㑹季子梓爲後羅源縣尹先生今祀於郡學鄉賢祠, WYG: ''}
