  - {type: line-break, offset: 0, content: '', id: KR4d0394_SBCK_005-1a01}
  - {type: variant, offset: 0, length: 2736, content: 有宋福建莆陽黄仲元四如先生文藁卷全上江古心先生書古者士之摰雉若見於師以菜爲摰曷爲或以雉或以菜雉言介也菜言㓗也士不介不㓗不敢見然士之見於周公者十人三十人百餘人千餘人何多周公於十人三十人百餘人千餘人中僅得三士何少周之士俱自好亦㳺大人以成名乎公好士如不及亦爲之厚薄貌乎舎三士他無人乎漢不古摯禮廢掃門者艱於一見不嫁者禮之上賔魏勃掃曹相國門以求見蒯通見曹相國曰婦有夫死三日嫁者有幽居不嫁者求婦何取曰不嫁者通曰求臣亦猶是東郭先生梁石君齊隱居不嫁願禮之相國皆以爲上賔宰天下士者必有所擇唐之士摰以文貴之甚賤之甚以古文倡者光範之伏其氣餒釋言之辨其辭費芻米㒒賃之急其得小不免爲今之人我朝諸賢犖犖音落可外文字猶用片言摯於王公矧碌碌者疇能自異然則某固願聞名於將命者何也古心先生一代不數人百年能㡬見者也某生長東南非不知有伯淳范祖禹謂顔子不貳過惟伯淳能之時陳瑩中不識伯淳作責沈文以自責雲山塹隔伏謁無路今詣康廬登龍門矣然與其相羊於某丘某水先生舊所釣㳺之處使人意遐而清不若侍坐於書冊琴瑟之前得見宗廟百官之富崑崙在望滄海在前而猶不即猶空此生如獲一見相國矣将與四方竒士交譽盛德歟某言呐音訥辭柮音咄政不能譽縱譽之一把㤗山不加益國憂如髮士低如䑕李斯少時見厠中䑕食不㓗近六人数驚倉中䑕居大廡不見人大憂嘆曰人之賢不肖如䑕矣時人之耳目在先生公論之標表在先生世道之輕重天下之安危在先生九州四海孰不期先生之再提一筆入福蒼生也大臣身在江湖心在魏闕一處一出與隂陽相爲消長亦必有道又非兒童走卒之所能知前脩偉人魏野一詩獨勸子明王旦字以退明允一書獨愛富公以德某也始見安敢輕浮作此躁語將謂孫家同榜子弟當以禮拜沂公歟寒門落落望雲霄閥如梯天政不敢自陳家世事分於相國也將謂文潜客於少公文潜張菜也少公頴濵也文潜淮隂人與晁秦黄吳四先生並從東坡逰張初㳺學於陳學官轍愛之因軾亦深知而稱其一唱三嘆亦當與眺秦黄學士師事長公歟眺𥙷之秦觀黄廷堅東坡長公顦顇視姬姜自覺形穢政不敢居叅門館下士於相國也否則以所業徹於相國歟某生爲人又爲丈夫固不可與空生物穢天壌間然書可成也仲塗十年一書不遽語之門人程易傳㝡晚出且謂說得七分史可脩也唐鑑多有好處亟戒開封毁板新唐書經歐宋名筆猶無一毫前漢義理微宻工夫浩大二事俱難草草文可工也語言妙天下者讀同列一䟽乃遂不復自爲人目爲夫子者作六經閣記終不可主公意詩可學也建安黃初暨晚唐㡬千百家獨子羙不可擬議江西宗派吕居仁以歌詩至豫章大出而學者同作共和錄其名曰江西宗派以其源流皆出豫章也陳無已以下凢十四人傳衣付鉢范質舉進士主文和疑曰屈君十三欲傳老夫衣鉢也不如西湖處士以水影月香一聮行世茍焉引筆行墨髣茀聲嗽恐非當行家非不欲爲之不敢易爲也就爲之如北方竫人見者齒矧山海經云東海之外有小人名曰竫人列子書今之世惟古心先生傳逺之書名世之史金石之文絃歌之詩與易詩書禮樂春秋等不知可與陳無已盡言否某願執經焉又否則見相國當談政事不談文學歟某謂六經四書言言是理言言是用一部論語趙普後先可事兩朝正心誠意四字朱子中塗可持告君彼行河之禹貢復讎之春秋傷財害民之國服爲息國服謂生民於國所服之閑農圃類也息者保之使生息也出周禮泉府王安石謬引注䟽以息爲利息而行青苗之法惟讀錯故用錯讀書正要有用書亦正未易讀冠仕冠棄壯仕壯棄某則不敢一行試吏成公吕氏之官箴西山真氏之政經一一可以爲訓若臨大事當扵六一翁處學來今之世惟古心先生清忠粹德豊功盛烈載旂常銘鼎彛與皐伊傅吕周召並不知可與蘇子言容平生本末否某願問爲邦焉然則某之來無所摰而敢見乎曰不介不㓗不敢見某於道之秋毫百未得一然某之學傳於先君子績先君子傳扵瓜山潘柄復齋陳宓復齋瓜山親傳文公勉齋之學者也學孰大立身行已爲大時若命謀位與材㑹不憂不通顯欲得汗青一幅芬芳百世則實難難故脫凡近志高明陋希世友千古居於家凛凛乎如處女之在閨處於鄕兢兢乎如懐千金之璧而行不待謁刺餙游聲人故識靣者少不作一皺眉事亦不受人指點以廷對見君父第一歩直透剛膓所欲言者一落千丈無戚容以一命之士皆可行志求爲歩兵而歸麄冗淹速不屑意人或朝得軒裳暮馳奔車之上乃獨退然􅖏戸與孔門冠童者遊􅖏徒古切塞也人或倚一郡爲北道主人鄧晨爲常山守王郎反光武走信都晨請從光武曰從我不如以一郡爲北道主人乃歸邵竊竊焉爼豆從事之列乃獨謝以爲煩願從子弟尋劉公父子讀書處則某之所存亦少異乎人也昔黄叔度之賢無一見於外而林宗重之李仲元蜀人不持一字於楊雄之門而法言書之淆之不濁者其志潔林宗逰汝南徃從憲累方還曰叔度汪汪千頃陂澄之不清淆之不濁不可量也不屈不累其行介故可重可書今有人焉氏名與二子同志行與二子同古崖旣取之於驪黄牝牡之外矣古心先生天眼一盻儻歆然曰若士也爲子必孝爲臣必忠必不讀父書而敗趙括必不游師門而叛必不兩來張師德必不三變商君帝王伯商君始說孝公以帝道不聽又以王道不入終以伯道公與語不自知膝之前席也進而教之又幸也仰惟古心先生之心先知覺後知先覺覺後覺之心也巳欲立而立人巳欲逹而逹人之心也此心流行天地並生物我同體相國之門未有一人不爲道周德全之士豈但薦藉華寵其身哉某故願先生輔之翼之振德之某之挈挈而來也思拜羽儀如渇如飢五歩十歩盤紆樊中脩摰師門又何遲也若曰子來幾日然後求見長者則克之罪大若曰彼亦人耳傲將何求則愈之過小恃此無恐先生儻與其介也㓗也某敢不立雪以請惟先生亮之有宋莆陽黃四如先生考終東里黃族祭文則陽四七維公初度綵闈洗腆致用清酤豈伊異人耋少和儒公於是時烝衎樂胥促席鳴儔咏猶斯舞油油三爵燦燦霞炬筵空坐散醉極而窹謂公徥福百齡未暮後騎勿驅前山可數暢月生明陽囘一縷訝公不庭鼾睡卓午翼旦候公琅琅耳語謂公介疾猶可以愈熒枯糟沉何奪之遽全歸胡慚示别有𥙿所不粹者井蛇樹䑕公真至人逹於死生晝夜之故鳴呼公之學問不守訓詁公之詞章自諧律呂五韺六䪫九易十鼓弗圖末僞見此竒古後孔而生曷探其緒茫茫堪輿能言㡬許於乎鄉失典刑族無長錐八壼水遶孰斯文主品樹隂成誰讀書祖瑣瑣林林百千何𥙷公像在前䰟兮來雨盞斚序行殽核維旅公寧不來我涕如雨噫嘻嗟嗞有宋莆陽黄四如先生窆穸東里族祭文方春和時鳥鳴花香念玆不見使我惻愴翁逰化城無何有鄉濶視八極俗物茫茫遐想疇昔鳩枝㐮羊或哦一聮或酬一觴遺韻如存俾也可忘白日千年埋玉隴岡雲樹窈深囘首坊堂東過腹痛諒母我傷惟翁德厚奕葉流光一杯黄壌發爲詞章風水惟真子孫其昌依依活酹蘅若薦芳精灵不昧庻其願享訖鍳此忱視翁不忘嗚呼黃四如先生并二先生升侑鄉賢興化郡學祝文鄉賢祠于學者惟忠惟孝以德以文表表在人耳目者可得而仰也邇者薦紳之士議以烏山宋先生四如黃先生石厓方先生升侑斯堂同時位置尸祝而爼豆之某職教于玆敢不以告明薦馨香伏惟尚饗黃四如先生升侑鄉賢興化郡學東里孫子祝文鄉先生祠于學古也以吾祖道脉之傳經學之邃蔚爲儒宗邇者庠序建言謂宜爼豆於諸賢之列聿新繪事㳙吉妥靈殷薦苾芬有宋莆陽黃四如先生事述見文獻通考黃仲元字善甫號四如績之子也少刻志讀濂洛關閩及父績所傳潘陳二師之書抄, WYG: ''}
