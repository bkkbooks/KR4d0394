  - {type: line-break, offset: 0, content: '', id: KR4d0394_SBCK_001-1a01}
  - {type: variant, offset: 0, length: 1659, content: 有宋福建莆陽黄仲元四如先生文藁卷之壹夣筆記丙戌歲夏五八日午漏三刻後學黄天叟淵課兒講易罷坐而假寐夣一神人坐于龕龕音堪諦視之吾夫子燕居像也亟再拜稽首子曰女來前吾授女筆二淵敬受又拜子曰勿拜退懷其一窺其一圍徑三寸許漬墨濃甚䄂而請業於夫子偶角丱來覓句丱音貫遂覺驚喜相半廼自占曰筆者述也述事而書之者也其斯文之祥乎吾夫子筆絶於獲麟今一千八百年矣當時闕里弟子賢哲七十七人此筆奚不授孟子車軻字而後五季而上豈無大儒此筆奚不夣夫子嘗謂文王旣没文不在兹乎必如吾夫子而後以斯文爲已任夣者夫人所有而聖人之夣與夫人不同吾夫子舊嘗夣見周公於斯文聞而知之乎哉必如吾夫子而後精神心術與周公胥契於寤寐之間淵於斯文未聞萬分一世古人今思執筆從二孺子後不可得安敢歩趨吾夫子雖然吾夫子所以授筆於淵者何春秋感麟而作作起於獲麟則筆止於所起春秋經也續之僣或書帝正月或書陽正月皆叛經者然獲麟以後之史猶可得修乎漢司馬子長史記始黃帝終麟止而十二國世表起成周共和庚申以上傳疑矣班孟堅專志西漢史而秦伯莽盗世經㣲寓書法廼以更始帝著紀宜削遷固而下無譏焉唐陳伯玉自漢武迄唐爲後史記未及竟亦不傳宋邵堯夫皇極經世書上稽唐堯受命甲辰爲編年譜黜吕娥姁進孺子嬰以土后魏附梁以字文周附陳夫豈無見而書少帝恒山王書曹魏接獻帝或者疑焉張敬夫經世紀年夏少康出處復國甚悉所假立惠帝子不得紀元關渉世運稍大而最可議者山陽公尚存即絶漢而予蜀司馬君實先約戰國至秦二世如左氏體名爲通志後作通鑑劉道原之力居多而是非予奪一出光手秦以前或即通志也舉要曆稽古錄歴年圖俱助此書之不及其曽孫伋經緯離析圖又惟與兩漢西晉隋唐以一綂然一綂與正綂異一綂而正者若唐虞夏啇周其次漢唐與宋若西晉若隋雖一而未正朱元晦綱目於始皇二十六年大書而不分註意謂前亡後繫朝覲皆歸即爲正綂當送一難左氏傳終魯悼之四年實周貞定王之五年也繇貞定王戊寅距威烈王丁丑六十載間於史闕如此大欠事吕伯恭以魯史左氏國䇿史記説苑諸書修之曰大事記上接西狩下止征和漢武繫楚義帝繫高后一失一得識者自識然於周魯七國事跡疎畧此史之所以不可不修繼周者百世可知或者吾夫子授筆之意其在兹乎雖然史未易脩也乹坤未毀老身長在無憂衣食亂其心此夣决不貧負獨念家無屋壁之藏世多遺軼之書軼與逸同畜眼未見下筆恐未精妙惟吾夫子隂隲之俾昌斯文又昌我後之人淵遂次前語爲夣筆記淵舊讀一書記夫子作孝經時簮筆拜北辰老忘所出何休序公羊傳曰孔子有云吾志在春秋行在孝經此二經者夫子二筆與孝經當時授之子輿而春秋筆削子夏不能賛一辭朱元晦謂孝經曾氏門人所記若以爲夫子自著可笑之尤吾鄉鄭漁仲又疑夫子所取魯史之筆適至獲麟時欲修之而未及修然非與後乎此復夣夫子記問此事記成之明日淵敬䟦族祠思敬堂記堂以祠名即古家廟或曰影堂東里族黃氏春秋享祀歲節序拜之所也堂以思敬名何祭之所思主乎敬也所以有斯堂者何堂即族伯通守府君諱時之舊㕔事某與弟仲固日新直公即仲稼公姪現祖與權朱公得之不欲分而有之願移爲堂而祠吾族祖所自出御史公諱滔以下若而人評事公諱陟以下大宗小宗繼别繼襧若而人古者諸侯適子之弟爲别子别子長子継别爲大宗百世不遷别子之次子以其長子継巳謂之継禰爲小宗五世則遷大宗一小宗四継高祖継曽祖継祖継禰上治旁治下治序以昭穆凡十三代上治祖禰尊尊也下治子孫親親也旁治昆弟合族以食序以昭穆别之以禮義人道竭矣亦曰天之生物一本也子孫孫子親親故尊祖尊祖故敬宗敬宗故收族不則何以奠世系聯族屬接文獻而相與維持禮法於永年哉雖然不敬惡惡可敬所以致愛也所以致慤也致愛極其愛親之心致慤極其敬親之心而所以致愛致慤者又存乎心惟有怵惕悽愴怵惕驚動貌悽慘悲傷貌之心春有怵惕之心秋有悽愴之心故祭之前期思其居處笑語思其所樂所嗜居處笑語樂嗜往而不反非有實也豈形体所能交思之所至足以通之矣以已之精明而與慌惚交然後祭之質明比而始行事記其立敬以詘其進敬以愉其薦敬以欲身詘而爲之變色愉而致其親心欲而兾其享巳徹而退色不絶於面則慎終如始矣徹退敬齊之色陶陶遂遂陶陶思親心存乎内遂遂思親心逹乎外夫如是則所思者敬而各敬爾思也若悠悠而來不蠲不享祭畢餕餘汎汎而去此豈足以稱斯堂之名之義仲元竊念花樹韋家宗法畜眼所未及見族人逺来, WYG: ''}
