  - {type: variant, offset: 18602, length: 0, content: '', WYG: 色臭味間香山老坐東亭香山老白居易也香山有九老㑹以人觀物不以物觀物是時年壯氣鋭猶以遭不遭為幸不幸洎居洛第靜對寒碧吟醉醉吟浮雲富貴矣退省此老平生初以直道爭安危中不附離權勢終完節自高異日想像四等人物今皆歴歴踐言元微之劉夢得視之顙泚㣲之始峭直欲立名中見斥喪所守附宧貴得相晚節彌喪加亷節不餙夢得初附王叔文多中傷士類憲宗嗣位坐貶朗州乆召還作詩譏忿當路出播州後又召還作詩詆權近聞者益薄之褊心怨望晚年益偃蹇寡合雖然此猶唐士句奮百世上風百世下者誰句衛武公之詩三句賓筵一詩譬如新篁句得時張王勢欲騰騫懿戒二詩又如修林句禁持風雨猶欠}
