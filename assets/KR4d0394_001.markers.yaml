  - {type: variant, offset: 10694, length: 0, content: '', WYG: 所以崇孝况知而不傳居子所恥乎廼白府縣而禁經踰相翔按周禮修閭氏有禁徑踰者註云行不由正路此經字盖徑字之誤也廼謀族尊而計徒庸功程陶埴桷楹陶作瓦噐埴粘土陶人埏埴以為噐桷椽也楹柱也扣囊共平聲事廢者興而華表矗如舊者新而堂宇翬如像嚴貌古典刑如昨舟行者弭擢輿行者憑式游者觀者皆顯者來下馬題詠鄉役於丁酉冬祭落於戊戍春宫室始成祭之曰落又募司鑰者而屋之而榖之榖我妄榖俾勿壊是心亦非外至氣體之流通學問之肫切自然而然也噫嘻孝節公之祠初不待記而顯然德輶如毛民鮮克舉如先生者後絶嗣前無鄰子孫}
